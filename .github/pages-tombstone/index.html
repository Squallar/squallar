<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>rustdar has moved</title>

    <!--
      Three redirects, because each one reaches a reader the others do not.

      `canonical` is for search engines, which do not run the script and do not
      always honour a meta refresh. `refresh` is for a browser with scripting
      off. `location.replace()` is for everyone else, and is the fastest of the
      three.

      GitHub Pages serves static files and nothing else -- there is no way to
      set a `Location` header from here, so no real 301 is possible. This is the
      ceiling for the origin.

      Note who this file is NOT for: anyone with the old service worker still
      registered never sees it, because that worker answers navigations from its
      own cache. `sw.js` in this directory is what reaches them.
    -->
    <link rel="canonical" href="https://rustdar.mcswain.dev/" />
    <meta http-equiv="refresh" content="0; url=https://rustdar.mcswain.dev/" />
    <meta name="robots" content="noindex, follow" />

    <style>
      html {
        color-scheme: light dark;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 1.5rem;
        box-sizing: border-box;
        font: 16px/1.6 system-ui, -apple-system, "Segoe UI", sans-serif;
        background: Canvas;
        color: CanvasText;
      }
      main {
        max-width: 34rem;
        text-align: center;
      }
      h1 {
        font-size: 1.5rem;
        font-weight: 600;
        margin: 0 0 0.75rem;
      }
      p {
        margin: 0 0 0.5rem;
      }
      a {
        color: LinkText;
      }
      .quiet {
        opacity: 0.65;
        font-size: 0.9rem;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>rustdar has moved</h1>
      <p>
        It now lives at
        <a href="https://rustdar.mcswain.dev/">rustdar.mcswain.dev</a>.
      </p>
      <p class="quiet">
        Taking you there now. Update any bookmark pointing at this address.
      </p>
    </main>

    <script>
      // `replace`, not `assign`: this page must not be left in the back stack,
      // or Back lands here and bounces the reader forward again.
      //
      // No service-worker teardown here on purpose. Unregistering from the page
      // would remove the registration before `sw.js` could install, and it is
      // `sw.js` that clears the caches and moves the reader's other open tabs.
      // A reader who reaches this file over the network still has that
      // registration, so the browser's update check on this very navigation
      // installs the tombstone worker behind them.
      location.replace("https://rustdar.mcswain.dev/");
    </script>
  </body>
</html>
