name: Android

# Every Android source file in this repo is behind `#[cfg(target_os = "android")]`,
# so `cargo check --workspace` on the host compiles *none* of it and passes clean
# no matter how broken the JNI bridges are. The rustls-platform-verifier 0.6->0.7
# bump (and the jni 0.21->0.22 bump it drags in) went green through Build, Clippy
# and Test while `./gradlew assembleDebug` was failing at `:app:buildRustLibDebug`.
#
# This workflow is the cheapest gate that would have caught that: a cross-check
# for the Android target, plus a guard on the jni/verifier duplication that is the
# silent half of the same failure mode.

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: '${{ github.workflow }} @ ${{ github.ref }}'
  cancel-in-progress: true

jobs:
  # An `android-theme-check` job used to sit here, cross-compiling the NDK-free
  # `rustdar-android-theme` crate for aarch64 in seconds as a fast tier-1 canary.
  # That crate is gone -- its function is now `rustdar_android::detect_dark_theme`.
  #
  # The signal is still available without an NDK, and covers strictly more than
  # the old job did:
  #
  #     cargo check -p rustdar-android --features jni-typecheck
  #
  # See that feature's comment in `rustdar-android/Cargo.toml`. Wiring it up as a
  # job is deliberately left to whoever owns this file next.

  # The full cross-compile of the crate that actually produces
  # librustdar_android.so. This one needs the NDK, because `ring` (via reqwest ->
  # rustls) has a build script that compiles C and a bare `cargo check --target
  # aarch64-linux-android` will fail in it with no cross linker/sysroot. cargo-ndk
  # exists to export the CC/AR/CARGO_TARGET_*_LINKER variables that make that work.
  # The ubuntu-24.04 image ships an NDK, so this costs an install of cargo-ndk and
  # nothing else -- no sdkmanager download.
  android-check:
    name: Android check (cargo-ndk)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust
        run: |
          rustup default stable
          rustup target add aarch64-linux-android x86_64-linux-android
      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libudev-dev
      - name: Cache cargo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-
      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked --version ^4
      - name: cargo ndk check (both shipped ABIs)
        shell: bash
        run: |
          set -euo pipefail
          # The runner exports ANDROID_NDK_LATEST_HOME into the OS environment;
          # cargo-ndk looks for ANDROID_NDK_HOME / ANDROID_NDK_ROOT. This has to be
          # read in the shell -- GitHub's `env` context does not contain runner OS
          # variables, so `${{ env.ANDROID_NDK_LATEST_HOME }}` expands to empty.
          export ANDROID_NDK_HOME="${ANDROID_NDK_HOME:-${ANDROID_NDK_LATEST_HOME:-${ANDROID_NDK_ROOT:-}}}"
          if [ ! -d "$ANDROID_NDK_HOME" ]; then
            echo "::error::No NDK found (ANDROID_NDK_HOME='$ANDROID_NDK_HOME')"
            exit 1
          fi
          echo "Using NDK at $ANDROID_NDK_HOME"
          cargo ndk -t arm64-v8a -t x86_64 check -p rustdar-android

  # The *silent* half of the same failure. Bumping `jni` or
  # `rustls-platform-verifier` alone still compiles: cargo just links two copies of
  # the verifier. `rustdar-android` then initialises one via `init_with_env` while
  # every reqwest client reads the other, uninitialised, and Android TLS setup
  # becomes a no-op that nothing detects until an on-device HTTPS request fails.
  # No compile check can see this, so assert single-version resolution directly.
  android-dep-unification:
    name: Android dependency unification
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust
        run: rustup default stable
      - name: Assert one jni and one rustls-platform-verifier
        shell: bash
        run: |
          set -euo pipefail
          fail=0
          for crate in jni rustls-platform-verifier; do
            # `cargo tree -i` prints one root line per resolved version of $crate.
            versions="$(cargo tree -i "$crate" \
              --target aarch64-linux-android -e normal --prefix none 2>/dev/null \
              | grep -E "^${crate} v" | sort -u || true)"
            count="$(printf '%s\n' "$versions" | grep -c . || true)"
            if [ "$count" -ne 1 ]; then
              echo "::error::expected exactly 1 version of ${crate}, found ${count}:"
              printf '%s\n' "$versions"
              fail=1
            else
              echo "ok: ${versions}"
            fi
          done
          exit $fail

  android-success:
    name: Android success check
    if: always()
    runs-on: ubuntu-24.04
    needs: [android-check, android-dep-unification]
    steps:
      - name: Report job results
        shell: bash
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: echo "$NEEDS"
      - name: Fail if any job did not succeed
        if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped') }}
        shell: bash
        run: |
          echo "::error::One or more required jobs did not succeed; see the results printed above."
          exit 1
