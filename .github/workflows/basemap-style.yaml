name: Basemap style

# The gate for `tools/basemap-style` and, through it, for `www/styles/`.
#
# Same mechanism as `.github/workflows/tiler.yaml`, which documents it at
# length: that crate is its own workspace root, so `clippy.yaml`'s
# `cargo fmt --all` / `cargo clippy --all-targets --all-features`,
# `build.yaml`'s `--workspace` rows and its `standalone` row's
# `cargo tree --workspace --depth 0`, and `test.yaml`'s single root
# `cargo llvm-cov` all enumerate workspace *members* and walk straight past
# `tools/`. Without a file like this one the directory is compiled by nothing,
# formatted by nothing and linted by nothing.
#
# What is different here, and why this file is not just a second copy of
# `tiler.yaml`: the tiler's suite tests only the tiler. This crate's
# `tests/converted_styles.rs` is 29 tests that open
# `www/styles/{dark,light}.json` off disk and parse them through
# `walkers::style`'s own deserialiser -- the very type `squallar-egui`
# deserialises those files with at runtime. So this is the only automated check
# anywhere that the two committed style files are still loadable.
# `www/styles/**` is in the `paths:` trigger below for exactly that reason:
# those files are hand-edited source (see `tools/basemap-style/DECISIONS.md`,
# "This tool is a SEED, not a pipeline"), and a gate that did not re-run on a
# style edit would be decorative.
#
# It only gates. Nothing here commits, uploads or publishes, which is why the
# permissions below are read-only and why there is no app-token step.

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'tools/basemap-style/**'
      # The files the suite reads. A hand-edit to either one is the change this
      # gate exists to catch.
      - 'www/styles/**'
      # NOT present in `tiler.yaml`, and the asymmetry is deliberate rather
      # than carelessly copied: the tiler depends on no workspace crate by
      # path, whereas this crate's dev-dependency is
      # `walkers = { path = "../../vendor/walkers", features = ["mvt"] }`.
      # The suite's whole claim is that the styles parse through *that*
      # deserialiser, so a change to it can turn these 29 tests red without
      # touching either directory above.
      - 'vendor/walkers/**'
      - '.github/workflows/basemap-style.yaml'

permissions:
  contents: read

concurrency:
  group: '${{ github.workflow }} @ ${{ github.ref }}'
  # Nothing is written anywhere, so an obsolete run is only burnt minutes.
  cancel-in-progress: true

jobs:
  gate:
    name: Build, format, lint and test the basemap style converter
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # `rustup show` installs exactly the toolchain rust-toolchain.toml pins,
      # rather than whatever the runner image ships.
      - name: Install Rust
        run: rustup show

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: basemap-style
          # Required, not an optimisation. rust-cache defaults to the workspace
          # at the checkout root, and this crate is not in it, so without this
          # line nothing about this job is cached at all. It has no committed
          # Cargo.lock -- see its `.gitignore` -- so no `--locked` below.
          workspaces: 'tools/basemap-style'

      # `[profile.release]` in this crate's manifest sets `opt-level = 3`, and
      # nothing else in CI ever compiles it: every other command in this file
      # builds a debug test harness. Cheap here -- the whole graph is
      # serde_json plus, for the tests, walkers/mvt.
      - name: Build
        run: cargo build --release --manifest-path tools/basemap-style/Cargo.toml

      # Check, never write. A formatting *write* in this repo has to be
      # package-scoped for a different reason -- a workspace-wide one pulls
      # another worktree's in-flight files in -- but CI never writes anything
      # back, so this is just an assertion. `cargo fmt -p basemap-style` is not
      # an option from the root: `-p` selects among the *root* workspace's
      # members, and this package is deliberately not one.
      - name: Check formatting
        run: cargo fmt --manifest-path tools/basemap-style/Cargo.toml -- --check

      # `--all-targets` so `tests/converted_styles.rs` is linted too, not only
      # the library and the binary.
      - name: Run Clippy
        run: cargo clippy --all-targets --manifest-path tools/basemap-style/Cargo.toml -- -D warnings

      # The point of the file: the 29 tests over the committed styles.
      - name: Run tests
        run: cargo test --manifest-path tools/basemap-style/Cargo.toml
