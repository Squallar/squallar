name: Clippy
on:
  push:
  pull_request:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: '${{ github.workflow }} @ ${{ github.ref }}'
  # Never on main: `deploy-pages` requires this check to conclude `success` on
  # the deployed commit, and a superseded run concludes `cancelled`.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  clippy:
    name: Clippy
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Generate GitHub App Token
        # Fork PRs run without secrets, so minting would fail here before
        # clippy ever ran. Skip the mint for them; checkout below falls back to
        # the default GITHUB_TOKEN. The auto-commit step is skipped on every
        # pull_request event anyway (see below), so nothing on a fork PR needs
        # push credentials.
        if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: app-token
        with:
          client-id: ${{ secrets.AUTO_COMMIT_APP_ID }}
          private-key: ${{ secrets.AUTO_COMMIT_APP_KEY }}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # A skipped mint step yields an empty string, so `||` selects the
          # default token on fork PRs.
          token: ${{ steps.app-token.outputs.token || github.token }}
      # The cross-targets are named here rather than in rust-toolchain.toml,
      # which no longer carries a `targets` list -- see the note in that file.
      # This job verifies the autofixed tree on both arms below, so it needs
      # both stds.
      - name: Install Rust
        run: |
          rustup show
          rustup target add wasm32-unknown-unknown aarch64-linux-android
      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libudev-dev
      # rust-cache does cache `${CARGO_HOME}/bin`, but its key hashes every
      # Cargo.lock, so a dependency bump would rebuild cargo-ndk from source.
      # This key names only the tool and its version. `cache-bin` is off below
      # so the two do not store the same directory twice.
      - name: Cache cargo-installed binaries
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/bin
            ~/.cargo/.crates.toml
            ~/.cargo/.crates2.json
          key: ${{ runner.os }}-cargobin-clippy-cargo-ndk-4
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: clippy
          cache-bin: "false"
      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked --version ^4
      - name: Apply Clippy autofixes
        run: cargo clippy --all-targets --all-features --fix || true

      # The gate on the autofix. Nothing below this runs if it fails, and that
      # includes the commit+push.
      #
      # This bot pushes straight to main, and previously committed
      # unconditionally, re-running clippy only *after* the push -- so a rewrite
      # that broke the build was already on main before anything noticed.
      #
      # The cross arms are checked too, not just the host. `--fix` only sees the
      # host cfg arms but edits shared source that the Android and wasm arms also
      # compile, so a "redundant" clone it drops can break a call site behind
      # `#[cfg(target_os = "android")]` invisibly.
      - name: Verify the autofixed tree still builds (host)
        run: cargo build --workspace --all-targets --all-features
      # Every workspace member, every target. `--all-targets` only expands the
      # *selected* packages, so this was `-p rustdar-web -p rustdar-frontend`
      # until the three crates below stopped blocking `--workspace`.
      #
      # What it took: tokio is a target-gated dev-dependency in rustdar-radar,
      # rustdar-overlays and rustdar-egui (`rt-multi-thread` is not a feature
      # tokio accepts on wasm), which leaves `#[tokio::test]` unresolvable
      # there; and those crates' test modules also call reqwest APIs wasm does
      # not have (`ClientBuilder::timeout`, `Error::is_connect`) plus
      # `rustdar_radar::tls::default_is_ring`, itself `cfg(not(wasm32))`. Both
      # are handled by gating the modules on
      # `cfg(all(test, not(target_arch = "wasm32")))` -- the pattern
      # rustdar-radar/src/tls.rs already uses -- in 7 files across 3 crates:
      # archive.rs, level3.rs and srm.rs in rustdar-radar; hrrr/fetch.rs,
      # metar/fetch.rs and glm/fetch.rs in rustdar-overlays; tile_source.rs in
      # rustdar-egui. A new `#[tokio::test]` or reqwest-native call in an
      # ungated test module of those crates fails this row; put it behind the
      # same cfg.
      #
      # No `--all-features` here: that enables rustdar-gps/serial, which links
      # IOKit.
      #
      # Note `--all-targets` also compiles rustdar-web/tests/{pwa_assets,
      # sw_behaviour}.rs and rustdar-frontend/tests/wgpu_guard.rs here, so a
      # future host-only integration test in either crate would fail this row
      # spuriously -- gate any such test on `cfg(not(target_arch = "wasm32"))`.
      - name: Verify the autofixed tree still builds (wasm32)
        run: cargo check --workspace --all-targets --target wasm32-unknown-unknown
      - name: Verify the autofixed tree still builds (Android arm64-v8a)
        shell: bash
        run: |
          set -euo pipefail
          # Read in the shell: GitHub's `env` context does not carry runner OS
          # variables, so `${{ env.ANDROID_NDK_LATEST_HOME }}` is empty.
          export ANDROID_NDK_HOME="${ANDROID_NDK_HOME:-${ANDROID_NDK_LATEST_HOME:-${ANDROID_NDK_ROOT:-}}}"
          if [ -z "$ANDROID_NDK_HOME" ] || [ ! -d "$ANDROID_NDK_HOME" ]; then
            echo "::error::No Android NDK on this runner. Refusing to auto-commit a tree whose Android arm was never compiled."
            exit 1
          fi
          cargo ndk -t arm64-v8a -P 28 check -p rustdar-android --lib

      # Not on pull_request: that event checks out the detached PR merge ref,
      # so there is no branch here to commit to — the push either fails or
      # lands somewhere it should not. `on: push` fires for every same-repo
      # branch, so autofixes still land there through that event; fork branches
      # are out of reach by design.
      - uses: stefanzweifel/git-auto-commit-action@4a55954c782fc1ea30b9056cd3e7a2b40ca8887d # v7.2.0
        if: github.event_name != 'pull_request'
        with:
          commit_message: "chore: Apply clippy fixes"
          commit_user_name: usa-reddragon-auto-commit[bot]
          commit_user_email: 234130638+github-actions[bot]@users.noreply.github.com
          commit_author: "usa-reddragon-auto-commit[bot] <234130638+github-actions[bot]@users.noreply.github.com>"
      # The gating run. `-D warnings` goes here and not on the `--fix` step, so
      # the bot still autofixes what it can and the build fails only on the rest.
      #
      # This is what makes `unexpected_cfgs` load-bearing: a `rustdar-frontend`
      # build script that stopped emitting the `mobile` cfg produced warnings
      # nobody failed on, and Android and iOS silently took desktop memory
      # budgets.
      #
      # `--all-features` enables `rustdar-android/jni-typecheck`, so this lints
      # the JNI layer -- invisible to Clippy until that feature existed.
      #
      # Remaining gap: this is the *host* cfg of that code. The Android target
      # has no lint gate, and `cargo ndk clippy` reports 3 warnings from arms
      # only Android compiles. Adding that row means fixing those first.
      - name: Run Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings
