name: Clippy
on:
  push:
  pull_request:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: '${{ github.workflow }} @ ${{ github.ref }}'
  # Never on main: `deploy-pages` requires this check to conclude `success` on
  # the deployed commit, and a superseded run concludes `cancelled`.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # rustfmt, applied and committed back -- the same shape as `clippy` below.
  #
  # Its absence was not theoretical: `main` accumulated 68 unformatted hunks
  # across 16 files and no row ever went red, because Build, Clippy and Test
  # between them never ran rustfmt. It used to only ever read and fail; now it
  # writes, on the grounds that a machine-decidable fix a human has to make by
  # hand is a chore, not a gate.
  #
  # AFTER `clippy`, NOT BESIDE IT, and for two reasons. `cargo clippy --fix`
  # rewrites source and its output is not necessarily formatted, so formatting
  # has to come second or it formats a tree that is about to change. And both
  # jobs push to `main`: run in parallel they race, and the loser's push is
  # rejected as non-fast-forward. `if: always()` so a clippy failure does not
  # also suppress formatting -- the dependency is for ordering, not for
  # success.
  #
  # ON `--all`, which the project rule forbids for a write: that rule is about
  # a developer's machine, where a workspace-wide format pulls another
  # worktree's in-flight files into the tree. A CI runner has one clean
  # checkout of one commit and no other worktrees, so the hazard the rule names
  # cannot occur here. This is also the only spelling that formats every member.
  fmt:
    name: Format
    needs: [clippy]
    if: always()
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      # See zone-pack.yaml: `secrets` is not available in a step-level `if:`.
      AUTOCOMMIT_CLIENT_ID: ${{ secrets.SQUALLAR_AUTOCOMMIT_CLIENT_ID }}
    steps:
      # `main`'s ruleset refuses GITHUB_TOKEN; the app is a bypass actor.
      - name: Generate GitHub App Token
        if: env.AUTOCOMMIT_CLIENT_ID != ''
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: app-token
        with:
          client-id: ${{ secrets.SQUALLAR_AUTOCOMMIT_CLIENT_ID }}
          private-key: ${{ secrets.SQUALLAR_AUTOCOMMIT_PRIVATE_KEY }}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ steps.app-token.outputs.token || github.token }}
          # Whatever `clippy` just pushed, not the commit that started the run.
          ref: ${{ github.event_name == 'pull_request' && github.ref || github.ref_name }}
      # `rustup show` installs the toolchain rust-toolchain.toml pins, which is
      # what makes this reproducible: rustfmt's output is version-dependent, so
      # a check running some other rustfmt would disagree with a developer's.
      - name: Install Rust
        run: rustup show
      - name: Apply rustfmt
        run: cargo fmt --all
      # Not on pull_request: that event checks out the detached merge ref, so
      # there is no branch to commit to. Same rule as `clippy`.
      - uses: stefanzweifel/git-auto-commit-action@4a55954c782fc1ea30b9056cd3e7a2b40ca8887d # v7.2.0
        if: github.event_name != 'pull_request'
        with:
          commit_message: "chore: Apply rustfmt"
          commit_user_name: ${{ steps.app-token.outputs.app-slug && format('{0}[bot]', steps.app-token.outputs.app-slug) || 'github-actions[bot]' }}
          commit_user_email: ${{ steps.app-token.outputs.app-slug && '323064949+squallar-autocommit[bot]@users.noreply.github.com' || '41898282+github-actions[bot]@users.noreply.github.com' }}
      # The tripwire. After a successful write this passes trivially; it earns
      # its place when rustfmt cannot normalise something it also refuses to
      # fail on, which would otherwise leave the tree unformatted and the job
      # green.
      - name: Check formatting
        run: cargo fmt --all -- --check

  clippy:
    name: Clippy
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      # See zone-pack.yaml: `secrets` is not available in a step-level `if:`.
      AUTOCOMMIT_CLIENT_ID: ${{ secrets.SQUALLAR_AUTOCOMMIT_CLIENT_ID }}
    steps:
      # THE AUTOFIX PUSH NEEDS THE APP, for the same reason the coverage push
      # does: `main` carries a ruleset (pull_request plus
      # required_status_checks) and this bot pushes straight to it, so a
      # GITHUB_TOKEN push is refused with GH013. The Squallar-autocommit app is
      # a bypass actor on that ruleset.
      #
      # A CONSEQUENCE WORTH KNOWING: unlike GITHUB_TOKEN, an app push DOES
      # trigger workflows, so an autofix commit now starts a Build of its own --
      # and a Build on main deploys. The autofix is therefore back to being able
      # to reach production without a human in between, which is exactly what
      # the three "verify the autofixed tree" rows used to guard and which was
      # dropped by decision. `Run Clippy -D warnings` below still gates this
      # job, and build.yaml's matrix compiles every arm on that new run.
      #
      # Skipped when the app is not configured, and on fork PRs, which get no
      # secrets. The commit step is skipped on every pull_request anyway.
      - name: Generate GitHub App Token
        if: env.AUTOCOMMIT_CLIENT_ID != ''
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: app-token
        with:
          client-id: ${{ secrets.SQUALLAR_AUTOCOMMIT_CLIENT_ID }}
          private-key: ${{ secrets.SQUALLAR_AUTOCOMMIT_PRIVATE_KEY }}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ steps.app-token.outputs.token || github.token }}
      # HOST ONLY. The cross stds and cargo-ndk went with the verify rows that
      # used them -- nothing left in this job compiles for wasm32 or Android, so
      # installing their toolchains was pure runner time (cargo-ndk builds from
      # source). build.yaml still covers both arms. The binary cache went too:
      # it existed to hold cargo-ndk, and `rust-cache` below now has no reason
      # to keep `cache-bin` off.
      - name: Install Rust
        run: rustup show
      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libudev-dev
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: clippy
      - name: Apply Clippy autofixes
        run: cargo clippy --all-targets --all-features --fix || true

      # NO VERIFY BETWEEN THE AUTOFIX AND THE COMMIT. There used to be three
      # rows here -- host, threaded wasm32 and Android arm64-v8a -- gating the
      # push on the rewritten tree still compiling. They are gone by explicit
      # decision (2026-08-31), with the risk accepted: `--fix` only sees the
      # host cfg arms but edits shared source the other targets compile, so a
      # rewrite CAN reach main having broken an arm nothing here built.
      #
      # What still catches it, one push later rather than zero: build.yaml's
      # matrix compiles every one of those arms, and `Run Clippy` below still
      # gates this job on `-D warnings`. The cost of being wrong is a red board
      # and a revert, not a bad deploy -- a GITHUB_TOKEN push starts no Build,
      # so an autofix commit cannot deploy itself.

      # Not on pull_request: that event checks out the detached PR merge ref,
      # so there is no branch here to commit to — the push either fails or
      # lands somewhere it should not. `on: push` fires for every same-repo
      # branch, so autofixes still land there through that event; fork branches
      # are out of reach by design.
      - uses: stefanzweifel/git-auto-commit-action@4a55954c782fc1ea30b9056cd3e7a2b40ca8887d # v7.2.0
        if: github.event_name != 'pull_request'
        with:
          commit_message: "chore: Apply clippy fixes"
          # Matches whichever credential pushed, and both are in
          # renovate.json's gitIgnoredAuthors -- an author Renovate does not
          # recognise on one of its branches makes it treat that branch as
          # human-edited and stop maintaining it.
          commit_user_name: ${{ steps.app-token.outputs.app-slug && format('{0}[bot]', steps.app-token.outputs.app-slug) || 'github-actions[bot]' }}
          commit_user_email: ${{ steps.app-token.outputs.app-slug && '323064949+squallar-autocommit[bot]@users.noreply.github.com' || '41898282+github-actions[bot]@users.noreply.github.com' }}
      # The gating run. `-D warnings` goes here and not on the `--fix` step, so
      # the bot still autofixes what it can and the build fails only on the rest.
      #
      # This is what makes `unexpected_cfgs` load-bearing: a
      # `squallar-device-profile` build script that stopped emitting the
      # `mobile` cfg produced warnings nobody failed on, and Android and iOS
      # silently took desktop memory budgets.
      #
      # `--all-features` enables `squallar/jni-typecheck`, so this lints
      # the JNI layer -- invisible to Clippy until that feature existed.
      #
      # Remaining gap: this is the *host* cfg of that code. The Android target
      # has no lint gate, and `cargo ndk clippy` reports 3 warnings from arms
      # only Android compiles. Adding that row means fixing those first.
      - name: Run Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings
