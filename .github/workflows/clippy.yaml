name: Clippy
on:
  push:
  pull_request:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: '${{ github.workflow }} @ ${{ github.ref }}'
  cancel-in-progress: true

jobs:
  clippy:
    name: Clippy
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Generate GitHub App Token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: app-token
        with:
          client-id: ${{ secrets.AUTO_COMMIT_APP_ID }}
          private-key: ${{ secrets.AUTO_COMMIT_APP_KEY }}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ steps.app-token.outputs.token }}
      # `rustup show` materialises the channel, `clippy`, and every cross-target
      # in rust-toolchain.toml -- which this job now needs, because it verifies
      # the wasm and Android arms before letting the bot commit.
      - name: Install Rust
        run: rustup show
      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libudev-dev
      - name: Cache cargo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-clippy-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-clippy-
      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked --version ^4
      - name: Apply Clippy autofixes
        run: cargo clippy --all-targets --all-features --fix || true

      # ---------------------------------------------------------------------
      # The gate on the autofix. Nothing below this runs if it fails, and that
      # includes the commit+push.
      # ---------------------------------------------------------------------
      #
      # This bot pushes straight to main. Before, it committed unconditionally
      # and re-ran clippy *after* the push, so the only thing that had ever
      # inspected the rewritten tree at push time was `--fix` itself. A rewrite
      # that broke the build was already on main by the time anything noticed.
      #
      # Host-only verification is not enough here, and the reason is specific to
      # this repo: `--fix` runs on the host, so it only ever *sees* the host cfg
      # arms -- but the edits it makes land in shared source that the Android and
      # wasm arms also compile. Dropping a "redundant" clone or narrowing a
      # parameter type is invisible to the host build and can still break a call
      # site behind `#[cfg(target_os = "android")]`, which is exactly the class of
      # break the Build matrix exists for. Checking the cross arms costs one
      # cargo-ndk install and two `check`s; pushing a broken main costs more.
      #
      # `check`, not `build`: this is verifying that a source rewrite still
      # compiles, and linking adds nothing to that.
      - name: Verify the autofixed tree still builds (host)
        run: cargo build --workspace --all-targets --all-features
      - name: Verify the autofixed tree still builds (wasm32)
        run: cargo check -p rustdar-web --lib --target wasm32-unknown-unknown
      - name: Verify the autofixed tree still builds (Android arm64-v8a)
        shell: bash
        run: |
          set -euo pipefail
          # Read in the shell: GitHub's `env` context does not carry runner OS
          # variables, so `${{ env.ANDROID_NDK_LATEST_HOME }}` is empty.
          export ANDROID_NDK_HOME="${ANDROID_NDK_HOME:-${ANDROID_NDK_LATEST_HOME:-${ANDROID_NDK_ROOT:-}}}"
          if [ -z "$ANDROID_NDK_HOME" ] || [ ! -d "$ANDROID_NDK_HOME" ]; then
            echo "::error::No Android NDK on this runner. Refusing to auto-commit a tree whose Android arm was never compiled."
            exit 1
          fi
          cargo ndk -t arm64-v8a -P 28 check -p rustdar-android --lib

      - uses: stefanzweifel/git-auto-commit-action@4a55954c782fc1ea30b9056cd3e7a2b40ca8887d # v7.2.0
        with:
          commit_message: "chore: Apply clippy fixes"
          commit_user_name: usa-reddragon-auto-commit[bot]
          commit_user_email: 234130638+github-actions[bot]@users.noreply.github.com
          commit_author: "usa-reddragon-auto-commit[bot] <234130638+github-actions[bot]@users.noreply.github.com>"
      # The gating run. `-D warnings` goes here and not on the --fix step above,
      # so the bot still gets to autofix what it can and the build fails only on
      # what it could not.
      #
      # This is also what makes the `unexpected_cfgs` lint load-bearing: a
      # `rustdar-frontend` build script that stopped emitting the `mobile` cfg
      # previously produced warnings nobody failed on, and Android and iOS
      # silently took the desktop memory budgets.
      - name: Run Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings
