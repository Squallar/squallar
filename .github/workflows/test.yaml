name: Test
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: '${{ github.workflow }} @ ${{ github.ref }}'
  # Never on main: `deploy-pages` requires this check to conclude `success` on
  # the deployed commit, and a superseded run concludes `cancelled`. Two runs
  # can then reach the coverage push at once, which the action's retry loop
  # handles.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  test:
    name: Test
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Generate GitHub App Token
        # Fork PRs run without secrets, so minting would fail here before a
        # single test ran. Skip the mint for them; checkout below falls back to
        # the default GITHUB_TOKEN, which is all a read-only fork run needs.
        if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: app-token
        with:
          client-id: ${{ secrets.AUTO_COMMIT_APP_ID }}
          private-key: ${{ secrets.AUTO_COMMIT_APP_KEY }}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # A skipped mint step yields an empty string, so `||` selects the
          # default token on fork PRs.
          token: ${{ steps.app-token.outputs.token || github.token }}
          fetch-depth: 0
      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libudev-dev
      # rust-cache does cache `${CARGO_HOME}/bin`, but its key hashes every
      # Cargo.lock, so a dependency bump would rebuild cargo-llvm-cov from
      # source. This key names only the tool and its version. `cache-bin` is off
      # below so the two do not store the same directory twice.
      - name: Cache cargo-installed binaries
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/bin
            ~/.cargo/.crates.toml
            ~/.cargo/.crates2.json
          key: ${{ runner.os }}-cargobin-test-llvm-cov-0.8
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: test
          cache-bin: "false"
      - name: Install Rust + llvm-tools
        run: |
          rustup default stable
          rustup component add llvm-tools-preview
          cargo install cargo-llvm-cov --locked --version ^0.8
      # `--all-features` is the only reason `rustdar-android`'s tests exist
      # here. That crate is `#![cfg(any(target_os = "android", feature =
      # "jni-typecheck"))]`, so without the flag it compiles to an empty lib and
      # its test binary still runs, still passes, and reports `0 tests` -- a
      # green row that covered nothing, and green is why nobody looked. Build
      # and Clippy have been passing `--all-features` for their own reasons the
      # whole time, so the JNI layer was compiled and linted on every PR and
      # never once executed. It is worth nine tests today: the permission
      # tri-state decision table, the provider -> FixQuality mapping and
      # activity-reachability.
      #
      # Cheap here in a way it is not on the cross rows in build.yaml:
      # `jni-typecheck` is the only feature this actually adds on Linux. The
      # workspace's other two, rustdar-gps/serial and rustdar-egui/gps-serial,
      # rustdar-platform already enables unconditionally for
      # `cfg(not(any(target_os = "android", target_os = "ios")))` -- which is
      # what the libudev-dev above is for, with or without this flag.
      - name: Run tests
        run: cargo llvm-cov --no-report --all-features
      # Deliberately *not* `--all-features` below, and not an inconsistency:
      # `report` rejects the flag outright ("invalid option '--all-features' for
      # subcommand 'report'"), as it does `--features` and
      # `--no-default-features`, even though `report --help` lists all three.
      # Adding it to match the step above fails this job on the first run. It
      # needs none of them: it re-reads the .profraw and the object files that
      # step left in target/llvm-cov-target, so it already reports exactly what
      # ran -- rustdar-android/src/lib.rs included.
      - name: Generate coverage reports
        if: always()
        run: |
          cargo llvm-cov report --lcov --output-path lcov.info
          cargo llvm-cov report --html --output-dir coverage
      - name: Upload HTML coverage report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-html
          path: coverage/html
          retention-days: 14
      - name: Report coverage
        if: always()
        uses: USA-RedDragon/reusable-actions/coverage@d65722ccb9ea7d4e4b770754a67aecc037033f1b # v2.0.21
        with:
          file: lcov.info
          # Runs under `if: always()`, so a run whose report generation failed
          # should skip reporting rather than fail a second time.
          if-no-file: warn
