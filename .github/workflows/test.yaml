name: Test
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: '${{ github.workflow }} @ ${{ github.ref }}'
  # Never on main: `deploy-pages` requires this check to conclude `success` on
  # the deployed commit, and a superseded run concludes `cancelled`. Two runs
  # can then reach the coverage push at once, which the retry loop below
  # handles.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  test:
    name: Test
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Generate GitHub App Token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: app-token
        with:
          client-id: ${{ secrets.AUTO_COMMIT_APP_ID }}
          private-key: ${{ secrets.AUTO_COMMIT_APP_KEY }}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ steps.app-token.outputs.token }}
          fetch-depth: 0
      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libudev-dev
      # rust-cache leaves `~/.cargo/bin` alone, so cargo-llvm-cov would rebuild
      # from source every run without this.
      - name: Cache cargo-installed binaries
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/bin
            ~/.cargo/.crates.toml
            ~/.cargo/.crates2.json
          key: ${{ runner.os }}-cargobin-test-llvm-cov
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          key: test
      - name: Install Rust + llvm-tools
        run: |
          rustup default stable
          rustup component add llvm-tools-preview
          cargo install cargo-llvm-cov
      - name: Run tests
        run: cargo llvm-cov --no-report
      - name: Generate coverage reports
        if: always()
        run: |
          cargo llvm-cov report --lcov --output-path lcov.info
          cargo llvm-cov report --html --output-dir coverage
      - name: Upload HTML coverage report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-html
          path: coverage/html
          retention-days: 14
      - name: Comment coverage on pull request
        if: always() && github.event_name == 'pull_request'
        # Coverage is informational and never gates, so a failure to report it
        # must not turn the pull request red.
        continue-on-error: true
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          if [ ! -s lcov.info ]; then
            echo "No coverage report was produced, skipping comment"
            exit 0
          fi
          .github/scripts/coverage-summary.sh lcov.info > "$RUNNER_TEMP/current.tsv"
          git diff --name-only "$BASE_SHA"...HEAD > "$RUNNER_TEMP/changed.txt"
          .github/scripts/coverage-comment.sh \
            "$RUNNER_TEMP/current.tsv" \
            .github/coverage-baseline.tsv \
            "$RUNNER_TEMP/changed.txt" > "$RUNNER_TEMP/comment.md"
          gh pr comment "$PR" --body-file "$RUNNER_TEMP/comment.md" --edit-last --create-if-none
      # Retried against a moving main. `cancel-in-progress` serialises Test runs
      # but does not stop main advancing under one: this step lands minutes
      # after checkout, and the coverage commit itself carries `[skip ci]`, so
      # it moves main without triggering the run that would have cancelled
      # anyone. A plain push is then rejected non-fast-forward, and the ruleset
      # forbids forcing.
      #
      # Reset-and-regenerate, not rebase. Both files are whole-file rewrites and
      # a pure function of lcov.info, so two versions conflict on every line of
      # both and a rebase aborts the step; regenerating on top of whatever main
      # now holds always gives the right answer and cannot conflict.
      #
      # lcov.info is gitignored, so `reset --hard` leaves it alone.
      - name: Update coverage badge and baseline
        if: github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'usa-reddragon-auto-commit[bot]'
          git config user.email '234130638+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3 4 5; do
            git fetch --quiet origin main
            git reset --quiet --hard FETCH_HEAD
            .github/scripts/coverage-badge.sh lcov.info .github/badges/coverage.svg
            .github/scripts/coverage-summary.sh lcov.info > .github/coverage-baseline.tsv
            if git diff --quiet -- .github/badges/coverage.svg .github/coverage-baseline.tsv; then
              echo "Coverage unchanged, nothing to commit"
              exit 0
            fi
            git add .github/badges/coverage.svg .github/coverage-baseline.tsv
            git commit --quiet -m 'chore: update coverage badge and baseline [skip ci]'
            if git push --quiet origin HEAD:main; then
              echo "pushed on attempt ${attempt}"
              exit 0
            fi
            echo "push rejected on attempt ${attempt}; another run landed first, retrying"
          done
          echo "::error::could not land the coverage update after 5 attempts"
          exit 1
