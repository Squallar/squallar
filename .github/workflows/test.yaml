name: Test
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: '${{ github.workflow }} @ ${{ github.ref }}'
  # Never on main: `deploy-pages` requires this check to conclude `success` on
  # the deployed commit, and a superseded run concludes `cancelled`. Two runs
  # can then reach the coverage push at once, which the action's retry loop
  # handles.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # The `#[ignore]`d wgpu tests, run against Mesa's lavapipe.
  #
  # They stay `#[ignore]`d in the source: a developer on a box with no working
  # Vulkan loader must still get a green `cargo test`, so the opt-in lives here
  # rather than in an attribute. Everything this job runs is otherwise executed
  # only when a human types the invocation from the files' module docs, which
  # means a regression in the raymarch reached `main` green.
  #
  # A separate job from `test` on purpose. That one ends in a coverage push to
  # the branch, and a slow or flaky row must not be able to take that with it.
  # It is also not foldable into the coverage row even if it were free:
  # `cargo llvm-cov` drives one `cargo test` invocation, and these tests need
  # `-- --ignored` while the rest of the workspace must not get it -- the
  # ignored set includes tests that hit live S3 buckets and live APIs.
  gpu:
    name: GPU (software rasteriser)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install system deps
        # libudev-dev for the same reason the `test` job needs it:
        # rustdar-platform enables rustdar-gps/serial unconditionally off
        # Android and iOS. mesa-vulkan-drivers is what carries lavapipe.
        run: |
          sudo apt-get update
          sudo apt-get install -y libudev-dev mesa-vulkan-drivers
      - name: Point the Vulkan loader at lavapipe
        # Discovered rather than written out: Mesa installs the ICD manifest as
        # `lvp_icd.x86_64.json` and some distributions drop the arch infix, and
        # a path that is merely wrong would leave the loader with no ICD at all.
        # That failure is at least loud -- `request_adapter` returns `None` and
        # every test below panics on its `expect`, so a wrong path can never
        # pass quietly -- but the glob costs nothing and spares the red run.
        #
        # `VK_ICD_FILENAMES` is the pre-1.3.207 spelling, set alongside for
        # loaders older than whatever the runner image ships.
        #
        # WGPU_BACKEND pins the *backend*, which the ICD variables cannot do:
        # they constrain Vulkan only, and wgpu's default is every backend the
        # platform has. Without the pin an adapter could still be handed over by
        # GL, and on a runner that turns out to have a real GPU this job would
        # go green having tested the thing it was not asked about. Verified
        # locally on a box with an RTX 3090: unset the ICD variable and the
        # suite silently runs on the 3090 instead.
        run: |
          shopt -s nullglob
          icds=(/usr/share/vulkan/icd.d/lvp_icd*.json)
          icd=${icds[0]:?no lavapipe ICD manifest in /usr/share/vulkan/icd.d}
          echo "Vulkan ICD: $icd"
          {
            echo "VK_DRIVER_FILES=$icd"
            echo "VK_ICD_FILENAMES=$icd"
            echo "WGPU_BACKEND=vulkan"
          } >> "$GITHUB_ENV"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: gpu
      # No `--all-features` on either step below, and not an oversight: the only
      # feature it adds on Linux is rustdar-android's `jni-typecheck`, which is
      # the `test` job's reason for the flag and builds nothing this job runs.
      #
      # `--nocapture` is load-bearing. Each test binary prints the adapter it
      # got, once, and a passing test's output is otherwise discarded -- which
      # would leave no way to tell from the log whether lavapipe was really what
      # ran. It also carries volume_shader_mutants' table of every mutation and
      # the margin its probe saw, which is the only readable record of what the
      # battery proved on a given run.
      #
      # volume_shader_mutants is the guard on the other two. It substitutes one
      # expression at a time into `volume.wgsl`, rebuilds the pipelines from the
      # mutated string -- wgpu compiles WGSL at runtime, so no rebuild is
      # involved -- and requires a probe to notice. Without it, every row above
      # could be passing over a shader nobody has proved is being read: three
      # such tests were found by hand in this campaign. Measured on both: 0.45 s
      # on an RTX 3090 and 0.43 s on lavapipe, against the 19 s the two rows
      # above take there. A mutant is one shader compile and one small render,
      # and neither is what a software rasteriser is slow at.
      - name: Run the adapter-only integration tests
        run: |
          cargo test -p rustdar-frontend \
            --test volume_gpu --test volume_silhouette --test volume_shader_mutants \
            -- --ignored --nocapture
      # The other three `#[ignore]`d files in that directory --
      # volume_real_mask, volume_march_cost and floor_alignment -- are
      # deliberately not here. Each reads a Level II volume from a path given in
      # the environment, no such file exists in this repository, and radar data
      # is not going into git. They remain hand-run.
      - name: Run the adapter-only unit tests
        # Named exactly, because this binary's ignored set also holds
        # `live_a_poll_fetches_each_object_once`, which hits a live S3 bucket.
        #
        # A rename would leave `--exact` matching nothing, and the harness exits
        # 0 on zero tests -- silently reopening exactly the hole this job was
        # added to close. So the count is asserted rather than assumed.
        run: |
          cargo test -p rustdar-frontend --lib -- --ignored --nocapture --exact \
            volume::tests::a_real_adapter_supports_the_volume_format \
            egui_renderer::tests::a_paint_callbacks_own_command_buffer_reaches_the_queue \
            | tee "$RUNNER_TEMP/lib-gpu.log"
          grep -q '^test result: ok\. 2 passed' "$RUNNER_TEMP/lib-gpu.log"

  test:
    name: Test
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Generate GitHub App Token
        # Fork PRs run without secrets, so minting would fail here before a
        # single test ran. Skip the mint for them; checkout below falls back to
        # the default GITHUB_TOKEN, which is all a read-only fork run needs.
        if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: app-token
        with:
          client-id: ${{ secrets.AUTO_COMMIT_APP_ID }}
          private-key: ${{ secrets.AUTO_COMMIT_APP_KEY }}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # A skipped mint step yields an empty string, so `||` selects the
          # default token on fork PRs.
          token: ${{ steps.app-token.outputs.token || github.token }}
          fetch-depth: 0
      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libudev-dev
      # rust-cache does cache `${CARGO_HOME}/bin`, but its key hashes every
      # Cargo.lock, so a dependency bump would rebuild cargo-llvm-cov from
      # source. This key names only the tool and its version. `cache-bin` is off
      # below so the two do not store the same directory twice.
      - name: Cache cargo-installed binaries
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/bin
            ~/.cargo/.crates.toml
            ~/.cargo/.crates2.json
          key: ${{ runner.os }}-cargobin-test-llvm-cov-0.8
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: test
          cache-bin: "false"
      - name: Install Rust + llvm-tools
        run: |
          rustup default stable
          rustup component add llvm-tools-preview
          cargo install cargo-llvm-cov --locked --version ^0.8
      # `--all-features` is the only reason `rustdar-android`'s tests exist
      # here. That crate is `#![cfg(any(target_os = "android", feature =
      # "jni-typecheck"))]`, so without the flag it compiles to an empty lib and
      # its test binary still runs, still passes, and reports `0 tests` -- a
      # green row that covered nothing, and green is why nobody looked. Build
      # and Clippy have been passing `--all-features` for their own reasons the
      # whole time, so the JNI layer was compiled and linted on every PR and
      # never once executed. It is worth nine tests today: the permission
      # tri-state decision table, the provider -> FixQuality mapping and
      # activity-reachability.
      #
      # Cheap here in a way it is not on the cross rows in build.yaml:
      # `jni-typecheck` is the only feature this actually adds on Linux. The
      # workspace's other two, rustdar-gps/serial and rustdar-egui/gps-serial,
      # rustdar-platform already enables unconditionally for
      # `cfg(not(any(target_os = "android", target_os = "ios")))` -- which is
      # what the libudev-dev above is for, with or without this flag.
      - name: Run tests
        run: cargo llvm-cov --no-report --all-features
      # Deliberately *not* `--all-features` below, and not an inconsistency:
      # `report` rejects the flag outright ("invalid option '--all-features' for
      # subcommand 'report'"), as it does `--features` and
      # `--no-default-features`, even though `report --help` lists all three.
      # Adding it to match the step above fails this job on the first run. It
      # needs none of them: it re-reads the .profraw and the object files that
      # step left in target/llvm-cov-target, so it already reports exactly what
      # ran -- rustdar-android/src/lib.rs included.
      - name: Generate coverage reports
        if: always()
        run: |
          cargo llvm-cov report --lcov --output-path lcov.info
          cargo llvm-cov report --html --output-dir coverage
      - name: Upload HTML coverage report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-html
          path: coverage/html
          retention-days: 14
      - name: Report coverage
        if: always()
        uses: USA-RedDragon/reusable-actions/coverage@d65722ccb9ea7d4e4b770754a67aecc037033f1b # v2.0.21
        with:
          file: lcov.info
          # Runs under `if: always()`, so a run whose report generation failed
          # should skip reporting rather than fail a second time.
          if-no-file: warn
