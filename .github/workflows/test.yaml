name: Test
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: '${{ github.workflow }} @ ${{ github.ref }}'
  # Never on main: `deploy-pages` requires this check to conclude `success` on
  # the deployed commit, and a superseded run concludes `cancelled`. Two runs
  # can then reach the coverage push at once, which the action's retry loop
  # handles.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # The `#[ignore]`d wgpu tests, run against Mesa's lavapipe.
  #
  # They stay `#[ignore]`d in the source: a developer on a box with no working
  # Vulkan loader must still get a green `cargo test`, so the opt-in lives here
  # rather than in an attribute. Everything this job runs is otherwise executed
  # only when a human types the invocation from the files' module docs, which
  # means a regression in the raymarch reached `main` green.
  #
  # A separate job from `test` on purpose. That one ends in a coverage push to
  # the branch, and a slow or flaky row must not be able to take that with it.
  # It is also not foldable into the coverage row even if it were free:
  # `cargo llvm-cov` drives one `cargo test` invocation, and these tests need
  # `-- --ignored` while the rest of the workspace must not get it -- the
  # ignored set includes tests that hit live S3 buckets and live APIs.
  gpu:
    name: GPU (software rasteriser)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install system deps
        # libudev-dev for the same reason the `test` job needs it:
        # the squallar crate enables squallar-nmea-serial/serial unconditionally off
        # Android and iOS. mesa-vulkan-drivers is what carries lavapipe.
        run: |
          sudo apt-get update
          sudo apt-get install -y libudev-dev mesa-vulkan-drivers
      - name: Point the Vulkan loader at lavapipe
        # Discovered rather than written out: Mesa installs the ICD manifest as
        # `lvp_icd.x86_64.json` and some distributions drop the arch infix, and
        # a path that is merely wrong would leave the loader with no ICD at all.
        # That failure is at least loud -- `request_adapter` returns `None` and
        # every test below panics on its `expect`, so a wrong path can never
        # pass quietly -- but the glob costs nothing and spares the red run.
        #
        # `VK_ICD_FILENAMES` is the pre-1.3.207 spelling, set alongside for
        # loaders older than whatever the runner image ships.
        #
        # WGPU_BACKEND pins the *backend*, which the ICD variables cannot do:
        # they constrain Vulkan only, and wgpu's default is every backend the
        # platform has. Without the pin an adapter could still be handed over by
        # GL, and on a runner that turns out to have a real GPU this job would
        # go green having tested the thing it was not asked about. Verified
        # locally on a box with an RTX 3090: unset the ICD variable and the
        # suite silently runs on the 3090 instead.
        run: |
          shopt -s nullglob
          icds=(/usr/share/vulkan/icd.d/lvp_icd*.json)
          icd=${icds[0]:?no lavapipe ICD manifest in /usr/share/vulkan/icd.d}
          echo "Vulkan ICD: $icd"
          {
            echo "VK_DRIVER_FILES=$icd"
            echo "VK_ICD_FILENAMES=$icd"
            echo "WGPU_BACKEND=vulkan"
          } >> "$GITHUB_ENV"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: gpu
      # No `--all-features` on either step below, and not an oversight: the only
      # feature it adds on Linux is squallar's `jni-typecheck`, which is
      # the `test` job's reason for the flag and builds nothing this job runs.
      #
      # `--nocapture` is load-bearing. Each test binary prints the adapter it
      # got, once, and a passing test's output is otherwise discarded -- which
      # would leave no way to tell from the log whether lavapipe was really what
      # ran. It also carries volume_shader_mutants' table of every mutation and
      # the margin its probe saw, which is the only readable record of what the
      # battery proved on a given run.
      #
      # volume_shader_mutants is the guard on all the others. It substitutes one
      # expression at a time into `volume.wgsl`, rebuilds the pipelines from the
      # mutated string -- wgpu compiles WGSL at runtime, so no rebuild is
      # involved -- and requires a probe to notice. Without it, every suite here
      # could be passing over a shader nobody has proved is being read: three
      # such tests were found by hand in this campaign.
      #
      # Cost of the whole derived set, measured 2026-08-30 on lavapipe
      # (llvmpipe, Mesa 26.2.1 / LLVM 22.1.8, debug profile) with
      # MESA_SHADER_CACHE_DISABLE=true. Harness time per suite: the denominator
      # is one `cargo test` binary each, and the compile in front of them is in
      # none of these figures.
      #
      #   volume_occluder       16.5 s  (10 tests)
      #   volume_silhouette     16.1 s  (10)
      #   volume_shader_mutants 10.6 s  (1 test = 36 mutants over 18 probes)
      #   volume_light           9.6 s  (13)
      #   volume_gpu             8.9 s  (25)
      #   volume_drape           6.1 s  (6)
      #   volume_ground_aspect   3.1 s  (2)
      #   raster_upload_gpu      0.4 s  (2)
      #   --------------------------------
      #   71.1 s over 69 tests, plus 1.3 s for the unit step: 72.7 s of job.
      #
      # Cold is the honest number and the cache disable is the load-bearing
      # part of that command. Warm, the same set takes 41.5 s, because Mesa
      # keeps compiled shaders in ~/.cache/mesa_shader_cache and only
      # volume_shader_mutants is compile-bound -- it alone swings 10.6 s cold
      # against 0.95 s warm, a 10x, while the rasterisation-bound suites barely
      # move. Nothing here caches that directory (rust-cache carries cargo
      # artifacts, not Mesa's), so every run on this runner is a cold one and
      # the warm figure would understate the row by 43 %.
      #
      # The five suites this job gained on 2026-08-30 cost 35.6 s of the 71.1,
      # against 35.5 s for the three it already ran: closing the hole doubled
      # the row. Both halves are still far below the compile in front of them.
      #
      # Measured on a 32-thread Ryzen 9 7950X. llvmpipe is a CPU rasteriser and
      # scales with cores, so a 4-vCPU ubuntu-24.04 runner will be SLOWER than
      # every figure above; they are a floor, not a prediction, and are not
      # scaled to the runner because a scaled figure is not a measurement.
      #
      # An earlier revision of this comment put volume_shader_mutants at 0.43 s
      # on lavapipe against "the 19 s the two rows above take". The battery has
      # since grown to 36 mutants over 18 probes and that figure was stale by
      # 25x, which is why the table above says what it is counting and under
      # which cache.
      - name: Run the adapter-only integration tests
        # `-p squallar-gpu` since WO-RV land 3: the ENTIRE GPU-bound suite lives
        # in squallar-gpu/tests (the hardware quarantine — this job is the ONE
        # owner of every `--ignored` adapter invocation; `cargo test` on any
        # other package needs no adapter).
        #
        # The target list is DERIVED, and deliberately so. It used to be three
        # names written out here, beside a comment listing "the other three"
        # files this job skipped. Nobody had to update either, so nobody did:
        # by 2026-08-30 five suites carrying 33 `#[ignore]`d tests --
        # volume_drape, volume_ground_aspect, volume_light, volume_occluder and
        # raster_upload_gpu -- had landed into a job that never named them, and
        # four of them said in their own module docs that this job opted in.
        # The acceptance evidence for B1, B3, B4, C2 and D1 was gated by
        # nothing. A hand-maintained list is what produced that, so there is no
        # longer one: every file in the directory with a column-0 `#[ignore]`
        # attribute runs, unless its module doc opts out with a
        # `//! ci-excluded:` line saying why.
        #
        # Both greps and this glob are held to `gpu_job_covers_every_suite.rs`
        # in that same directory, which also refuses a literal `--test <name>`
        # here and requires every opt-out to name a reason and really read the
        # environment. That test runs in the ordinary `test` job, so the two
        # cannot drift apart unnoticed.
        run: |
          shopt -s nullglob
          args=()
          ran=()
          for f in squallar-gpu/tests/*.rs; do
            stem=$(basename "$f" .rs)
            # Opted out: a measurement instrument wanting a Level II volume
            # from the environment. It would panic here on the unset variable.
            if grep -q '^//! ci-excluded:' "$f"; then
              printf 'skipping %-22s %s\n' "$stem" "$(sed -n 's|^//! ci-excluded: ||p' "$f" | head -1)"
              continue
            fi
            # Not an adapter-only suite at all -- the `test` job runs it.
            grep -q '^#\[ignore' "$f" || continue
            args+=(--test "$stem")
            ran+=("$stem")
          done
          echo "Derived ${#ran[@]} adapter-only suites: ${ran[*]}"
          # An empty derivation would drop the `--test` filters entirely and
          # `cargo test -p squallar-gpu -- --ignored` would then run every
          # target in the package, the opted-out ones included. A broken glob
          # must stop this job, not silently change what it means. Eight suites
          # ran on 2026-08-30; the floor is a floor, not the count.
          if [ "${#ran[@]}" -lt 6 ]; then
            echo "::error::derived only ${#ran[@]} suites; the glob or the marker has broken"
            exit 1
          fi
          cargo test -p squallar-gpu "${args[@]}" -- --ignored --nocapture
      - name: Run the adapter-only unit tests
        # The `#[ignore]`d tests that live in a lib rather than in
        # squallar-gpu/tests. Two crates have them: the renderer's sentinel
        # moved to squallar-gpu with the renderer, and the volume trio to
        # squallar-volumetric with the 3D stack at WO-RV (the `volume::` module
        # segment became the crate root, so the paths lost that prefix).
        #
        # This step used to name all four with `--exact`, guarding a rename
        # with an asserted count -- `3 passed` and `1 passed` written out. That
        # guard is real for a rename but blind to an addition: a fifth ignored
        # lib test would be filtered out by `--exact` and the `3 passed` would
        # still hold, which is the same silent-omission defect the integration
        # step above was rebuilt to remove. It was not yet stale on 2026-08-30
        # (the lists were exactly complete), but it was stale-able.
        #
        # So the count is DISCOVERED and every ignored test in the lib runs.
        # `--list --ignored` enumerates them; the run must report exactly that
        # many. A rename still cannot pass (the two numbers come from one
        # binary), an addition now runs instead of hiding, and nothing here is
        # a name a human has to keep in step.
        run: |
          for pkg in squallar-volumetric squallar-gpu; do
            expected=$(cargo test -p "$pkg" --lib -- --list --ignored | grep -c ': test$')
            echo "$pkg declares $expected ignored lib test(s)"
            # Zero would make the run below trivially green, which is how a
            # moved module would read as success.
            if [ "$expected" -lt 1 ]; then
              echo "::error::$pkg declares no ignored lib tests; this step has lost its subject"
              exit 1
            fi
            cargo test -p "$pkg" --lib -- --ignored --nocapture \
              | tee "$RUNNER_TEMP/lib-gpu-$pkg.log"
            grep -q "^test result: ok\. $expected passed" "$RUNNER_TEMP/lib-gpu-$pkg.log"
          done

  test:
    name: Test
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: write
    env:
      # Read into `env` so the step below can branch on it: the `secrets`
      # context is not available in a step-level `if:`, but `env` is.
      AUTOCOMMIT_CLIENT_ID: ${{ secrets.SQUALLAR_AUTOCOMMIT_CLIENT_ID }}
    steps:
      # THE COVERAGE PUSH NEEDS THE APP, AND NOT FOR THE USUAL REASON.
      #
      # `main` carries a ruleset -- pull_request plus required_status_checks --
      # and the coverage baseline is pushed straight to it. GITHUB_TOKEN is not
      # a bypass actor on that ruleset, so the push is refused with GH013
      # ("Changes must be made through a pull request"), five times, after every
      # test in the workspace has already passed. The Squallar-autocommit app is
      # a bypass actor; this mints its token so the push is made as it.
      #
      # Note what this is NOT for: triggering. A baseline records the run that
      # produced it, and a build started by writing it down would build nothing
      # new. An app push does trigger workflows, which here is a side effect to
      # be aware of rather than the point.
      #
      # Skipped when the app is not configured, and on fork PRs, which get no
      # secrets -- checkout then falls back to GITHUB_TOKEN and a read-only run
      # is unaffected. See zone-pack.yaml for the same guard.
      - name: Generate GitHub App Token
        if: env.AUTOCOMMIT_CLIENT_ID != ''
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: app-token
        with:
          client-id: ${{ secrets.SQUALLAR_AUTOCOMMIT_CLIENT_ID }}
          private-key: ${{ secrets.SQUALLAR_AUTOCOMMIT_PRIVATE_KEY }}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ steps.app-token.outputs.token || github.token }}
          fetch-depth: 0
      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libudev-dev
      # rust-cache does cache `${CARGO_HOME}/bin`, but its key hashes every
      # Cargo.lock, so a dependency bump would rebuild cargo-llvm-cov from
      # source. This key names only the tool and its version. `cache-bin` is off
      # below so the two do not store the same directory twice.
      - name: Cache cargo-installed binaries
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/bin
            ~/.cargo/.crates.toml
            ~/.cargo/.crates2.json
          key: ${{ runner.os }}-cargobin-test-llvm-cov-0.8
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: test
          cache-bin: "false"
      - name: Install Rust + llvm-tools
        run: |
          rustup default stable
          rustup component add llvm-tools-preview
          cargo install cargo-llvm-cov --locked --version ^0.8
      # `--all-features` is the only reason the `squallar` package's android
      # module tests exist here. That module tree is mounted `#[cfg(any(
      # target_os = "android", feature = "jni-typecheck"))]`, so without the
      # flag none of it compiles on a host -- a green row that covered nothing,
      # and green is why nobody looked, is exactly how the jni 0.21->0.22 break
      # once shipped. Build and Clippy have been passing `--all-features` for
      # their own reasons the whole time, so the JNI layer was compiled and
      # linted on every PR and never once executed. It is worth nine tests
      # today: the permission tri-state decision table, the provider ->
      # FixQuality mapping and activity-reachability.
      #
      # Cheap here in a way it is not on the cross rows in build.yaml:
      # `jni-typecheck` is the only feature this actually adds on Linux. The
      # workspace's other two, squallar-nmea-serial/serial and squallar-egui/gps-serial,
      # the squallar crate already enables unconditionally for
      # `cfg(not(any(target_os = "android", target_os = "ios")))` -- which is
      # what the libudev-dev above is for, with or without this flag.
      - name: Run tests
        run: cargo llvm-cov --no-report --all-features
      # Deliberately *not* `--all-features` below, and not an inconsistency:
      # `report` rejects the flag outright ("invalid option '--all-features' for
      # subcommand 'report'"), as it does `--features` and
      # `--no-default-features`, even though `report --help` lists all three.
      # Adding it to match the step above fails this job on the first run. It
      # needs none of them: it re-reads the .profraw and the object files that
      # step left in target/llvm-cov-target, so it already reports exactly what
      # ran -- squallar/src/android/ included.
      - name: Generate coverage reports
        if: always()
        run: |
          cargo llvm-cov report --lcov --output-path lcov.info
          cargo llvm-cov report --html --output-dir coverage
      - name: Upload HTML coverage report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-html
          path: coverage/html
          retention-days: 14
      - name: Report coverage
        if: always()
        uses: USA-RedDragon/reusable-actions/coverage@d65722ccb9ea7d4e4b770754a67aecc037033f1b # v2.0.21
        with:
          file: lcov.info
          # Runs under `if: always()`, so a run whose report generation failed
          # should skip reporting rather than fail a second time.
          if-no-file: warn
