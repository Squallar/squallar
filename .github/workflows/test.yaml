name: Test
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: '${{ github.workflow }} @ ${{ github.ref }}'
  # Never on main: `deploy-pages` requires this check to conclude `success` on
  # the deployed commit, and a superseded run concludes `cancelled`. Two runs
  # can then reach the coverage push at once, which the action's retry loop
  # handles.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  test:
    name: Test
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Generate GitHub App Token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: app-token
        with:
          client-id: ${{ secrets.AUTO_COMMIT_APP_ID }}
          private-key: ${{ secrets.AUTO_COMMIT_APP_KEY }}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ steps.app-token.outputs.token }}
          fetch-depth: 0
      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libudev-dev
      # rust-cache does cache `${CARGO_HOME}/bin`, but its key hashes every
      # Cargo.lock, so a dependency bump would rebuild cargo-llvm-cov from
      # source. This key names only the tool and its version. `cache-bin` is off
      # below so the two do not store the same directory twice.
      - name: Cache cargo-installed binaries
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/bin
            ~/.cargo/.crates.toml
            ~/.cargo/.crates2.json
          key: ${{ runner.os }}-cargobin-test-llvm-cov-0.8
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          key: test
          cache-bin: "false"
      - name: Install Rust + llvm-tools
        run: |
          rustup default stable
          rustup component add llvm-tools-preview
          cargo install cargo-llvm-cov --locked --version ^0.8
      - name: Run tests
        run: cargo llvm-cov --no-report
      - name: Generate coverage reports
        if: always()
        run: |
          cargo llvm-cov report --lcov --output-path lcov.info
          cargo llvm-cov report --html --output-dir coverage
      - name: Upload HTML coverage report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-html
          path: coverage/html
          retention-days: 14
      - name: Report coverage
        if: always()
        uses: USA-RedDragon/reusable-actions/coverage@d65722ccb9ea7d4e4b770754a67aecc037033f1b # v2.0.21
        with:
          file: lcov.info
          # Runs under `if: always()`, so a run whose report generation failed
          # should skip reporting rather than fail a second time.
          if-no-file: warn
