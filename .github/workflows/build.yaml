name: Build

# One row per target triple, cross-compiled on one Linux runner in the
# rust-cross image: osxcross, llvm-mingw, the iPhoneOS SDK, the NDK, cargo-ndk
# and wasm-pack all ship in it, so no macOS or Windows runner is needed.
# Almost everything platform-specific is behind a `#[cfg]`, so the triple is
# the unit of coverage.

on:
  push:
  pull_request:

permissions:
  contents: read

# ONE pin, read by both places that fetch the signer: the macOS matrix rows
# below and the `macos-universal` job. Two copies of a digest is how one of
# them comes to be bumped alone, and the point of pinning a tool we hand our
# signing key to is that it cannot drift.
env:
  # NOT named RCODESIGN_*, and that is load-bearing rather than a style choice.
  # rcodesign merges every environment variable prefixed `RCODESIGN_` into its
  # own configuration, mapping the suffix to a config key in the `default`
  # profile (apple-codesign 0.29.0, src/cli/config.rs `with_env_prefix`). So a
  # workflow-level `RCODESIGN_SHA256` -- set here only to pin the download --
  # became a config key `sha256`, which is not one rcodesign has, and every
  # `rcodesign sign` died before signing anything with "configuration file
  # error / problem key: sha256". Reproduced exactly:
  #   RCODESIGN_SHA256=x rcodesign sign a b
  # A tool that reads its own prefix out of the environment cannot share that
  # prefix with the variables naming its download.
  SIGNTOOL_VERSION: 0.29.0
  SIGNTOOL_SHA256: dbe85cedd8ee4217b64e9a0e4c2aef92ab8bcaaa41f20bde99781ff02e600002
  # The two package tools, pinned by COMMIT rather than by tag: neither
  # repository publishes releases, so the alternative is a moving `master`,
  # which is a different tool on a different day and a supply chain nobody
  # reviewed. xar's last commit is from 2014 -- the project is finished, not
  # abandoned; the format it writes has not changed either.
  XAR_COMMIT: 66d451dab1ef859dd0c83995f2379335d35e53c9
  BOMUTILS_COMMIT: c247002e2f49878bab32dd0fcf805810ae0992cb

concurrency:
  group: '${{ github.workflow }} @ ${{ github.ref }}'
  # Never cancel on main: bots push several times an hour, and a cancelled run
  # never reaches the deploy jobs.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/usa-reddragon/rust-cross:1.97.1@sha256:68d608cfe4232a8a9b42ce41ea26412eaadc8f53218fed7e52e43974b388a302
    defaults:
      run:
        shell: bash
    strategy:
      # One red row must not cancel the rest.
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            target: x86_64-unknown-linux-gnu
            cmd: cargo check --workspace --all-targets --features squallar/jni-typecheck --target x86_64-unknown-linux-gnu && cargo build --release -p squallar --features squallar/jni-typecheck --target x86_64-unknown-linux-gnu
            artifact: target/x86_64-unknown-linux-gnu/release/squallar
          # The artifact is a signed .app in a zip, not the bare executable.
          # `-NOT-NOTARIZED` in the file name is not a warning about these two
          # rows going wrong. Per-architecture build, never notarized here by
          # design; the macos-universal job fuses both halves and notarizes
          # that one -- look there for the notarized artifact. The name is
          # written by packaging/macos/Makefile from what actually happened,
          # so it says the true thing here rather than a special case saying
          # nothing; the Package step's marker is what keeps the recipe from
          # calling the App Store Connect key "missing" on a row that is not
          # supposed to have it.
          # Three reasons, and none of them is polish: arm64 macOS refuses to
          # execute an unsigned Mach-O at all, so the old `macos-aarch64`
          # artifact was never runnable; `upload-artifact` drops the executable
          # bit, so an unzipped .app is a folder macOS declines to open; and
          # CoreLocation will not prompt for an executable with no bundle
          # identifier, which is every bare binary. See `macos_arch` below.
          - name: macos-aarch64
            target: aarch64-apple-darwin
            package: macos
            macos_arch: aarch64
            cmd: cargo check --workspace --all-targets --features squallar/jni-typecheck --target aarch64-apple-darwin && cargo build --release -p squallar --features squallar/jni-typecheck --target aarch64-apple-darwin
            artifact: packaging/macos/build/aarch64-apple-darwin/squallar-NOT-NOTARIZED.app.zip
            macos_bin: target/aarch64-apple-darwin/release/squallar
          - name: macos-x86_64
            target: x86_64-apple-darwin
            package: macos
            macos_arch: x86_64
            cmd: cargo check --workspace --all-targets --features squallar/jni-typecheck --target x86_64-apple-darwin && cargo build --release -p squallar --features squallar/jni-typecheck --target x86_64-apple-darwin
            artifact: packaging/macos/build/x86_64-apple-darwin/squallar-NOT-NOTARIZED.app.zip
            macos_bin: target/x86_64-apple-darwin/release/squallar
          # The store variant is a SECOND macOS binary, not a re-signature of
          # the one above. It is built `--no-default-features`, which turns off
          # `gps-serial`, and that is the whole difference: under the App
          # Sandbox the serial port enumerator returns Err, so with the feature
          # on the settings pane draws a device picker that can never populate,
          # and with it off it draws no rows at all. See
          # packaging/macos/entitlements-store.plist.
          #
          # No `cargo check --workspace --all-targets` on these two rows, and
          # that is deliberate rather than an omission: the two rows above
          # already run it for these exact targets, so a second full check
          # would buy no coverage for several minutes of runner time each. What
          # is left is the build alone, which is the only thing these rows
          # exist to produce.
          #
          # No `package: macos` either, so the per-arch `.app.zip` steps skip:
          # a store build is only ever consumed as a universal .pkg, and a
          # single-arch store .app is a file nobody can do anything with.
          - name: macos-aarch64-store
            target: aarch64-apple-darwin
            macos_arch: aarch64-store
            cmd: cargo build --release -p squallar --no-default-features --target aarch64-apple-darwin
            macos_bin: target/aarch64-apple-darwin/release/squallar
          - name: macos-x86_64-store
            target: x86_64-apple-darwin
            macos_arch: x86_64-store
            cmd: cargo build --release -p squallar --no-default-features --target x86_64-apple-darwin
            macos_bin: target/x86_64-apple-darwin/release/squallar
          # gnullvm, not MSVC: MSVC is the one family the image does not carry.
          - name: windows-x86_64
            target: x86_64-pc-windows-gnullvm
            cmd: cargo check --workspace --all-targets --features squallar/jni-typecheck --target x86_64-pc-windows-gnullvm && cargo build --release -p squallar --features squallar/jni-typecheck --target x86_64-pc-windows-gnullvm
            artifact: target/x86_64-pc-windows-gnullvm/release/squallar.exe

          # A real link, not a `check`. `squallar --lib` as a staticlib
          # codegens the whole graph, and the link is where the failures that
          # only iOS has actually appear: a missing `-framework`, or a
          # dependency that reaches for IOKit. `IN_CONTAINER=1` because this job
          # already runs inside the image packaging/ios/Makefile would otherwise start.
          # `zip` is not in the image and is only needed to package the .ipa.
          - name: ios-aarch64
            target: aarch64-apple-ios
            package: ios
            workspaces: ". -> target-ios"
            # No `artifact:`. The .ipa's NAME depends on whether it was signed
            # for distribution, so the upload is a pair of dedicated steps that
            # read the outcome off the disk; see them below the matrix.
            ios_out: packaging/ios/build/linux/iphoneos
            cmd: make -C packaging/ios IN_CONTAINER=1
          # Same link against the simulator SDK. Not redundant: it is a
          # different target triple with its own std, its own clang wrapper and
          # its own Mach-O platform, and it is the only one testable without
          # signing.
          - name: ios-aarch64-sim
            target: aarch64-apple-ios-sim
            workspaces: ". -> target-ios"
            artifact: packaging/ios/build/linux/iphonesimulator/squallar.app
            cmd: make -C packaging/ios IN_CONTAINER=1 SIMULATOR=1

          - name: android-arm64-v8a
            target: aarch64-linux-android
            package: android
            abi: arm64-v8a
            cmd: cd packaging/android && ./gradlew assembleRelease -PabiFilter=arm64-v8a
            artifact: packaging/android/app/build/outputs/apk/release/app-arm64-v8a-release.apk
          - name: android-x86_64
            target: x86_64-linux-android
            package: android
            abi: x86_64
            cmd: cd packaging/android && ./gradlew assembleRelease -PabiFilter=x86_64
            artifact: packaging/android/app/build/outputs/apk/release/app-x86_64-release.apk

          # The only wasm build, and deliberately so. The deleted `wasm32
          # libraries` row named members as roots, so the gps crate (squallar-nmea-serial
          # today) took its own
          # defaults and serialport -- the crate the `serial`/`gps-serial` gates
          # exist to keep off web and iOS -- got compiled for wasm32. Nothing
          # ships that combination, so it gated nothing. Do not restore the row.
          #
          # `cargo check` is not a web gate either: binding generation is a step
          # cargo never runs, and that is where the wgpu
          # `duplicate string enums: GpuFilterMode` break surfaced.
          # `web_dist` marks the one row that stages a publishable `dist/`. It
          # is not named for a host: the tree is uploaded once, and whichever
          # deploy job wants it downloads it.
          - name: web-wasm32
            target: wasm32-unknown-unknown
            web_dist: true
            cmd: |
              apt-get update -qq
              apt-get install -y -qq --no-install-recommends python3
              # THE nightly carve-out, and its whole extent in this workflow:
              # one wrapped command in one row. wasm-threads.sh overrides
              # RUSTUP_TOOLCHAIN for this process tree only, rebuilds std
              # against `+atomics` and passes the shared-memory link args.
              # Every other row in this matrix -- Android, iOS, macOS, the
              # native Linux and Windows builds -- is untouched and stays on
              # the `rust-toolchain.toml` stable pin.
              .github/scripts/wasm-threads.sh \
                wasm-pack build squallar-web --target web --release --no-typescript --no-pack

              # Opt-in list. The old extension allowlist shipped `tests/*.mjs`
              # and carried `*.json` -- what a leaked service-account key wears.
              rm -rf dist && mkdir -p dist/pkg
              cp squallar-web/index.html squallar-web/manifest.webmanifest squallar-web/sw.js squallar-web/heap.js squallar-web/worker.js squallar-web/tile-lane.js dist/
              cp -R squallar-web/icons dist/icons
              cp squallar-web/pkg/squallar_web.js squallar-web/pkg/squallar_web_bg.wasm dist/pkg/
              # wasm-bindgen emits this only for crates using JS snippets.
              if [ -d squallar-web/pkg/snippets ]; then cp -R squallar-web/pkg/snippets dist/pkg/snippets; fi
              # The committed NWS zone-geometry pack, checked into the tree and
              # refreshed by `zone-pack.yaml`. Not built here: producing it needs
              # six shapefile zips off weather.gov and a minute of RDP, and this
              # row builds the wasm. Staging it is the whole reason it is
              # committed -- the CloudFront deploy is an `s3 sync --delete`, so a
              # copy uploaded out of band is deleted on the next push.
              cp squallar-web/zones.pack dist/
              echo "Staged:"; find dist -type f | sort | sed 's/^/  /'

              # `cache.addAll` is all-or-nothing: one unstaged shell path and the
              # worker never installs, silently un-PWA-ing the site.
              # `pwa_assets.rs` checks the source tree; this checks what ships.
              n=0
              for q in $(tr '\n' ' ' <squallar-web/sw.js | grep -oE 'SHELL_PATHS = \[[^]]*\]' | grep -oE '"[^"]*"'); do
                p=$(printf %s "$q" | tr -d '"')
                test -f "dist/${p:-index.html}" || { echo "::error::sw.js precaches '$p', which is not staged"; exit 1; }
                n=$((n + 1))
              done
              test "$n" -ge 2 || { echo "::error::SHELL_PATHS parsed as $n entries; the parse is wrong or the list was gutted"; exit 1; }
              echo "ok: all $n SHELL_PATHS entries are staged"

              # The other half of sw.js's cache map. `ASSET_PATHS` is fetched on
              # demand and cached on the way past, deliberately outside the
              # all-or-nothing shell install -- which is also why it needs a gate
              # of its own here. A missing shell path breaks the worker install
              # loudly; a missing asset is silent, because `zone_pack_source`
              # treats an absent pack as a supported state and every zone just
              # goes back to costing an api.weather.gov request. Green deploy,
              # ~1690 requests a round, nobody looks.
              #
              # Parsed out of sw.js rather than named here, same as above: the
              # filename lives in exactly one place per layer (`PACK_FILE_NAME`
              # in Rust, `ASSET_PATHS` in JS, pinned to each other by
              # `pwa_assets.rs`) and this file does not get to hold a third copy.
              n=0
              for q in $(tr '\n' ' ' <squallar-web/sw.js | grep -oE 'ASSET_PATHS = \[[^]]*\]' | grep -oE '"[^"]*"'); do
                p=$(printf %s "$q" | tr -d '"')
                test -f "dist/$p" || { echo "::error::sw.js caches '$p' as a same-origin asset, which is not staged"; exit 1; }
                n=$((n + 1))
              done
              test "$n" -ge 1 || { echo "::error::ASSET_PATHS parsed as $n entries; the parse is wrong or the list was gutted"; exit 1; }
              echo "ok: all $n ASSET_PATHS entries are staged"

          # ── The two `squallar-egui` standalone rows ──
          #
          # These were the `basemap-vector` feature rows until the flip landed
          # (2026-08-29): the feature was deleted, `pmtiles` became an
          # unconditional dependency of `squallar-egui`, and the CartoDB raster
          # path stopped existing. The rows stay, as DEFAULT rows, because the
          # coverage they carried was never really about the feature flag:
          #
          # * `squallar-egui` compiled as the ROOT package, per target. The
          #   `gps-serial` lesson below is about a crate that only ever built
          #   as somebody's dependency; the `standalone` row covers the host
          #   triple but nothing else compiles this crate's --all-targets
          #   surface rooted at `-p squallar-egui` on wasm32.
          # * The dependency is target-split, so one row cannot cover the
          #   other even in principle: on wasm32 `pmtiles` arrives with
          #   `__async` alone, on a native triple with `__async` *and*
          #   `http-async` -- different code paths (the manifest records two
          #   E0277s from compiling the native backend on wasm32).
          # * The native row also RUNS the crate's tests with `squallar-egui`
          #   as the root package. The archive tests are unconditional now, so
          #   `cargo test --workspace` selects them too; this row is the one
          #   that survives any future re-scoping of the workspace suite.
          #
          # The `cargo tree` line after each check is a non-vacuity floor with
          # a new meaning since the flip: `pmtiles` in the DEFAULT graph is the
          # flip itself. It goes red if someone re-features the dependency --
          # which would be un-flipping the basemap and needs to be loud.
          #
          # NON-ARTIFACT, deliberately: neither row carries an `artifact:` key,
          # so the upload step below skips both. (Shipping `pmtiles` -- and,
          # on wasm32, the `tokio` its `__async` pulls in -- in the real
          # artifacts is now intended: it is the basemap.) A herestring and
          # not a pipe into `grep -q`: these steps run under `bash -eo
          # pipefail`, where a `grep -q` that exits on its first match leaves
          # the producer holding a SIGPIPE and the pipeline reporting 141.
          - name: egui-standalone-wasm32
            target: wasm32-unknown-unknown
            cmd: |
              cargo check -p squallar-egui --all-targets \
                --target wasm32-unknown-unknown
              out=$(cargo tree -i pmtiles -p squallar-egui \
                --target wasm32-unknown-unknown -e normal --prefix none)
              grep -qE '^pmtiles v' <<<"$out" \
                || { echo "::error::pmtiles left squallar-egui's default wasm32 graph; the archive basemap has been re-featured or dropped"; exit 1; }
              echo "ok, wasm32 graph carries $(grep -E '^pmtiles v' <<<"$out" | head -1)"
          - name: egui-standalone-linux-x86_64
            target: x86_64-unknown-linux-gnu
            cmd: |
              cargo check -p squallar-egui --all-targets \
                --target x86_64-unknown-linux-gnu
              # And RUN them, with squallar-egui as the ROOT package -- the
              # `gps-serial` failure was precisely a crate that only ever
              # built as somebody else's dependency.
              cargo test -p squallar-egui \
                --target x86_64-unknown-linux-gnu
              out=$(cargo tree -i pmtiles -p squallar-egui \
                --target x86_64-unknown-linux-gnu -e normal --prefix none)
              grep -qE '^pmtiles v' <<<"$out" \
                || { echo "::error::pmtiles left squallar-egui's default x86_64-unknown-linux-gnu graph; the archive basemap has been re-featured or dropped"; exit 1; }
              echo "ok, native graph carries $(grep -E '^pmtiles v' <<<"$out" | head -1)"

          # Not a triple: every member alone on its own default features, which
          # `--all-features` hides. squallar-egui was broken this way for weeks --
          # it called the port enumeration (`detect_gps_ports`, squallar-nmea-serial
          # today) while that sat behind
          # its `serial` feature, which every desktop row turns on.
          - name: standalone
            cmd: |
              members=$(cargo tree --workspace --depth 0 --prefix none | awk 'NF {print $1}' | sort -u)
              test -n "$members" || { echo "::error::cargo tree listed no workspace members"; exit 1; }
              fail=0
              for m in $members; do
                echo "::group::$m"
                cargo check -p "$m" --all-targets || fail=1
                echo "::endgroup::"
              done
              exit "$fail"

          # One crate resolved to two versions -- invisible to every compiler.
          # Bumping `jni` or `rustls-platform-verifier` alone still builds, and
          # Android TLS goes silently no-op. A second `wgpu` copy once left
          # squallar-app's backend selection applying to an inert one; its
          # `const _` guard is per-crate, so this is the only graph-wide check.
          # Per-target, because resolution is, and `-p`-scoped to the crate that
          # actually ships that target: an unscoped `cargo tree -i` answers for
          # the union of the workspace graph, which is not what any one artifact
          # links. On iOS that union already lies -- it reports serialport, which
          # the linked binary does not contain.
          - name: dep-unification
            cmd: |
              fail=0
              # Each spec is <shipping crate>:<target>.
              check() {
                crate=$1; shift
                for spec in "$@"; do
                  pkg=${spec%%:*}; t=${spec#*:}
                  # cargo tree exits non-zero with "specification is ambiguous"
                  # when two copies resolve -- itself the failure, so report it
                  # rather than let it surface as a misleading "found 0".
                  if ! out=$(cargo tree -i "$crate" -p "$pkg" --target "$t" -e normal --prefix none 2>&1); then
                    echo "::error::cargo tree -i $crate -p $pkg --target $t failed:"
                    printf '%s\n' "$out" | sed 's/^/    /'
                    fail=1; continue
                  fi
                  found=$(printf '%s\n' "$out" | grep -E "^$crate v" | sort -u) || true
                  n=$(printf '%s\n' "$found" | grep -c .) || true
                  if [ "$n" = 1 ]; then
                    echo "ok [$pkg $t]: $found"
                  else
                    # 0 is a failure too: scoped, it means the crate left the
                    # artifact's graph entirely.
                    echo "::error::expected exactly 1 version of $crate in the $pkg $t graph, found $n"
                    printf '%s\n' "$found" | sed 's/^/    /'
                    fail=1
                  fi
                done
              }
              check jni                      squallar:aarch64-linux-android squallar:x86_64-linux-android
              check rustls-platform-verifier squallar:aarch64-linux-android squallar:x86_64-linux-android
              check wgpu                     squallar:x86_64-unknown-linux-gnu squallar:aarch64-apple-ios squallar-web:wasm32-unknown-unknown squallar:aarch64-linux-android
              # Same four graphs as wgpu, because reqwest is in all of them and
              # resolution differs per target: on wasm32 it is a fetch() shim
              # with no TLS stack, elsewhere it carries rustls. Two copies would
              # mean half the app's HTTP going through a client whose TLS
              # configuration nothing in this tree set.
              check reqwest                  squallar:x86_64-unknown-linux-gnu squallar:aarch64-apple-ios squallar-web:wasm32-unknown-unknown squallar:aarch64-linux-android
              # NOT `check webpki-roots`, and this is a measured refusal rather
              # than an omission. There really are two copies in Cargo.lock,
              # 0.26.11 and 1.0.9, so the check would be meaningful -- and it
              # would be RED today, in every one of these graphs. `cargo tree -i
              # webpki-roots@0.26.11 -p squallar --target
              # x86_64-unknown-linux-gnu` prints
              # `webpki-roots 0.26.11 <- tungstenite 0.24.0 <- ewebsock 0.8.0 <-
              # squallar-radar`, i.e. the old copy arrives through the websocket
              # client's pinned tungstenite and cannot be dislodged by anything
              # in this file. Unpinned, the spec is not even answerable: cargo
              # exits non-zero with "specification `webpki-roots` is ambiguous",
              # which `check()` above correctly reports as a failure. Add the
              # line when ewebsock's tungstenite moves, not before.
              exit "$fail"

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Use the image's toolchain
        # rust-toolchain.toml says `stable`; obeying it here makes rustup fetch
        # a toolchain with none of the image's 23 preinstalled targets. Read the
        # pin from the image's own RUST_VERSION so an image bump carries itself.
        run: echo "RUSTUP_TOOLCHAIN=${RUST_VERSION:?the rust-cross image must set RUST_VERSION}" >> "$GITHUB_ENV"

      - name: Assert the image still ships ${{ matrix.target }}
        if: matrix.target
        # Nothing adds targets here, so this is really about image drift.
        run: |
          rustup show
          rustup target list --installed | grep -qx '${{ matrix.target }}' \
            || { echo "::error::the rust-cross image no longer ships ${{ matrix.target }} std."; exit 1; }

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: ${{ matrix.name }}
          # The iOS rows build into target-ios/, not target/; without this they
          # would cache and restore an empty directory on every run.
          workspaces: ${{ matrix.workspaces || '.' }}
          # CARGO_HOME is the image's /usr/local/cargo; restoring a cached bin/
          # over it would shadow the image's own wasm-pack and cargo-ndk.
          cache-bin: "false"

      # ── The two Android steps below run *before* the row's own command ──
      #
      # Unlike the macOS packaging steps further down, which take a binary the
      # row already built, these are prerequisites of the build itself: on the
      # Android rows Gradle is what compiles the Rust, so the SDK and the
      # signing key have to exist before `assembleRelease`, not after it.
      #
      # `~/.gradle` is deliberately NOT cached, and that is a measured decision
      # rather than an omission. `rust-cache` above covers Cargo only, so a
      # Gradle build does add a second cacheable tree -- it is simply not one
      # worth caching. Measured from a completely empty Gradle home: the whole
      # Gradle-side cost, wrapper distribution included, is 39 s wall clock,
      # and what it leaves behind is 708 MB (163 MB of unpacked distribution,
      # 544 MB of resolved AGP and its dependencies).
      #
      # Caching that saves some part of 39 s and costs 708 MB *per row*, in a
      # repository cache budget of 10 GB that the eleven `rust-cache` entries
      # already share. Those entries save minutes each; spending 1.4 GB of the
      # budget that keeps them alive, to save seconds, is the wrong side of
      # that trade. Revisit it if the Gradle build ever grows a step that is
      # slow rather than merely large.
      - name: Install the SDK packages this build needs
        if: matrix.package == 'android'
        # The image carries the NDK -- at exactly the version and path
        # build.gradle.kts pins, `$ANDROID_HOME/ndk/27.3.13750724` -- plus a
        # JDK 21 and the cmdline-tools. What it does not carry is either half of
        # what AGP asks for here: its Android platform is `android-37.0` and its
        # build-tools are `37.0.0`, while `compileSdk` is 36 and AGP 9.3.1's
        # DEFAULT_BUILD_TOOLS_REVISION is 36.0.0. A *newer* package satisfies
        # neither request; both are looked up by exact version.
        #
        # The conclusion that invites -- that without this step the build dies
        # in `:app:minifyReleaseWithR8` with "Failed to find target with hash
        # string 'android-36'" -- is wrong, and this was checked rather than
        # reasoned about. With this step deleted, a cold Gradle home and an
        # empty build cache, this image takes that very task to BUILD
        # SUCCESSFUL, logging "License for package Android SDK Build-Tools 36
        # accepted" and "Installing Android SDK Platform 36 in
        # /opt/android-sdk/platforms/android-36" on the way, and leaves both
        # packages on disk. AGP downloads what it is missing. That failure is
        # real only with AGP's auto-download disabled, which is not a
        # configuration this job uses.
        #
        # So the step is not a prerequisite. It stays because it makes the
        # download legible and names the versions. Roughly 70 MB comes off
        # dl.google.com either way -- fetched here, a bad minute at Google is a
        # red step called "Install the SDK packages this build needs"; fetched
        # inside `assembleRelease`, it is a Gradle task dying partway through a
        # Rust compile, which reads like the build broke. The two versions
        # below are also the only statement anywhere in this repository of what
        # AGP 9.3.1 actually asks for.
        #
        # Not pinned by sha256 the way `rcodesign` is below, and the difference
        # is real rather than an oversight. rcodesign is a tarball pulled off a
        # release page with curl, which verifies nothing at all. `sdkmanager` is
        # the SDK's own package manager: it resolves against Google's repository
        # manifest and checks every package against the checksum in it, which is
        # the same standing this file already extends to `apt-get`. What does
        # have to be pinned is the *version*, and both of them are.
        #
        # `compileSdk` is read out of build.gradle.kts instead of written again
        # here, because that number belongs to the repo and a second copy of it
        # would drift in silence -- exactly because of the auto-download above.
        # A stale literal would not fail; it would leave this step installing
        # one platform while the build quietly fetched and used another, with
        # nothing anywhere to notice the divergence.
        #
        # `build-tools;36.0.0` beside it is a literal, and that asymmetry is
        # deliberate rather than the thing the paragraph above complains about.
        # There is nothing in this repository to read it from: build.gradle.kts
        # never sets `buildToolsVersion`, so 36.0.0 is AGP 9.3.1's own
        # DEFAULT_BUILD_TOOLS_REVISION -- a property of the plugin, not of this
        # code, and reachable only by parsing AGP's jar. What makes the literal
        # tolerable where a `compileSdk` literal would not be is the same
        # auto-download: AGP fetches the revision it actually wants regardless,
        # so a stale number here costs a redundant download, not a red row.
        #
        # `--licenses` is a no-op in this image. All seven files under
        # `$ANDROID_HOME/licenses/` survive its final `rm -rf` -- checked, not
        # assumed. It is kept as insurance against a *future* image that stops
        # shipping them, where sdkmanager would refuse to install anything and
        # this step would be the only thing standing between that image and a
        # broken Android row. It costs about a second.
        #
        # It is fed by redirection from a process substitution and *not* by the
        # `yes | sdkmanager --licenses` every guide writes, because this job
        # runs under `bash -eo pipefail`. sdkmanager stops reading once it has
        # its answers, `yes` takes SIGPIPE, and pipefail hands the pipeline
        # `yes`'s 141 -- so the idiom aborts the step, having done its work,
        # whether or not there was anything left to accept. Measured at 141 in
        # both the already-licensed and the never-licensed case; a redirection
        # is not a pipeline, so there is no status for pipefail to adopt.
        #
        # `|| true` on the grep is load-bearing rather than defensive noise.
        # Without it the `test -n` under it is unreachable: `set -e` aborts on
        # an assignment whose command substitution failed, so a `compileSdk`
        # line that stopped matching would end the step on grep's bare exit 1
        # and the `::error::` would never be printed. Checked both ways -- the
        # annotation appears only with the `|| true` there.
        run: |
          sdk=$(grep -oP '^\s*compileSdk\s*=\s*\K[0-9]+' packaging/android/app/build.gradle.kts || true)
          test -n "$sdk" \
            || { echo "::error::could not read compileSdk out of app/build.gradle.kts"; exit 1; }
          sdkmanager --licenses < <(yes) >/dev/null
          sdkmanager "platforms;android-$sdk" "build-tools;36.0.0"

      - name: Mint a throwaway signing key
        if: matrix.package == 'android'
        # Android will not install an unsigned APK, so a release artifact has to
        # be signed with something, and that something must not be a real key:
        # a signing key wired into CI is reachable by any change to the workflow
        # that runs it, and these artifacts are per-commit test builds, not Play
        # Store uploads.
        # Writing `keystore.properties` is the whole integration -- build.gradle.kts
        # creates its `release` signingConfig if and only if that file is there,
        # so nothing in the Gradle build changes for this.
        #
        # It also means the loud "NO SIGNING KEY" warning build.gradle.kts
        # raises at the end of an unsigned release build stops firing here
        # because the artifact is genuinely signed -- not because anything
        # suppressed it. If this step is ever removed, that warning comes back
        # and the upload fails on the `-unsigned` filename.
        #
        # ── Why the key is fresh every run, and what that costs ──
        #
        # The tempting alternative is "just use the stock Android debug key",
        # and it does not exist. `~/.android/debug.keystore` is *generated per
        # machine* by the Android tooling; what is standard about it is only the
        # `androiddebugkey` alias, the `android` password and the `CN=Android
        # Debug` subject. The keypair behind them is not standard, and Android
        # compares the signing certificate, not its subject -- so writing that
        # DN here would produce a different identity every run anyway, while
        # implying a stability it does not have.
        #
        # So this identity changes per run, and the consequence is worth naming
        # rather than hiding: installing one run's APK over another's fails with
        # INSTALL_FAILED_UPDATE_INCOMPATIBLE, and the fix is to
        # `adb uninstall app.squallar` first. The assertion step below
        # puts that in the run's own log as a `::notice::`. It is emitted from
        # there and not from here so that it is only ever attached to a run
        # that produced an APK -- said at this point, a row that failed to
        # compile would still advise the reader how to install an artifact that
        # does not exist.
        #
        # A stable identity is only reachable by persisting key material, and
        # there are exactly two ways: commit it -- a private key in the repo, no
        # -- or add a repository secret and base64 it in here, the way
        # MACOS_SIGNING_P12 is handled below. That is the change to make if
        # reinstalling ever becomes the annoyance macOS's location re-prompt is;
        # it is not wired up speculatively.
        #
        # The DN is deliberately *not* `CN=Android Debug`. Whoever inspects this
        # certificate should be able to see at a glance that it is neither a
        # release key nor a locally built debug APK.
        #
        # The password is in the clear on purpose and is not a secret: it guards
        # a keypair generated three lines above it and destroyed with the
        # container. Both files land on paths packaging/android/.gitignore
        # already covers (`keystore.properties`, `*.jks`), so a stray `git add`
        # cannot carry either of them.
        #
        # `$JAVA_HOME/bin/keytool`, not bare `keytool` -- but not because bare
        # `keytool` is missing. It resolves perfectly well here, through
        # /usr/bin/keytool -> /etc/alternatives/keytool. That *is* the reason:
        # what PATH offers is Debian's `alternatives` symlink, which points at
        # whichever JDK the image last selected, while Gradle and AGP run under
        # JAVA_HOME. Today both land on the same JDK 21. Naming JAVA_HOME is
        # what keeps the keystore written by the same JDK that reads it on the
        # day the image gains a second one.
        run: |
          cd packaging/android
          # Idempotent by deletion. keytool refuses a second `-genkeypair` into
          # a keystore that already holds the alias ("Key pair not generated,
          # alias <ci> already exists"), which a GitHub-hosted runner never
          # reaches -- its workspace is new every time -- and which a
          # self-hosted one would hit on its second run. The keystore is
          # throwaway by construction, so throwing the old one away is the
          # entire fix.
          rm -f ci-signing.jks keystore.properties
          "$JAVA_HOME/bin/keytool" -genkeypair -v \
            -keystore ci-signing.jks -storetype PKCS12 \
            -alias ci -keyalg RSA -keysize 2048 -validity 10950 \
            -storepass squallar-ci-throwaway -keypass squallar-ci-throwaway \
            -dname "CN=squallar CI, OU=throwaway signing key, O=squallar, C=US"
          {
            echo "storeFile=ci-signing.jks"
            echo "storePassword=squallar-ci-throwaway"
            echo "keyAlias=ci"
            echo "keyPassword=squallar-ci-throwaway"
          } > keystore.properties

      # `rcodesign` and `zip` before the row runs, not after: unlike the macOS
      # rows -- which build a bare binary and package it in a later step --
      # packaging/ios/Makefile assembles, signs and zips in one pass, so the
      # signer has to already be on PATH when the row's own command starts.
      # Same pin and same reasoning as the macOS install step further down: a
      # tool fetched over the wire and then trusted to sign our releases is not
      # a tool, it is a supply chain.
      - name: Install the iOS packaging tools
        if: matrix.package == 'ios'
        run: |
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends curl zip
          v="$SIGNTOOL_VERSION"
          base=apple-codesign-$v-x86_64-unknown-linux-musl
          curl -fsSL -o /tmp/rcodesign.tar.gz \
            "https://github.com/indygreg/apple-platform-rs/releases/download/apple-codesign%2F$v/$base.tar.gz"
          echo "$SIGNTOOL_SHA256  /tmp/rcodesign.tar.gz" | sha256sum -c -
          tar -xzf /tmp/rcodesign.tar.gz -C /tmp
          install -m 0755 "/tmp/$base/rcodesign" /usr/local/bin/rcodesign
          rcodesign --version
          # The same trap the macOS install step guards, and it applies here for
          # the same reason: this row signs too, so an RCODESIGN_-prefixed
          # variable leaking in would be read as configuration and kill the
          # signature further down, where it reads as a signing failure rather
          # than a naming one.
          if env | grep -q '^RCODESIGN_'; then
            echo "::error::RCODESIGN_-prefixed variables are set and rcodesign will read them as configuration:"
            env | grep '^RCODESIGN_' | sed 's/=.*/=<redacted>/' >&2
            echo "Rename them (this workflow uses SIGNTOOL_* for exactly this reason)." >&2
            exit 1
          fi

      - name: ${{ matrix.name }}
        # The three iOS signing inputs are set on this step rather than in a
        # step of their own because for iOS the row's build IS the signing --
        # see the note above. Every other row ignores them. All three are empty
        # on a fork pull request, which is the unsigned path, and the artifact
        # that comes out of it is NAMED for that.
        env:
          IOS_SIGNING_P12: ${{ secrets.IOS_SIGNING_P12 }}
          IOS_SIGNING_P12_PASSWORD: ${{ secrets.IOS_SIGNING_P12_PASSWORD }}
          IOS_PROVISIONING_PROFILE: ${{ secrets.IOS_PROVISIONING_PROFILE }}
        run: ${{ matrix.cmd }}

      # Read the outcome off the disk rather than off the condition that was
      # supposed to produce it. packaging/ios/Makefile writes exactly one of
      # the two .ipa names and a one-word reason in SIGNING beside it.
      - name: Name the iOS artifact by whether it can be uploaded
        id: ios
        if: matrix.ios_out
        run: |
          out='${{ matrix.ios_out }}'
          reason=$(cat "$out/SIGNING" 2>/dev/null || echo unknown)
          if [ -f "$out/squallar.ipa" ]; then
            printf 'artifact=ios-aarch64\nipa=%s/squallar.ipa\nsigned=yes\nreason=%s\n' "$out" "$reason" >> "$GITHUB_OUTPUT"
            echo "::notice::ios-aarch64 is signed for App Store distribution and can be uploaded to TestFlight."
          elif [ -f "$out/squallar-UNSIGNED.ipa" ]; then
            printf 'artifact=ios-aarch64-UNSIGNED\nipa=%s/squallar-UNSIGNED.ipa\nsigned=no\nreason=%s\n' "$out" "$reason" >> "$GITHUB_OUTPUT"
            echo "::notice::ios-aarch64-UNSIGNED cannot be installed on a device and cannot be uploaded (reason: $reason). Expected for a pull request, and for a repository whose IOS_* secrets are not set yet."
          else
            echo "::error::the iOS row reported success and left no .ipa under either name in $out"
            ls -la "$out" || true
            exit 1
          fi

      - name: Upload the iOS build
        if: matrix.ios_out
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.ios.outputs.artifact }}
          path: ${{ steps.ios.outputs.ipa }}
          if-no-files-found: error

      - name: Prove the APK is a signed, non-debuggable release
        if: matrix.package == 'android'
        # Run against the exact file that is about to be uploaded, not against
        # the build that produced it.
        #
        # `apksigner verify` on its own establishes only that the APK carries
        # *a* valid signature, which any stray keystore.properties would
        # satisfy just as well as the one the step above wrote. The DN grep is
        # what makes it *this* key: apksigner prints
        # `V2 Signer: certificate DN: CN=squallar CI, OU=throwaway signing key,
        # O=squallar, C=US` on stdout, so an APK signed by something unexpected
        # reddens the row instead of going out as though this workflow had
        # minted it. `OU=` rather than the whole DN, because the OU is the part
        # that says what the key is *for*.
        #
        # `application-debuggable` is the assertion that earns its keep.
        # `assembleRelease` is one word away from `assembleDebug`, both produce
        # an APK that installs and runs, and the difference is that one of them
        # is a debuggable process holding GPS fixes and cached configuration
        # that any app on the device can attach to. Nothing else in this file
        # would notice the substitution: aapt2 prints that line for a debug
        # build and prints nothing for a release one.
        #
        # The ABI line catches the other silent swap. A dropped or mistyped
        # `-PabiFilter` yields an APK carrying both libraries, which installs
        # perfectly well -- so both rows would go green while uploading the same
        # fat file under two different names. Comparing the whole line rather
        # than searching within it is what makes that fail: aapt2 lists every
        # ABI on it, so an extra one no longer matches.
        #
        # These two tools are taken from whatever build-tools is newest rather
        # than from the pinned 36.0.0 the step above installs, and that is the
        # point: AGP looks its build-tools up by exact version, while apksigner
        # and aapt2 are being used here as general-purpose readers of a finished
        # APK and any recent copy will do.
        run: |
          bt=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          apk='${{ matrix.artifact }}'

          certs=$("$bt/apksigner" verify --verbose --print-certs "$apk")
          printf '%s\n' "$certs"
          if ! printf '%s\n' "$certs" | grep -q 'OU=throwaway signing key'; then
            echo "::error::$apk carries a valid signature, but not from the throwaway key this workflow mints."
            exit 1
          fi

          badging=$("$bt/aapt2" dump badging "$apk")
          if printf '%s\n' "$badging" | grep -q '^application-debuggable'; then
            echo "::error::$apk is debuggable, so it is not the release build this row claims to ship."
            exit 1
          fi

          # `|| true` so that a missing line reaches the comparison below and is
          # reported, rather than killing the step on grep's exit status under
          # `set -e` with nothing said about why.
          got=$(printf '%s\n' "$badging" | grep '^native-code:' || true)
          want="native-code: '${{ matrix.abi }}'"
          if [ "$got" != "$want" ]; then
            echo "::error::expected exactly [$want] in $apk, got [$got]"
            exit 1
          fi
          echo "ok: signed by the throwaway key, not debuggable, $got"
          echo "::notice::${{ matrix.name }} is signed with a throwaway key that differs every run. Installing it over an earlier CI build fails with INSTALL_FAILED_UPDATE_INCOMPATIBLE; run 'adb uninstall app.squallar' first."

      # Neither `curl` nor `zip` is in the image — every layer that installed
      # curl purged it in the same `RUN` — and `rcodesign` never was. The
      # signer is pinned by version *and* by digest: a tool fetched over the
      # wire and then trusted to sign our releases is not a tool, it is a
      # supply chain.
      - name: Install packaging tools
        if: matrix.package == 'macos'
        run: |
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends curl zip
          v="$SIGNTOOL_VERSION"
          base=apple-codesign-$v-x86_64-unknown-linux-musl
          curl -fsSL -o /tmp/rcodesign.tar.gz \
            "https://github.com/indygreg/apple-platform-rs/releases/download/apple-codesign%2F$v/$base.tar.gz"
          echo "$SIGNTOOL_SHA256  /tmp/rcodesign.tar.gz" | sha256sum -c -
          tar -xzf /tmp/rcodesign.tar.gz -C /tmp
          install -m 0755 "/tmp/$base/rcodesign" /usr/local/bin/rcodesign
          rcodesign --version
          # rcodesign reads its own config out of RCODESIGN_* environment
          # variables, so any that leak in here silently become config keys and
          # the first `sign` dies with "configuration file error". Catch it at
          # the install step, where the message can say what to do, rather than
          # 200 lines later where it reads as a signing failure.
          if env | grep -q '^RCODESIGN_'; then
            echo "::error::RCODESIGN_-prefixed variables are set and rcodesign will read them as configuration:"
            env | grep '^RCODESIGN_' | sed 's/=.*/=<redacted>/' >&2
            echo "Rename them (this workflow uses SIGNTOOL_* for exactly this reason)." >&2
            exit 1
          fi

      # `BIN=` rather than a second build: the row above has already compiled
      # exactly this binary for exactly this triple. `BIN=` names a path and
      # therefore also names a profile, so it is the one place in this file
      # where the shipped .app's optimization level is decided -- it must track
      # the row's own `--release`, or the bundle carries a binary the row did
      # not intend to ship.
      #
      # ── The secrets this needs, all created by hand ──
      #
      # `MACOS_SIGNING_P12`          base64 of a .p12 signing certificate
      # `MACOS_SIGNING_P12_PASSWORD` its password
      #
      # Three more exist for the App Store Connect API key --
      # `APPSTORE_CONNECT_ISSUER_ID`, `APPSTORE_CONNECT_KEY_ID`,
      # `APPSTORE_CONNECT_KEY_P8`, one App Manager key shared with the iOS
      # TestFlight upload -- and they are NOT read here. This step signs; the `macos-universal` job below is what submits
      # to Apple, because it is the job that has both architectures and so is
      # the only one that can send a single submission. What each of the five
      # is, and what a person has to do at developer.apple.com to obtain them,
      # is written out at the top of packaging/macos/Makefile.
      #
      # Generate them once, on any machine with rcodesign:
      #
      #   rcodesign generate-self-signed-certificate \
      #     --algorithm rsa \
      #     --person-name squallar --validity-days 3650 \
      #     --p12-file squallar-signing.p12 --p12-password "$PW"
      #   base64 -w0 squallar-signing.p12   # -> MACOS_SIGNING_P12
      #
      # `--algorithm rsa` is not decoration. macOS verifies only RSA and ECDSA
      # code signatures; an Ed25519 key signs cleanly on this side and is
      # rejected as "code or signature have been modified" on a Mac. The
      # packaging Makefile fails the build if the signature it just wrote uses
      # anything else, so this cannot ship silently again.
      #
      # **The same certificate must be reused for every run, forever.** macOS
      # remembers a location grant against the app's *designated requirement*,
      # which for a certificate-signed app pins the signing leaf. Minting a
      # fresh keypair per run — the obvious CI-friendly thing to do — produces
      # a new leaf, hence a new requirement, hence a new app as far as
      # `locationd` is concerned, and the user is asked for location again on
      # every single build. That is the exact failure this packaging exists to
      # prevent, so it must not be automated away. `--validity-days 3650`
      # rather than the 365 default for the same reason: an expiry is a forced
      # rotation, and a rotation costs every user one more prompt.
      #
      # Until the secret exists, and on every fork pull request (which never
      # gets secrets), packaging/macos/Makefile falls back to an **ad-hoc** signature.
      # That still launches on arm64 — it is a real signature — but its
      # designated requirement is the code hash, so it re-prompts on each
      # rebuild. The Makefile says so in the log; it is a labelled fallback,
      # not a silent one.
      #
      # Either way the bundle now carries the hardened runtime, and the Makefile
      # fails the build if the signature it just wrote does not — on every arm,
      # so the check has teeth on a fork pull request and does not wait for a
      # paid Apple account to start working.
      #
      # Per-architecture build, never notarized here by design; the
      # macos-universal job fuses both halves and notarizes that one -- look
      # there for the notarized artifact. The marker tells the Makefile so:
      # without it the recipe would report the App Store Connect key as
      # missing on a row that is not supposed to have it, which is what it
      # told the person who had just configured all three.
      - name: Package squallar.app
        if: matrix.package == 'macos'
        env:
          MACOS_SIGNING_P12: ${{ secrets.MACOS_SIGNING_P12 }}
          MACOS_SIGNING_P12_PASSWORD: ${{ secrets.MACOS_SIGNING_P12_PASSWORD }}
          APPSTORE_CONNECT_WITHHELD: per-arch-row
        run: |
          make -C packaging/macos IN_CONTAINER=1 ARCHIVE=1 \
            ARCH=${{ matrix.macos_arch }} \
            BIN=target/${{ matrix.target }}/release/squallar

      - name: Upload native build
        if: matrix.artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.name }}
          path: ${{ matrix.artifact }}
          if-no-files-found: error

      # The two halves the `macos-universal` job fuses, and deliberately the
      # UNSIGNED ones: fusing two already-signed Mach-Os would carry two stale
      # signatures into the fat file for the next `sign` to write over. The
      # per-arch `.app.zip` above stays -- it is what proves each row's own
      # packaging works, and it is the fallback if somebody needs one arch --
      # but it is not what a person should be asked to choose between.
      - name: Upload the unsigned macOS binary
        if: matrix.macos_bin
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: macos-bin-${{ matrix.macos_arch }}
          path: ${{ matrix.macos_bin }}
          if-no-files-found: error

      # Uploaded on every run so a pull request proves the artifact assembles.
      # `deploy-cloudfront` publishes this one; nothing is rebuilt there.
      - name: Upload web dist
        if: matrix.web_dist
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: web-dist
          path: dist
          if-no-files-found: error

  # The one macOS download a person should be offered: a single .app that runs
  # on both architectures, signed once and notarized once.
  #
  # Why a job and not a matrix row. Nothing can fuse the two halves until both
  # rows have finished, and they run in parallel; a single row building both
  # triples would put the sum of two workspace builds on the critical path.
  # What that costs is exactly this: one extra job, one artifact hop, and one
  # more line in `build-success`. What it buys is one file instead of a choice,
  # and ONE notarization submission per run instead of two -- a submission is
  # an upload plus a wait, and Apple issues a ticket per submission.
  #
  # NOT in the rust-cross container, and `BIN_ARM64=`/`BIN_X86_64=` are why:
  # nothing here compiles. `make`, `curl`, `tar` and `zip` are on the runner
  # image already, so this job skips a 15 GB image pull to run four tools. The
  # price is that `otool` is absent, so the Makefile's deployment-target guard
  # prints that it skipped -- the two per-arch rows ran it on these same
  # binaries minutes earlier, inside the image that has it.
  macos-universal:
    name: macos-universal
    runs-on: ubuntu-24.04
    needs: [build]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # This job asserts what it assumes rather than discovering it three steps
      # later as a bare "command not found" out of a Makefile recipe.
      - name: Assert the runner has the tools this job does not install
        run: |
          for t in make curl tar zip; do
            command -v "$t" >/dev/null \
              || { echo "::error::$t is not on the ubuntu-24.04 runner image; this job assumed it was."; exit 1; }
          done

      # Same tool, same pin, same reasoning as the matrix rows -- installed
      # under RUNNER_TEMP rather than /usr/local/bin because this job is not
      # root and has no reason to become it.
      - name: Install the signer
        run: |
          v="$SIGNTOOL_VERSION"
          base=apple-codesign-$v-x86_64-unknown-linux-musl
          curl -fsSL -o "$RUNNER_TEMP/rcodesign.tar.gz" \
            "https://github.com/indygreg/apple-platform-rs/releases/download/apple-codesign%2F$v/$base.tar.gz"
          echo "$SIGNTOOL_SHA256  $RUNNER_TEMP/rcodesign.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/rcodesign.tar.gz" -C "$RUNNER_TEMP"
          mkdir -p "$RUNNER_TEMP/bin"
          install -m 0755 "$RUNNER_TEMP/$base/rcodesign" "$RUNNER_TEMP/bin/rcodesign"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - name: Download the arm64 half
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: macos-bin-aarch64
          path: halves/aarch64
      - name: Download the x86_64 half
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: macos-bin-x86_64
          path: halves/x86_64

      # A rehearsal of the notarization credential path that needs no Apple
      # account, so it runs on every event including a fork pull request.
      #
      # `encode-app-store-connect-api-key` is the piece most likely to be got
      # wrong -- three values off three different pages, combined into one file
      # -- and it is the only part of the notary path that can be exercised
      # with no server on the other end. The key here is a throwaway P-256 one
      # minted by the signer itself: an App Store Connect key is an ECDSA
      # private key in PKCS#8 PEM, which is what
      # `generate-self-signed-certificate --algorithm ecdsa --pem-filename`
      # writes beside its certificate.
      #
      # It does not prove Apple would accept a real key -- nothing here can.
      # It proves the command line packaging/macos/Makefile runs accepts a key
      # of that shape and writes the three fields the notary client reads, so a
      # typo in that line is a red pull request rather than a red release.
      - name: Rehearse the notarization credential path
        run: |
          d=$(mktemp -d); trap 'rm -rf "$d"' EXIT
          rcodesign generate-self-signed-certificate --algorithm ecdsa \
            --person-name notary-rehearsal --validity-days 1 --pem-filename "$d/k" >/dev/null
          rcodesign encode-app-store-connect-api-key -o "$d/key.json" \
            00000000-0000-0000-0000-000000000000 REHEARSAL0 "$d/k.key" >/dev/null
          for f in issuer_id key_id private_key; do
            grep -q "\"$f\"" "$d/key.json" \
              || { echo "::error::encode-app-store-connect-api-key produced no $f; the notary key this pipeline builds would be rejected before it is sent."; exit 1; }
          done
          echo "ok: issuer_id, key_id and private_key"

      # The notary secrets are handed over ONLY on a push to main, and that is
      # a throughput decision rather than a security one: a submission is an
      # upload plus a wait of a few minutes, and this repository sees several
      # pushes an hour. A same-repo pull request would otherwise notarize every
      # commit and ship none of them. Everything else about the pipeline -- the
      # fuse, the signature, the hardened-runtime guard, the credential
      # rehearsal -- runs on every event, so what main sees first is the round
      # trip to Apple and nothing else.
      #
      # Move this condition to a tag if the submission volume ever matters.
      - name: Package, sign, notarize and staple the universal .app
        id: package
        env:
          MACOS_SIGNING_P12: ${{ secrets.MACOS_SIGNING_P12 }}
          MACOS_SIGNING_P12_PASSWORD: ${{ secrets.MACOS_SIGNING_P12_PASSWORD }}
          APPSTORE_CONNECT_ISSUER_ID: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/main') && secrets.APPSTORE_CONNECT_ISSUER_ID || '' }}
          APPSTORE_CONNECT_KEY_ID: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/main') && secrets.APPSTORE_CONNECT_KEY_ID || '' }}
          APPSTORE_CONNECT_KEY_P8: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/main') && secrets.APPSTORE_CONNECT_KEY_P8 || '' }}
          # The same condition, inverted, so the recipe can say "withheld"
          # rather than "not set" when it was this gate and not the secrets
          # page that left the three empty. Inverted because GitHub's
          # `a && b || c` yields c whenever b is the empty string, so the
          # value has to sit on the true side.
          APPSTORE_CONNECT_WITHHELD: ${{ (github.event_name != 'push' || github.ref != 'refs/heads/main') && 'not-main-push' || '' }}
        run: |
          make -C packaging/macos ARCH=universal ARCHIVE=1 \
            BIN_ARM64=halves/aarch64/squallar \
            BIN_X86_64=halves/x86_64/squallar

          # Read the outcome off the disk rather than off the condition that
          # was supposed to produce it. The Makefile writes exactly one of the
          # two names and a one-word reason, so this step reports what was
          # built -- including a notary failure the make step deliberately did
          # not die on.
          out=packaging/macos/build/universal-apple-darwin
          reason=$(cat "$out/NOTARIZATION" 2>/dev/null || echo unknown)
          # The submission id is written beside the reason (empty when nothing
          # was submitted). It is the one token every follow-up needs --
          # notary-wait, notary-log -- so it goes into the summary, never only
          # into a fold.
          submission=$(cat "$out/NOTARY_SUBMISSION_ID" 2>/dev/null || true)
          printf 'out=%s\n' "$out" >> "$GITHUB_OUTPUT"
          if [ -f "$out/squallar.app.zip" ]; then
            printf 'artifact=macos-universal\nzip=%s/squallar.app.zip\nnotarized=yes\nreason=%s\nsubmission=%s\n' "$out" "$reason" "$submission" >> "$GITHUB_OUTPUT"
          elif [ -f "$out/squallar-PENDING-NOTARIZATION.app.zip" ]; then
            # Apple has the bytes and no ticket is stapled. The name asserts
            # exactly that: signed, submitted, not yet stapled.
            # finish-notarization.yaml completes it with no rebuild.
            printf 'artifact=macos-universal-PENDING-NOTARIZATION\nzip=%s/squallar-PENDING-NOTARIZATION.app.zip\nnotarized=no\nreason=%s\nsubmission=%s\n' "$out" "$reason" "$submission" >> "$GITHUB_OUTPUT"
          elif [ -f "$out/squallar-NOT-NOTARIZED.app.zip" ]; then
            printf 'artifact=macos-universal-NOT-NOTARIZED\nzip=%s/squallar-NOT-NOTARIZED.app.zip\nnotarized=no\nreason=%s\nsubmission=%s\n' "$out" "$reason" "$submission" >> "$GITHUB_OUTPUT"
          else
            # Fatal, and ours: the packaging step reported success and left no
            # zip under any of the three names.
            echo "::error::packaging produced no zip under any name in $out"
            ls -la "$out" || true
            exit 1
          fi

      # The annotation and the run summary, because the Makefile's log is
      # thirty steps deep in a fold and the question a person has -- can I hand
      # this to somebody -- has to be answerable from the run page. `reason`
      # separates "nobody has configured this yet" from "Apple was asked and
      # did not say yes", which are the same artifact and completely different
      # situations.
      - name: Say plainly whether this artifact is notarized
        env:
          NOTARIZED: ${{ steps.package.outputs.notarized }}
          REASON: ${{ steps.package.outputs.reason }}
          ARTIFACT: ${{ steps.package.outputs.artifact }}
          SUBMISSION: ${{ steps.package.outputs.submission }}
        run: |
          # Three ways a finished make step ends without a stapled ticket, and
          # they are three different next steps, so they are three arms and
          # never one: `pending` here means Apple ACCEPTED and the ticket could
          # not be fetched in-run -- the wait itself is unconditional -- and
          # finish-notarization.yaml staples it with no rebuild; `rejected` is
          # a verdict, re-running changes nothing, and the make step has
          # already printed Apple's reasons; `error` is the credentials, the
          # upload or the network, and the make step's Error: line says which.
          # All three are loud and none is fatal: see the note in
          # packaging/macos/Makefile. A make step that never finished is the
          # "cut off" step further down, not this one.
          case "$NOTARIZED:$REASON" in
            yes:stapled)
              echo "::notice::$ARTIFACT carries a stapled notarization ticket (submission $SUBMISSION). Unzip and open; no Gatekeeper prompt, no network needed."
              printf '### macOS: notarized\n\n`%s` went through Apple (submission `%s`) and the ticket is stapled inside the .app.\n' "$ARTIFACT" "$SUBMISSION" >> "$GITHUB_STEP_SUMMARY"
              ;;
            no:pending)
              echo "::warning::$ARTIFACT is PENDING NOTARIZATION: Apple ACCEPTED submission $SUBMISSION, and the ticket could not be stapled in-run (the make step says why). The ticket exists; the bundle is notarized without any rebuild or resubmission by: gh workflow run finish-notarization -f run_id=${{ github.run_id }}"
              printf '### macOS: PENDING NOTARIZATION (accepted, not yet stapled)\n\nApple **accepted** submission `%s`; the ticket could not be fetched and stapled in this run (the "Package, sign, notarize and staple" step says why). `%s` is signed and is the bytes Apple examined; the ticket exists, and stapling alone finishes it, with no rebuild, no resubmission and no secrets:\n\n    gh workflow run finish-notarization -f run_id=%s\n\nThat run publishes the stapled bundle as `macos-universal`. Until then this artifact has no ticket and another Mac will refuse to open it. By hand instead: unzip it, `rcodesign staple squallar.app`, re-zip.\n' "$SUBMISSION" "$ARTIFACT" "${{ github.run_id }}" >> "$GITHUB_STEP_SUMMARY"
              ;;
            no:rejected)
              echo "::error::$ARTIFACT is NOT NOTARIZED: Apple REJECTED submission $SUBMISSION. Re-running will not change it; read the issues above -- the make step prints the notary log verbatim and one issue per line. This artifact must not be published."
              printf '### macOS: NOT NOTARIZED (Apple rejected it)\n\nApple returned a verdict of Invalid on submission `%s`. **Re-running will not change it; read the issues above** -- the "Package, sign, notarize and staple" step prints the notary log verbatim and one issue per line (severity, message, path). `%s` is signed with the Developer ID identity and carries the hardened runtime, but has no ticket, so **another Mac will refuse to open it**. The build was not failed for this on purpose. Do not publish this artifact.\n' "$SUBMISSION" "$ARTIFACT" >> "$GITHUB_STEP_SUMMARY"
              ;;
            no:error)
              if [ -n "$SUBMISSION" ]; then
                queued="Submission \`$SUBMISSION\` was created before the failure; \`rcodesign notary-log $SUBMISSION --api-key-file <key.json>\` prints what Apple has for it."
              else
                queued="No submission was created, so nothing is queued at Apple."
              fi
              echo "::error::$ARTIFACT is NOT NOTARIZED: the submission to Apple did not reach a verdict this recipe knows -- the upload failed, the credentials were refused, or Apple returned an unknown state. The make step has the Error: line (a 401 is the credentials; a 5xx or a connection error is Apple or the network)${SUBMISSION:+; submission $SUBMISSION was created first}. The build was not failed for it -- the cause is outside this repository -- but this artifact must not be published."
              printf '### macOS: NOT NOTARIZED (no verdict)\n\nNeither accepted nor rejected: the "Package, sign, notarize and staple" step has the Error: line. A 401 is the credentials (the three `APPSTORE_CONNECT_*` secrets do not agree, or the key was revoked); a 5xx or a connection error is Apple or the network; an upload that did not complete is a submission Apple will never process. %s `%s` has no ticket, so **another Mac will refuse to open it**. The build was not failed for this on purpose: the cause is outside this repository. Do not publish this artifact.\n' "$queued" "$ARTIFACT" >> "$GITHUB_STEP_SUMMARY"
              ;;
            no:withheld)
              echo "::notice::$ARTIFACT is NOT NOTARIZED: the App Store Connect key is handed over only on a push to main, and this is a ${{ github.event_name }} on ${{ github.ref }}. The secrets may well be configured; nothing was submitted to Apple on this event."
              printf '### macOS: not notarized (credentials withheld)\n\nThe App Store Connect key is passed only on a push to main; this run was never going to use it. `%s` will be refused by any Mac but the one that built it.\n' "$ARTIFACT" >> "$GITHUB_STEP_SUMMARY"
              ;;
            no:partial)
              echo "::warning::$ARTIFACT is NOT NOTARIZED: the App Store Connect key is only partly configured. The make step's log names which of APPSTORE_CONNECT_ISSUER_ID, APPSTORE_CONNECT_KEY_ID and APPSTORE_CONNECT_KEY_P8 is missing."
              printf '### macOS: not notarized (key partly configured)\n\nOne or two of the three `APPSTORE_CONNECT_*` secrets are missing; the make step names which. `%s` will be refused by any Mac but the one that built it.\n' "$ARTIFACT" >> "$GITHUB_STEP_SUMMARY"
              ;;
            no:skipped)
              echo "::notice::$ARTIFACT is NOT NOTARIZED: none of the three APPSTORE_CONNECT_* secrets is set, so nothing was submitted to Apple. packaging/macos/Makefile says what to create."
              printf '### macOS: not notarized (no credentials configured)\n\nNothing was submitted to Apple, so `%s` will be refused by any Mac but the one that built it.\n' "$ARTIFACT" >> "$GITHUB_STEP_SUMMARY"
              ;;
            *)
              echo "::notice::$ARTIFACT is NOT NOTARIZED (reason: $REASON). Nothing was submitted to Apple on this event."
              printf '### macOS: not notarized (%s)\n\nNothing was submitted to Apple on this event, so `%s` will be refused by any Mac but the one that built it.\n' "$REASON" "$ARTIFACT" >> "$GITHUB_STEP_SUMMARY"
              ;;
          esac

      # The artifact's NAME carries the same distinction the file name does. A
      # run that failed to notarize must not publish something a person can
      # mistake for the shippable build a week later, when the log has rolled
      # off and only the artifact list is left.
      #
      # The two one-line files ride beside the zip -- the outcome word and the
      # submission id -- so a PENDING artifact carries the id that
      # finish-notarization.yaml names when the ticket is still not there, and
      # every artifact says which submission it came from.
      - name: Upload the universal build
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.package.outputs.artifact }}
          path: |
            ${{ steps.package.outputs.zip }}
            ${{ steps.package.outputs.out }}/NOTARIZATION
            ${{ steps.package.outputs.out }}/NOTARY_SUBMISSION_ID
          if-no-files-found: error

      # The recovery record, for the one way an accepted submission can still
      # end unstapled now that the wait is unconditional: this job cut off
      # while waiting -- GitHub's 360-minute job bound, which is GitHub's and
      # not ours, or a lost runner (in which case nothing here runs either,
      # and `rcodesign notary-list` is how a person finds the id). The
      # Makefile writes the PENDING zip and the id the moment the upload to
      # Apple completes, before it starts waiting, so a cut-off job still
      # leaves the bytes Apple is examining and the id to finish them.
      # `always()` is what lets this run after a cancellation.
      - name: Publish the pending bundle if this job was cut off
        id: pending
        if: always() && steps.package.outcome != 'success'
        run: |
          out=packaging/macos/build/universal-apple-darwin
          if [ -f "$out/squallar-PENDING-NOTARIZATION.app.zip" ] \
              && [ ! -f "$out/squallar.app.zip" ] && [ ! -f "$out/squallar-NOT-NOTARIZED.app.zip" ]; then
            id=$(cat "$out/NOTARY_SUBMISSION_ID" 2>/dev/null || true)
            printf 'publish=yes\nout=%s\n' "$out" >> "$GITHUB_OUTPUT"
            echo "::warning::macos-universal-PENDING-NOTARIZATION: this job did not finish the notarize stage -- cut off while waiting on Apple (the job bound or a lost runner), or failed after the upload -- not Apple being slow and not a verdict. Submission $id is queued; the signed bundle is published under the pending name and is finished with no rebuild by: gh workflow run finish-notarization -f run_id=${{ github.run_id }}"
            printf '### macOS: PENDING NOTARIZATION (job cut off)\n\nThis job did not finish the notarize stage: it was cut off while waiting on Apple (the 360-minute job bound, or a lost runner), or failed after the upload. **Not Apple being slow, not a verdict.** Submission `%s` is queued on the Apple side, and the signed bundle Apple is examining is published as `macos-universal-PENDING-NOTARIZATION`. Once Apple accepts, stapling alone finishes it, with no rebuild, no resubmission and no secrets:\n\n    gh workflow run finish-notarization -f run_id=%s\n\nThat run publishes the stapled bundle as `macos-universal`; if the ticket is not there yet it says so and is re-run later.\n' "$id" "${{ github.run_id }}" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "publish=no" >> "$GITHUB_OUTPUT"
            echo "no pending bundle on disk (the make step did not get as far as the upload to Apple, or it finished); nothing to publish here."
          fi

      - name: Upload the pending bundle
        if: always() && steps.pending.outputs.publish == 'yes'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: macos-universal-PENDING-NOTARIZATION
          path: |
            ${{ steps.pending.outputs.out }}/squallar-PENDING-NOTARIZATION.app.zip
            ${{ steps.pending.outputs.out }}/NOTARIZATION
            ${{ steps.pending.outputs.out }}/NOTARY_SUBMISSION_ID
          if-no-files-found: error

  # TestFlight, from Linux, with no Mac anywhere in the pipeline.
  #
  # That is worth a paragraph because the usual answer is that it cannot be
  # done. `xcrun altool` and `notarytool` live inside Xcode and are macOS-only.
  # Apple's Transporter does ship a Red Hat build, but on Linux it refuses the
  # job itself: "Unable to perform software analysis on Linux. Export an
  # AppStoreInfo.plist from Xcode, and use the -assetDescription option" -- an
  # input whose only documented source is a Mac. fastlane's `pilot` drives that
  # same Transporter and inherits the same wall.
  #
  # None of that is on this path. App Store Connect API 4.1 added the
  # `buildUploads` and `buildUploadFiles` resources -- "You can now use Build
  # uploads to upload and manage build uploads for your apps" -- and the WWDC25
  # session introducing them states the intent directly: "you can upload your
  # build using any language or platform you prefer." It is a REST flow with a
  # bearer token: reserve, PUT the bytes, commit, poll. HTTPS and an ECDSA
  # signature, and no Apple software at all.
  #
  # NOT in the rust-cross container: nothing here compiles. `python3` and
  # `openssl` are on the runner image, which is the whole dependency list for
  # .github/scripts/appstore-upload.py, so this job skips a 15 GB image pull.
  ios-testflight:
    name: ios-testflight
    runs-on: ubuntu-24.04
    needs: [build]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Asserted rather than discovered three steps later as a bare "command
      # not found" out of a Python traceback.
      - name: Assert the runner has the tools this job does not install
        run: |
          for t in python3 openssl; do
            command -v "$t" >/dev/null \
              || { echo "::error::$t is not on the ubuntu-24.04 runner image; this job assumed it was."; exit 1; }
          done

      # Only the SIGNED artifact is named `ios-aarch64`; an unsigned run
      # publishes `ios-aarch64-UNSIGNED` instead and this download finds
      # nothing. `continue-on-error` turns that into a fact the next steps can
      # read rather than a red job, because "there was nothing uploadable" is
      # the correct and expected outcome on a fork pull request.
      - name: Download the signed iOS build
        id: fetch
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ios-aarch64
          path: ipa

      # A rehearsal of the App Store Connect credential path that needs no
      # Apple account, so it runs on every event including a fork pull request.
      #
      # The ES256 token is the piece most likely to be got wrong and the only
      # part of the upload that can be exercised with no server on the other
      # end: three values off three different pages, a key format that arrives
      # two different ways, and a signature that openssl emits as DER while
      # JOSE requires raw r||s. The rehearsal mints a throwaway P-256 key,
      # builds a token with it, and has OPENSSL verify the signature -- so the
      # conversion is checked by something that is not the code under test.
      #
      # It cannot prove Apple would accept a real key; nothing here can. It
      # proves a typo in that path is a red pull request rather than a release
      # that dies after the bytes are already uploaded.
      - name: Rehearse the App Store Connect credential path
        run: |
          ipa=$(ls ipa/*.ipa 2>/dev/null | head -1 || true)
          if [ -n "$ipa" ]; then
            python3 .github/scripts/appstore-upload.py --rehearse --ipa "$ipa"
          else
            python3 .github/scripts/appstore-upload.py --rehearse
            echo "note: no signed .ipa on this event, so the version fields were not read."
          fi

      # The credentials are handed over ONLY on a push to main, for the same
      # throughput reason the macOS notary secrets are: an upload is a transfer
      # plus a wait, this repository sees several pushes an hour, and every
      # build sharing one CFBundleVersion would be rejected as a duplicate
      # anyway. Everything else -- the build, the signature, the entitlement
      # guards, the rehearsal -- runs on every event.
      - name: Upload to TestFlight
        id: upload
        if: steps.fetch.outcome == 'success'
        env:
          APPSTORE_CONNECT_ISSUER_ID: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/main') && secrets.APPSTORE_CONNECT_ISSUER_ID || '' }}
          APPSTORE_CONNECT_KEY_ID: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/main') && secrets.APPSTORE_CONNECT_KEY_ID || '' }}
          APPSTORE_CONNECT_KEY_P8: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/main') && secrets.APPSTORE_CONNECT_KEY_P8 || '' }}
          # Inverted, for the reason given at the macos-universal job: the
          # value has to sit on the true side of GitHub's `&& ||`.
          APPSTORE_CONNECT_WITHHELD: ${{ (github.event_name != 'push' || github.ref != 'refs/heads/main') && 'not-main-push' || '' }}
        run: |
          # Three reasons the key can be absent, and "not set" was the right
          # wording for one of them. The marker is read first, so a key the
          # gate withheld is never reported as unconfigured; then the three
          # names are checked one by one, so one missing name is reported as
          # one, by name and never by value.
          if [ "${APPSTORE_CONNECT_WITHHELD:-}" = not-main-push ]; then
            echo "state=withheld" >> "$GITHUB_OUTPUT"
            echo "NOTE: upload credentials withheld: this is a $GITHUB_EVENT_NAME on $GITHUB_REF, and they are passed only on a push to main. The secrets may well be configured; this run was never going to use them."
            exit 0
          fi
          facts=""; present=""
          for n in APPSTORE_CONNECT_ISSUER_ID APPSTORE_CONNECT_KEY_ID APPSTORE_CONNECT_KEY_P8; do
            if [ -n "${!n:-}" ]; then facts="$facts; $n: set"; present=1; else facts="$facts; $n: missing"; fi
          done
          if [ -z "$present" ]; then
            echo "state=no-credentials" >> "$GITHUB_OUTPUT"
            echo "NOTE: none of the three APPSTORE_CONNECT_* secrets is set, so nothing was sent to Apple. packaging/ios/Makefile says what to create."
            exit 0
          fi
          case "$facts" in *missing*)
            echo "state=partial-credentials" >> "$GITHUB_OUTPUT"
            echo "::warning::the App Store Connect key is only partly configured, so nothing was sent to Apple: ${facts#; }"
            exit 0 ;;
          esac
          ipa=$(ls ipa/*.ipa | head -1)
          # Deliberately not fatal, and for the same reason the macOS notary
          # submission is not: an App Store Connect outage, an expired key or a
          # duplicate build number is not evidence about the commit that
          # happened to be pushed when it occurred, and `build-success` gates
          # the website. What a failure produces instead is `state=failed`, an
          # ::error:: annotation and a run-summary section.
          if python3 .github/scripts/appstore-upload.py --ipa "$ipa"; then
            echo "state=uploaded" >> "$GITHUB_OUTPUT"
          else
            echo "state=failed" >> "$GITHUB_OUTPUT"
          fi

      # The question a person has -- is there a build in TestFlight -- has to be
      # answerable from the run page, not from thirty steps inside a fold.
      - name: Say plainly whether a build reached TestFlight
        env:
          FETCHED: ${{ steps.fetch.outcome }}
          STATE: ${{ steps.upload.outputs.state }}
        run: |
          case "$FETCHED:$STATE" in
            success:uploaded)
              echo "::notice::the signed .ipa was accepted by App Store Connect. It appears in TestFlight once Apple finishes processing it."
              printf '### iOS: uploaded to App Store Connect\n\nThe signed build was accepted. TestFlight shows it once processing finishes.\n' >> "$GITHUB_STEP_SUMMARY"
              ;;
            success:failed)
              echo "::error::the signed .ipa was NOT accepted by App Store Connect. The build was not failed for it -- an outage, an expired key or a duplicate CFBundleVersion is not evidence about this commit -- but no new build reached TestFlight. Read the upload step's log for Apple's reason."
              printf '### iOS: NOT uploaded (App Store Connect refused it)\n\nThe .ipa is signed and uploadable, but Apple did not accept it. No new TestFlight build exists for this commit.\n' >> "$GITHUB_STEP_SUMMARY"
              ;;
            success:withheld)
              echo "::notice::a signed, uploadable .ipa was built. The App Store Connect key is handed over only on a push to main, and this is a ${{ github.event_name }} on ${{ github.ref }}; the secrets may well be configured. Nothing was sent to Apple on this event."
              printf '### iOS: signed, not uploaded (credentials withheld)\n\nA distribution-signed `.ipa` exists for this commit. The key is passed only on a push to main; this run was never going to use it.\n' >> "$GITHUB_STEP_SUMMARY"
              ;;
            success:partial-credentials)
              echo "::warning::a signed, uploadable .ipa was built, and the App Store Connect key is only partly configured. The upload step's log names which of APPSTORE_CONNECT_ISSUER_ID, APPSTORE_CONNECT_KEY_ID and APPSTORE_CONNECT_KEY_P8 is missing."
              printf '### iOS: signed, not uploaded (key partly configured)\n\nA distribution-signed `.ipa` exists for this commit. One or two of the three `APPSTORE_CONNECT_*` secrets are missing; the upload step names which.\n' >> "$GITHUB_STEP_SUMMARY"
              ;;
            success:no-credentials)
              echo "::notice::a signed, uploadable .ipa was built. None of the three APPSTORE_CONNECT_* secrets is set, so nothing was sent to Apple; packaging/ios/Makefile says what to create."
              printf '### iOS: signed, not uploaded (no credentials configured)\n\nA distribution-signed `.ipa` exists for this commit. Nothing was sent to Apple.\n' >> "$GITHUB_STEP_SUMMARY"
              ;;
            success:*)
              echo "::notice::a signed, uploadable .ipa was built. Nothing was sent to Apple on this event (state: ${STATE:-none})."
              printf '### iOS: signed, not uploaded\n\nA distribution-signed `.ipa` exists for this commit. Nothing was sent to Apple on this event.\n' >> "$GITHUB_STEP_SUMMARY"
              ;;
            *)
              echo "::notice::no signed .ipa was produced on this event, so there was nothing to upload. Expected for a fork pull request, and for a repository whose IOS_SIGNING_P12 / IOS_PROVISIONING_PROFILE secrets are not set yet."
              printf '### iOS: nothing uploadable\n\nThis event produced `ios-aarch64-UNSIGNED`, which installs nowhere and uploads nowhere.\n' >> "$GITHUB_STEP_SUMMARY"
              ;;
          esac

  # The second macOS product. `macos-universal` builds the notarized download;
  # this builds the sandboxed .pkg that App Store Connect takes for TestFlight.
  # They share a Makefile and nothing else: different binaries (this one is
  # --no-default-features), different certificates, different entitlements,
  # different wrapper.
  #
  # NOT in `build-success`, for the reason `macos-universal` and
  # `ios-testflight` are not: this job talks to Apple on Apple's clock, a job
  # in that list gates `deploy-cloudfront` by duration as well as by result,
  # and the ruling is that the web deploy never waits on Apple.
  macos-store:
    name: macos-store
    runs-on: ubuntu-24.04
    needs: [build]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Assert the runner has the tools this job does not install
        run: |
          for t in make curl tar cpio gzip python3 openssl g++ autoconf; do
            command -v "$t" >/dev/null \
              || { echo "::error::$t is not on the ubuntu-24.04 runner image; this job assumed it was."; exit 1; }
          done

      # Same tool, same pin, same reasoning as `macos-universal`.
      - name: Install the signer
        run: |
          v="$SIGNTOOL_VERSION"
          base=apple-codesign-$v-x86_64-unknown-linux-musl
          curl -fsSL -o "$RUNNER_TEMP/rcodesign.tar.gz" \
            "https://github.com/indygreg/apple-platform-rs/releases/download/apple-codesign%2F$v/$base.tar.gz"
          echo "$SIGNTOOL_SHA256  $RUNNER_TEMP/rcodesign.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/rcodesign.tar.gz" -C "$RUNNER_TEMP"
          mkdir -p "$RUNNER_TEMP/bin"
          install -m 0755 "$RUNNER_TEMP/$base/rcodesign" "$RUNNER_TEMP/bin/rcodesign"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      # `productbuild` is inside Xcode and macOS-only, so a flat package is
      # assembled here from portable parts instead. Neither tool is packaged by
      # Debian or Ubuntu -- measured, `apt-cache policy xar` is empty -- so both
      # are built from source, pinned by commit rather than by tag because
      # neither repository publishes releases and a moving `master` is a
      # different tool on a different day.
      #
      # xar's configure probes libcrypto for `OpenSSL_add_all_ciphers`, which
      # OpenSSL 3 turned into a macro. The probe compiles a program that takes
      # its address, that no longer links, and configure concludes there is no
      # libcrypto at all -- "Cannot build without libcrypto (OpenSSL)" on a
      # machine that has it. The cache variable skips the probe; the source
      # then compiles against the header macro and links normally.
      - name: Build the package tools (xar, mkbom)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            libxml2-dev libssl-dev zlib1g-dev libbz2-dev git

          git clone -q https://github.com/mackyle/xar "$RUNNER_TEMP/xar"
          git -C "$RUNNER_TEMP/xar" checkout -q "$XAR_COMMIT"
          cd "$RUNNER_TEMP/xar/xar"
          autoreconf -fi >/dev/null 2>&1
          ./configure --prefix="$RUNNER_TEMP/pkgtools" \
            ac_cv_lib_crypto_OpenSSL_add_all_ciphers=yes >/dev/null
          make -j"$(nproc)" >/dev/null && make install >/dev/null

          git clone -q https://github.com/hogliux/bomutils "$RUNNER_TEMP/bomutils"
          git -C "$RUNNER_TEMP/bomutils" checkout -q "$BOMUTILS_COMMIT"
          make -C "$RUNNER_TEMP/bomutils" -j"$(nproc)" >/dev/null
          install -m 0755 "$RUNNER_TEMP/bomutils/build/bin/mkbom" "$RUNNER_TEMP/bin/mkbom"
          echo "$RUNNER_TEMP/pkgtools/bin" >> "$GITHUB_PATH"

          # Asserted here, where the cause is one step away, rather than inside
          # mkpkg.sh where it would read as a packaging failure.
          "$RUNNER_TEMP/pkgtools/bin/xar" --version
          "$RUNNER_TEMP/bin/mkbom" -h >/dev/null 2>&1 || true

      - name: Download the arm64 half
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: macos-bin-aarch64-store
          path: halves/aarch64
      - name: Download the x86_64 half
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: macos-bin-x86_64-store
          path: halves/x86_64

      - name: Package and sign the store .pkg
        id: package
        env:
          MACOS_STORE_P12: ${{ secrets.MACOS_STORE_P12 }}
          MACOS_STORE_P12_PASSWORD: ${{ secrets.MACOS_STORE_P12_PASSWORD }}
          MACOS_INSTALLER_P12: ${{ secrets.MACOS_INSTALLER_P12 }}
          MACOS_INSTALLER_P12_PASSWORD: ${{ secrets.MACOS_INSTALLER_P12_PASSWORD }}
          MACOS_STORE_PROFILE: ${{ secrets.MACOS_STORE_PROFILE }}
        run: |
          make -C packaging/macos CHANNEL=store ARCH=universal \
            BIN_ARM64=halves/aarch64/squallar \
            BIN_X86_64=halves/x86_64/squallar

          # Read the outcome off the disk rather than off the condition that
          # was supposed to produce it. The Makefile writes exactly one of the
          # two names, and which one it wrote is the whole answer.
          out=packaging/macos/build/universal-apple-darwin
          printf 'out=%s\n' "$out" >> "$GITHUB_OUTPUT"
          if [ -f "$out/squallar.pkg" ]; then
            printf 'artifact=macos-store\npkg=%s/squallar.pkg\nuploadable=yes\n' "$out" >> "$GITHUB_OUTPUT"
          elif [ -f "$out/squallar-NOT-UPLOADABLE.pkg" ]; then
            printf 'artifact=macos-store-NOT-UPLOADABLE\npkg=%s/squallar-NOT-UPLOADABLE.pkg\nuploadable=no\n' "$out" >> "$GITHUB_OUTPUT"
          else
            echo "::error::the store channel produced neither squallar.pkg nor squallar-NOT-UPLOADABLE.pkg. That is a packaging failure, not a credentials one."
            exit 1
          fi

      - name: Upload the store package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.package.outputs.artifact }}
          path: ${{ steps.package.outputs.pkg }}
          if-no-files-found: error

      # Same gate and same wording as the iOS arm: credentials only on a push
      # to main, and a marker so a withheld key is never reported as an
      # unconfigured one.
      - name: Upload to TestFlight
        id: upload
        if: steps.package.outputs.uploadable == 'yes'
        env:
          APPSTORE_CONNECT_ISSUER_ID: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/main') && secrets.APPSTORE_CONNECT_ISSUER_ID || '' }}
          APPSTORE_CONNECT_KEY_ID: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/main') && secrets.APPSTORE_CONNECT_KEY_ID || '' }}
          APPSTORE_CONNECT_KEY_P8: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/main') && secrets.APPSTORE_CONNECT_KEY_P8 || '' }}
          APPSTORE_CONNECT_WITHHELD: ${{ (github.event_name != 'push' || github.ref != 'refs/heads/main') && 'not-main-push' || '' }}
          PKG: ${{ steps.package.outputs.pkg }}
        run: |
          if [ "${APPSTORE_CONNECT_WITHHELD:-}" = not-main-push ]; then
            echo "state=withheld" >> "$GITHUB_OUTPUT"
            echo "NOTE: upload credentials withheld: this is a $GITHUB_EVENT_NAME on $GITHUB_REF, and they are passed only on a push to main. The secrets may well be configured; this run was never going to use them."
            exit 0
          fi
          facts=""; present=""
          for n in APPSTORE_CONNECT_ISSUER_ID APPSTORE_CONNECT_KEY_ID APPSTORE_CONNECT_KEY_P8; do
            if [ -n "${!n:-}" ]; then facts="$facts; $n: set"; present=1; else facts="$facts; $n: missing"; fi
          done
          if [ -z "$present" ]; then
            echo "state=no-credentials" >> "$GITHUB_OUTPUT"
            echo "NOTE: none of the three APPSTORE_CONNECT_* secrets is set, so nothing was sent to Apple. packaging/macos/Makefile says what to create."
            exit 0
          fi
          case "$facts" in *missing*)
            echo "state=partial-credentials" >> "$GITHUB_OUTPUT"
            echo "::warning::the App Store Connect key is only partly configured, so nothing was sent to Apple: ${facts#; }"
            exit 0 ;;
          esac
          # Not fatal, for the reason the iOS upload and the notary submission
          # are not: an outage, an expired key or a duplicate build number is
          # not evidence about the commit that happened to be pushed when it
          # occurred.
          if python3 .github/scripts/appstore-upload.py --platform MAC_OS --pkg "$PKG"; then
            echo "state=uploaded" >> "$GITHUB_OUTPUT"
          else
            echo "state=failed" >> "$GITHUB_OUTPUT"
          fi

      - name: Say plainly whether a Mac build reached TestFlight
        env:
          UPLOADABLE: ${{ steps.package.outputs.uploadable }}
          STATE: ${{ steps.upload.outputs.state }}
        run: |
          case "$UPLOADABLE:$STATE" in
            yes:uploaded)
              echo "::notice::the signed .pkg was accepted by App Store Connect. It appears in TestFlight once Apple finishes processing it."
              printf '### macOS: uploaded to App Store Connect\n\nThe sandboxed, store-signed package was accepted. TestFlight shows it once processing finishes.\n' >> "$GITHUB_STEP_SUMMARY"
              ;;
            yes:failed)
              echo "::error::the signed .pkg was NOT accepted by App Store Connect. The build was not failed for it, but no new Mac build reached TestFlight. Read the upload step's log for Apple's reason."
              printf '### macOS: NOT uploaded (App Store Connect refused it)\n\nThe `.pkg` is signed and uploadable, but Apple did not accept it.\n' >> "$GITHUB_STEP_SUMMARY"
              ;;
            yes:withheld)
              echo "::notice::a signed, uploadable .pkg was built. The App Store Connect key is handed over only on a push to main, and this is a ${{ github.event_name }} on ${{ github.ref }}. Nothing was sent to Apple on this event."
              printf '### macOS: signed, not uploaded (credentials withheld)\n\nAn uploadable `.pkg` exists for this commit. The key is passed only on a push to main.\n' >> "$GITHUB_STEP_SUMMARY"
              ;;
            yes:*)
              echo "::notice::a signed, uploadable .pkg was built. Nothing was sent to Apple on this event (state: ${STATE:-none})."
              printf '### macOS: signed, not uploaded\n\nAn uploadable `.pkg` exists for this commit.\n' >> "$GITHUB_STEP_SUMMARY"
              ;;
            *)
              echo "::notice::a .pkg was built and it is NOT uploadable. The package step's log names which of the three conditions failed: store signature, embedded provisioning profile, installer signature. Expected until MACOS_STORE_P12, MACOS_INSTALLER_P12 and MACOS_STORE_PROFILE are set."
              printf '### macOS: package built, not uploadable\n\nThe artifact is named `macos-store-NOT-UPLOADABLE`. App Store Connect would refuse it; the package step says why.\n' >> "$GITHUB_STEP_SUMMARY"
              ;;
          esac

  # The one required status check. `needs` on a matrix job aggregates every row,
  # and with `fail-fast: false` it is `success` only if all of them were --
  # `failure`, `cancelled` and `skipped` all fall through to the error. The
  # packaging job is named separately for the same reason: it is `skipped` when
  # a macOS row is red, and a skipped job that nobody checks is a shipped
  # artifact that was never built.
  #
  # `macos-universal` is in here, and an Apple notary outage still does not
  # redden it. Those two facts are compatible because the job draws the line
  # inside itself: the fuse, the signature, the hardened-runtime count and the
  # ticket-actually-stapled check are fatal, because each is a statement about
  # OUR code and a regression in one is a defect. The submission to Apple is
  # not, because a failure there is an outage, an expired credential or a rate
  # limit -- none of it evidence about the commit that happened to be pushed
  # when it occurred, and none of it fixed by anyone reading that commit.
  #
  # That matters beyond this job: `deploy-cloudfront` needs this check, so a
  # fatal notary failure would hold the website for a reason that has no
  # relationship to the website. What a failed submission produces instead is
  # an artifact named `macos-universal-NOT-NOTARIZED`, an `::error::`
  # annotation and a run-summary section -- loud enough that the degraded path
  # cannot quietly become the normal one, which is the actual risk of not
  # failing.
  # `needs: [build]` and nothing else -- NOT `macos-universal`, NOT
  # `ios-testflight`. Both of those talk to Apple on Apple's clock: the notary
  # stage waits for Apple's verdict unconditionally (only GitHub's own job
  # timeout bounds it) and the App Store upload polls App Store Connect. A job in this list gates `deploy-cloudfront` by
  # *duration* as well as by result, so an earlier design that made the Apple
  # submissions non-fatal still held the website behind a 15-minute wait -- it
  # fixed failure coupling and left latency coupling untouched. The user's
  # ruling (2026-09-06): the web deploy never depends on those jobs. They still
  # run, still go red on their own when the packaging or signing is broken,
  # and still name their artifacts honestly; they just gate nothing here.
  build-success:
    name: Build success check
    if: always()
    runs-on: ubuntu-24.04
    needs: [build]
    steps:
      - name: Fail unless every build row succeeded
        shell: bash
        env:
          RESULT: ${{ needs.build.result }}
        run: |
          echo "build matrix: $RESULT"
          test "$RESULT" = success || { echo "::error::the build matrix concluded '$RESULT'."; exit 1; }

  # The production web deploy: S3 behind CloudFront at https://squallar.app/.
  #
  # `push` to `main` only: `id-token: write` mints an OIDC token that assumes an
  # AWS role with write access to the live site, and `pull_request` runs for
  # forks.
  #
  # Nothing is rebuilt here. `web-wasm32` staged and gated `dist/`; this job
  # downloads exactly those bytes. A failed build is the whole gate; a red test
  # or lint does not stop shipping.
  #
  # The distribution's response-headers policy -- not this workflow, and not any
  # per-object metadata -- is what sends `Cross-Origin-Opener-Policy`,
  # `Cross-Origin-Embedder-Policy` and `Cache-Control`. `aws s3 sync` writes no
  # `Cache-Control` of its own, so the policy is unopposed. COOP/COEP are load
  # bearing: without them `SharedArrayBuffer` is unavailable and the worker wire
  # does not come up.
  deploy-cloudfront:
    name: Deploy web build to CloudFront
    # NOT ON A BOT'S OWN COMMIT, and this clause is load bearing.
    #
    # Clippy's autofix pushes as the Squallar-autocommit app, because `main`'s
    # ruleset refuses GITHUB_TOKEN. Unlike GITHUB_TOKEN, an app push TRIGGERS
    # workflows -- so without this the sequence is: bot rewrites source, bot
    # pushes, that push starts a Build, and that Build deploys. Production
    # changes with no human in the loop, on a tree no human read.
    #
    # That was tolerable while three "verify the autofixed tree still builds"
    # rows gated the push; they were removed by decision on 2026-08-31, so this
    # is what replaces them. The autofix still lands, still gets compiled by
    # this run's matrix and still gets linted -- it just does not ship itself.
    # The next human push carries it out.
    #
    # Matched on author email rather than name: `git-auto-commit-action` sets
    # both, and the address is the identity `renovate.json` keys off too.
    if: >-
      github.event_name == 'push' && github.ref == 'refs/heads/main'
      && github.event.head_commit.author.email != '323064949+squallar-autocommit[bot]@users.noreply.github.com'
      && github.event.head_commit.author.email != '41898282+github-actions[bot]@users.noreply.github.com'
    needs: [build-success]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      # Required by aws-actions/configure-aws-credentials to mint the OIDC token.
      id-token: write
    # Not the workflow-level group, which cancels in progress. A cancelled sync
    # leaves the bucket holding half of two deploys; queue instead.
    concurrency:
      group: cloudfront
      cancel-in-progress: false
    steps:
      - name: Download the staged web build
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: web-dist
          path: dist

      # `s3 sync --delete` against an empty local tree would empty the bucket,
      # and a download that silently produced nothing is exactly how that
      # happens. Check before the credentials exist, not after.
      - name: Refuse to sync an empty tree
        run: |
          test -f dist/index.html || { echo "::error::dist/index.html is missing; the artifact did not unpack"; exit 1; }
          test -f dist/pkg/squallar_web_bg.wasm || { echo "::error::dist/pkg/squallar_web_bg.wasm is missing; the artifact is not a web build"; exit 1; }
          n=$(find dist -type f | wc -l)
          test "$n" -ge 8 || { echo "::error::dist holds $n file(s); the shell alone is ten"; exit 1; }
          echo "ok: $n file(s) staged"
          find dist -type f | sort | sed 's/^/  /'

      # THE SQUALLAR STACK, CUT OVER 2026-08-30. These literals are one set
      # that moved together -- role, bucket, distribution -- and a fifth moved
      # with them: squallar::platform::ZONE_PACK_URL, where native builds
      # download the zones.pack this job stages. The values come from
      # `terraform output` in ../terraform/infra/squallar and go stale only if
      # that stack is rebuilt. The old rustdar stack now serves a static
      # tombstone and has no deploy role at all.
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@cbe3b392738ccf3f987d68400dafcf4b0624a56c # v6.2.4
        with:
          role-to-assume: arn:aws:iam::803205869942:role/github-actions-squallar
          aws-region: us-east-1

      # No second pass to fix up `Content-Type`. The AWS CLI takes it from
      # Python's `mimetypes`, whose *built-in* table -- not `/etc/mime.types`,
      # which the runner may or may not carry -- has mapped `.wasm` to
      # `application/wasm` since CPython 3.8, and `.webmanifest` to
      # `application/manifest+json` for as long. Verified against the 3.8, 3.10,
      # 3.11, 3.12 and 3.13 stdlib sources; the CLI bundles its own interpreter,
      # so the runner's `python3` is irrelevant.
      #
      # One extension is deliberately NOT in that table: `.pack`. `mimetypes`
      # returns nothing for it, the CLI sends no `Content-Type`, and S3 stores it
      # as `binary/octet-stream` -- which is right. `zone_pack_source::read_url`
      # takes the response as raw `bytes()` and parses a magic number, so nothing
      # sniffs the header, and inventing a media type here would be a string this
      # tree has to keep in step with nothing. Every other extension staged is
      # covered, so `sync` alone is still correct.
      #
      # `--delete` prunes what a previous deploy left. It never deletes a file
      # the new deploy replaces: `squallar_web.js` and `squallar_web_bg.wasm` keep
      # their names across builds, so those are overwrites, not delete-then-add.
      - name: Sync to S3
        run: aws s3 sync --delete dist/ s3://squallar-app-origin/

      # Whole-distribution, not a path list. The shell's filenames are stable,
      # so a targeted invalidation would have to name every one of them, and
      # missing one serves a mixed shell. AWS gives 1000 free invalidation paths
      # a month and `/*` counts as one.
      - name: Invalidate the CloudFront cache
        run: aws cloudfront create-invalidation --distribution-id E3S5Y0QOVJFRNZ --paths "/*"

      # NOTHING ELSE CATCHES A MISSING HEADERS POLICY. The Tier-2 rig supplies
      # COOP/COEP itself (`serve.py`), so it stays green against an origin that
      # sends neither -- and without them `crossOriginIsolated` is false, rayon
      # collapses to one thread and the worker wire never comes up, silently.
      # So the deploy is not done until the real origin is seen sending both.
      #
      # Retried because an invalidation is not instantaneous: the first request
      # after one can race the edge. Ten tries over ~100 s is far past any
      # observed settling time; a failure after that is a real missing policy.
      - name: Verify the isolation headers on the live origin
        run: |
          for i in $(seq 1 10); do
            headers=$(curl -sSI --max-time 15 https://squallar.app/ || true)
            coop=$(printf '%s' "$headers" | grep -ci '^cross-origin-opener-policy: same-origin' || true)
            coep=$(printf '%s' "$headers" | grep -ci '^cross-origin-embedder-policy: require-corp' || true)
            if [ "$coop" -ge 1 ] && [ "$coep" -ge 1 ]; then
              echo "ok: both isolation headers present (attempt $i)"
              exit 0
            fi
            echo "attempt $i: COOP=$coop COEP=$coep; waiting"
            sleep 10
          done
          echo "::error::https://squallar.app/ is not sending COOP+COEP; the app will boot single-threaded"
          exit 1

  # rustdar.mcswain.dev was retired on 2026-08-31 and the job that did it is
  # gone. `.github/cloudfront-tombstone/` published a redirect page and a
  # service worker at /sw.js -- the path the app's own worker lived at -- which
  # unregisters installed clients and sends them to squallar.app. Verified
  # serving: the page is 3,004 bytes of "Squallar has moved", /sw.js carries the
  # unregistering worker, and the old shell and zones.pack are 404 gone.
  #
  # The job and the IAM role it assumed were both removed rather than left
  # idle: the tombstone is permanent and never needs republishing, and a role
  # with write access to a live origin that nothing uses is a standing risk.
  # Recover both from git history if that origin ever has to change.

  # The marketing site at squallar.com. Nothing is built: `www/` is hand-written
  # HTML, one stylesheet and the screenshots, so this job stages a directory and
  # syncs it. It does not depend on `build-success` -- a Rust test failure has no
  # bearing on whether a static page is publishable, and coupling them would mean
  # a red radar test blocks a typo fix on a landing page.
  #
  # The bucket, distribution and role are applied and verified: squallar.com
  # answers on a valid certificate, its apex CNAME is flattened by Cloudflare to
  # the distribution, and it correctly does NOT carry the isolation headers the
  # app's origin sends. The deploy role trusts this repository during the org
  # move, so this runs before the rename as well as after.
  deploy-www:
    name: Deploy marketing site to CloudFront
    # HELD BACK, DELIBERATELY (2026-08-30): the site content is not ready to be
    # public, and the app's move to squallar.app does not wait for it. `false &&`
    # rather than deleting the job, so un-holding it is a one-word change and
    # everything below stays reviewed and current. The squallar.com bucket and
    # distribution stay applied and empty meanwhile.
    if: false && github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    concurrency:
      group: cloudfront-www
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Same reasoning as the app's guard: `s3 sync --delete` against a tree that
      # is missing would empty the bucket rather than fail, so prove the tree is
      # there before credentials exist.
      - name: Refuse to sync an empty tree
        run: |
          test -f www/index.html || { echo "::error::www/index.html is missing"; exit 1; }
          test -f www/style.css  || { echo "::error::www/style.css is missing"; exit 1; }
          n=$(find www -type f | wc -l)
          test "$n" -ge 2 || { echo "::error::www holds $n file(s)"; exit 1; }
          echo "ok: $n file(s)"
          find www -type f | sort | sed 's/^/  /'

      # The page references screenshots by name, and a missing one is a broken
      # image or a dead video on the landing page.
      #
      # THIS FAILS THE BUILD, and it used to warn. A warning is invisible on a
      # green run, which is exactly the wrong shape for "the marketing site is
      # publicly broken". It also matched only `.png` while the page has never
      # referenced a single one: every shot is `.webp` and every loop is
      # `.mp4`, so the check had nothing to say no matter what was missing.
      - name: Refuse to publish a page referencing assets the tree lacks
        run: |
          missing=0
          checked=0
          for ref in $(grep -oE 'screenshots/[A-Za-z0-9._-]+\.(png|webp|mp4|jpg|svg)' www/index.html | sort -u); do
            checked=$((checked + 1))
            if [ ! -f "www/$ref" ]; then
              echo "::error::www/index.html references $ref, which is not in the tree"
              missing=$((missing + 1))
            fi
          done
          # A zero-reference answer means the pattern stopped matching, not that
          # the page is clean -- the failure mode this check just came out of.
          test "$checked" -ge 1 || { echo "::error::no screenshot references found; the check is broken"; exit 1; }
          echo "checked $checked referenced asset(s)"
          test "$missing" -eq 0 || exit 1

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@cbe3b392738ccf3f987d68400dafcf4b0624a56c # v6.2.4
        with:
          role-to-assume: arn:aws:iam::803205869942:role/github-actions-squallar
          aws-region: us-east-1

      # `--delete`, so a screenshot dropped from the tree leaves the bucket too.
      # Content types come from the extension; `.mp4` and `.webp` are both known
      # to the CLI's table, and a video served as `application/octet-stream`
      # would download instead of play.
      - name: Sync to S3
        run: aws s3 sync --delete www/ s3://squallar-com-origin/

      # Same whole-distribution reasoning as the app: nothing here is
      # content-hashed either, so a targeted list would have to name every file.
      # `terraform output www_distribution_id` in infra/squallar is where this
      # came from and where it goes to be checked.
      - name: Invalidate the CloudFront cache
        run: aws cloudfront create-invalidation --distribution-id E1D9T0MUVYI8FD --paths "/*"
