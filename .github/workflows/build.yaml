name: Build

# Almost every platform-specific file here is behind a `#[cfg]`, so
# `cargo build --workspace` on Linux compiles none of the Android bridges, the
# wasm entry point or the iOS arms. The unit of coverage is the target triple.
# Everything feeds `build-success`, the one required check.

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: '${{ github.workflow }} @ ${{ github.ref }}'
  # Never cancel on main: bots push several times an hour, and a cancelled run
  # never reaches `deploy-pages`.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    strategy:
      # One red row must not cancel the rest.
      fail-fast: false
      matrix:
        include:
          # `--all-features` is on the desktop rows and only there. It enables
          # `rustdar-gps/serial` and `rustdar-android/jni-typecheck`, neither of
          # which belongs in a wasm or iOS graph.
          - name: Linux x86_64
            runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            cmd: cargo build --workspace --all-targets --all-features --target x86_64-unknown-linux-gnu
          - name: macOS aarch64
            runner: macos-15
            target: aarch64-apple-darwin
            cmd: cargo build --workspace --all-targets --all-features --target aarch64-apple-darwin
          - name: Windows x86_64
            runner: windows-2025
            target: x86_64-pc-windows-msvc
            cmd: cargo build --workspace --all-targets --all-features --target x86_64-pc-windows-msvc

          # Not the web gate -- `web-bundle` is. A fast per-crate signal that
          # the portable stack stays wasm-clean, on default features.
          - name: wasm32 libraries
            runner: ubuntu-24.04
            target: wasm32-unknown-unknown
            cmd: >-
              cargo check --target wasm32-unknown-unknown
              -p nexrad-level3 -p rustdar-units -p rustdar-gps -p rustdar-radar
              -p rustdar-overlays -p rustdar-egui -p rustdar-frontend -p rustdar-web

          # `check` and scoped: there is no iOS entry-point crate, so nothing
          # links. rustdar-frontend still pulls the portable stack and carries
          # the `mobile` cfg iOS takes its memory budget from. On macOS because
          # `ring` compiles C and cc-rs shells out to `xcrun`.
          - name: iOS aarch64
            runner: macos-15
            target: aarch64-apple-ios
            cmd: cargo check -p rustdar-frontend --lib --target aarch64-apple-ios
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust
        shell: bash
        # rust-toolchain.toml is the source of truth; `rustup show` materialises
        # it. Asserted against `target list --installed`, not
        # `rustc --print target-list` -- the latter names uninstalled triples,
        # so a missing one would surface later as "can't find crate for `std`".
        run: |
          set -euo pipefail
          rustup show active-toolchain || rustup toolchain install
          rustup show
          if ! rustup target list --installed | grep -qx '${{ matrix.target }}'; then
            echo "::error::target ${{ matrix.target }} is not installed. Add it to the targets list in rust-toolchain.toml."
            exit 1
          fi

      # serialport links libudev on Linux only; `apt-get` does not exist on the
      # other two runners.
      - name: Install system deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libudev-dev

      # The target is part of the key: registry contents differ per target, so a
      # single key had every row racing to save one incomplete entry.
      - name: Cache cargo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-${{ matrix.target }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-${{ matrix.target }}-
            ${{ runner.os }}-cargo-

      - name: ${{ matrix.cmd }}
        shell: bash
        run: ${{ matrix.cmd }}

  # The web deliverable. `cargo check --target wasm32-unknown-unknown` is not a
  # web gate: binding generation is a step cargo never runs, and that is where
  # the wgpu `duplicate string enums: GpuFilterMode` break surfaced -- a clean
  # cargo build followed by a wasm-bindgen failure.
  #
  # Also the source of the Pages artifact. There is no second wasm build.
  web-bundle:
    name: Web bundle (wasm-pack)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust
        run: rustup show
      # `~/.cargo/bin` and the install ledger are cached so `cargo install`
      # below is a no-op on a hit instead of a source build.
      - name: Cache cargo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin
            ~/.cargo/.crates.toml
            ~/.cargo/.crates2.json
          key: ${{ runner.os }}-cargo-wasm32-unknown-unknown-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-wasm32-unknown-unknown-
      - name: Install wasm-pack
        run: cargo install wasm-pack --locked --version ^0.15

      # `--no-typescript` drops the .d.ts files, `--no-pack` the npm
      # package.json. Neither is served.
      - name: Build the bundle
        run: wasm-pack build rustdar-web --target web --release --no-typescript --no-pack

      # Opt-in, naming what is published. The previous allowlist matched by
      # extension anywhere under the crate, which shipped `tests/*.mjs` and had
      # `*.json` on it -- the extension a leaked service-account key wears.
      # Adding something new here is a deliberate one-line edit.
      - name: Stage the servable directory
        shell: bash
        run: |
          set -euo pipefail
          rm -rf dist && mkdir -p dist/pkg
          cp rustdar-web/index.html rustdar-web/manifest.webmanifest rustdar-web/sw.js dist/
          cp -R rustdar-web/icons dist/icons
          # wasm-pack output: the loader and the module. `.gitignore`,
          # `package.json` and `*.d.ts` are build-time leftovers.
          cp rustdar-web/pkg/rustdar_web.js rustdar-web/pkg/rustdar_web_bg.wasm dist/pkg/
          # wasm-bindgen emits this only for crates using JS snippets.
          if [ -d rustdar-web/pkg/snippets ]; then
            cp -R rustdar-web/pkg/snippets dist/pkg/snippets
          fi

          echo "Staged:"; find dist -type f | sort | sed 's/^/  /'

          test -f dist/index.html
          test -f dist/pkg/rustdar_web.js
          test -f dist/pkg/rustdar_web_bg.wasm
          test -f dist/sw.js
          test -f dist/manifest.webmanifest

      # A project Pages site is served from a subpath, so a root-absolute
      # reference works under `python3 -m http.server` and 404s in production.
      - name: Reject absolute asset paths
        run: python3 .github/scripts/check-relative-paths.py dist

      # Uploaded on every run so a pull request proves the artifact assembles.
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist

  # Android tier 1: type-check the JNI layer on the host, ~12 seconds, with no
  # NDK and no cross target. `rustdar-android`'s `jni-typecheck` feature widens
  # its crate-level cfg so every helper except `android_main` compiles here.
  #
  # Does NOT replace tier 2: `android_main`, the winit Android backend and the
  # linked `.so` are only exercised there.
  android-jni-check:
    name: Android JNI typecheck (host)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust
        run: rustup show
      - name: Cache cargo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-android-jni-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-android-jni-

      # This job is worthless unless the crate body actually compiles here, and
      # every cheaper way of checking that is fakeable. `cargo tree` reads
      # manifests and never opens a source file. Grepping the `#![cfg(...)]` for
      # the feature name passes for `all(...)`, for
      # `not(feature = "jni-typecheck")`, and for the name appearing in a
      # trailing comment -- each of which compiles nothing -- and fails on a
      # correct cfg reformatted across lines, because grep is line-oriented and
      # the attribute is not.
      #
      # So compile it and require a `compile_error!` to fire. No cfg spelling
      # can fake that.
      - name: Assert the crate body compiles on this host
        shell: bash
        run: |
          set -euo pipefail
          root=rustdar-android/src/lib.rs
          cp "$root" "$root.orig"
          trap 'mv -f "$root.orig" "$root"' EXIT
          printf '\ncompile_error!("rustdar jni-typecheck canary");\n' >> "$root"
          out="$(cargo check -p rustdar-android --features jni-typecheck 2>&1 || true)"
          if printf '%s' "$out" | grep -q 'rustdar jni-typecheck canary'; then
            echo "ok: the canary fired, so the crate body is compiled on this host"
          else
            echo "::error::a compile_error! appended to ${root} did not fire, so this job type-checks none of it. The crate-level #![cfg(...)] no longer opens under the jni-typecheck feature, or the feature no longer supplies the host deps."
            printf '%s\n' "$out"
            exit 1
          fi

      - name: cargo check -p rustdar-android --features jni-typecheck
        run: cargo check -p rustdar-android --features jni-typecheck

  # Android tier 2: the real cross-compile, both shipped ABIs.
  #
  # A bare `cargo check --target aarch64-linux-android` dies in `ring`'s build
  # script for want of a cross clang/sysroot. cargo-ndk exports those and is
  # what `android/app/build.gradle.kts` drives, so CI and Gradle stay on one
  # path. `build`, not `check`, and `-P 28` must track minSdk: at the default
  # platform level the sysroot lacks symbols the graphics/JNI stack links
  # against, so a check there can pass while Gradle fails.
  android:
    name: Android ${{ matrix.abi }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - abi: arm64-v8a
            target: aarch64-linux-android
          - abi: x86_64
            target: x86_64-linux-android
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust
        run: rustup show
      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libudev-dev
      - name: Cache cargo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin
            ~/.cargo/.crates.toml
            ~/.cargo/.crates2.json
          key: ${{ runner.os }}-cargo-${{ matrix.target }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-${{ matrix.target }}-
      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked --version ^4
      - name: cargo ndk build (${{ matrix.abi }})
        shell: bash
        run: |
          set -euo pipefail
          # Read in the shell: GitHub's `env` context does not carry runner OS
          # variables, so `${{ env.ANDROID_NDK_LATEST_HOME }}` expands to empty.
          export ANDROID_NDK_HOME="${ANDROID_NDK_HOME:-${ANDROID_NDK_LATEST_HOME:-${ANDROID_NDK_ROOT:-}}}"
          # Hard failure, never a skip: a silently-skipped cross-compile reads
          # as coverage on the PR page while verifying nothing.
          if [ -z "$ANDROID_NDK_HOME" ] || [ ! -d "$ANDROID_NDK_HOME" ]; then
            echo "::error::No Android NDK on this runner (ANDROID_NDK_HOME='${ANDROID_NDK_HOME}'). Refusing to pass without cross-compiling."
            exit 1
          fi
          echo "Using NDK at $ANDROID_NDK_HOME"
          # -P must track minSdk in android/app/build.gradle.kts.
          cargo ndk -t '${{ matrix.abi }}' -P 28 build -p rustdar-android --lib

  # The failures no compiler can see: one crate resolved to two versions.
  #
  #   * `jni` / `rustls-platform-verifier` -- bumping either alone still
  #     compiles. `rustdar-android` initialises one verifier while every reqwest
  #     client reads the other, and Android TLS silently becomes a no-op.
  #   * `wgpu` -- renovate once bumped the workspace pin to 30.0.0 while
  #     egui-wgpu 0.35 pins ^29, and cargo resolved a second copy. The 30.0.0
  #     copy had no users, so the backend selection in rustdar-frontend -- the
  #     only place `webgpu` is held off -- applied to an inert copy.
  #
  # The `const _` guard in `rustdar-frontend/src/app.rs` is a per-crate identity
  # check and stays clean with two copies resolved through a sibling member, so
  # this is the only graph-wide coverage. Per-target, because resolution is.
  dep-unification:
    name: Dependency unification
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust
        run: rustup show
      - name: Assert exactly one resolved version of each pinned crate
        shell: bash
        run: |
          set -uo pipefail
          fail=0
          check() {
            crate="$1"; shift
            for target in "$@"; do
              # cargo tree exits non-zero with "specification '<crate>' is
              # ambiguous" when two copies resolve -- the very state this
              # asserts against, so it is reported rather than sent to
              # /dev/null and surfacing as the misleading "found 0".
              out="$(cargo tree -i "$crate" --target "$target" -e normal --prefix none 2>&1)"
              rc=$?
              if [ "$rc" -ne 0 ]; then
                echo "::error::cargo tree -i ${crate} --target ${target} failed (exit ${rc}). An ambiguous specification means more than one version resolved, which is itself the failure:"
                printf '%s\n' "$out" | sed 's/^/    /'
                fail=1
                continue
              fi
              versions="$(printf '%s\n' "$out" | grep -E "^${crate} v" | sort -u)"
              count="$(printf '%s' "$versions" | grep -c . )" || true
              if [ "$count" -ne 1 ]; then
                echo "::error::expected exactly 1 version of ${crate} in the ${target} graph, found ${count}"
                printf '%s\n' "$versions" | sed 's/^/    /'
                fail=1
              else
                echo "ok [${target}]: ${versions}"
              fi
            done
          }

          check jni                      aarch64-linux-android x86_64-linux-android
          check rustls-platform-verifier aarch64-linux-android x86_64-linux-android
          check wgpu                     x86_64-unknown-linux-gnu wasm32-unknown-unknown aarch64-linux-android

          exit "$fail"

  # Every member on its own, with its own default features -- what
  # `--all-features` hides. rustdar-egui could not build standalone for weeks:
  # it called `rustdar_gps::detect_gps_ports` while that sat behind
  # rustdar-gps's `serial` feature, which every `--all-features` build turned on
  # for it. Feature unification only spans the selected packages, so `-p
  # <member>` is exactly the build that broke.
  standalone:
    name: Standalone crate builds
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust
        run: rustup show
      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libudev-dev
      - name: Cache cargo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-standalone-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-
      - name: Build each workspace member alone
        shell: bash
        run: |
          set -uo pipefail
          members="$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[].name' | sort)"
          if [ -z "$members" ]; then
            echo "::error::no workspace members found -- cargo metadata returned nothing"
            exit 1
          fi
          echo "Members:"; printf '%s\n' "$members" | sed 's/^/  /'
          fail=0
          for m in $members; do
            echo "::group::$m"

            # A crate whose whole body is cfg'd out compiles zero lines here and
            # would print a bare PASS. Labelled rather than hidden, from
            # structure so the label comes and goes on its own: a crate root
            # beginning `#![cfg(`, or a package whose every dependency sits
            # under a `[target.'cfg(...)'.dependencies]`.
            root="$(cargo metadata --no-deps --format-version 1 \
              | jq -r --arg m "$m" '.packages[] | select(.name==$m) | .targets[]
                                    | select(.kind | index("lib") or index("cdylib") or index("rlib"))
                                    | .src_path' | head -1)"
            gated="$(cargo metadata --no-deps --format-version 1 \
              | jq -r --arg m "$m" '.packages[] | select(.name==$m)
                                    | (.dependencies | map(select(.kind != "dev"))) as $d
                                    | if ($d | length) > 0
                                        and (($d | map(select(.target == null)) | length) == 0)
                                      then "yes" else "no" end')"
            vacuous=""
            if [ "$gated" = "yes" ] || { [ -n "$root" ] && [ -f "$root" ] && grep -qE '^\s*#!\[cfg\(' "$root"; }; then
              vacuous=" (host-vacuous: compiles no code on this host; real coverage is the Android rows)"
            fi

            if cargo check -p "$m" --all-targets; then
              echo "PASS $m$vacuous"
            else
              echo "::error::$m does not build standalone with its own default features"
              fail=1
            fi
            echo "::endgroup::"
          done
          exit "$fail"

  # Clippy and Test live here, not in workflows of their own, so `deploy-pages`
  # can reach them through `build-success`. `workflow_run` is the only
  # cross-workflow mechanism and it does not inherit the triggering run's
  # conclusion without extra plumbing. Job names are unchanged, so the existing
  # required contexts still resolve.
  clippy:
    name: Clippy
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Generate GitHub App Token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: app-token
        with:
          client-id: ${{ secrets.AUTO_COMMIT_APP_ID }}
          private-key: ${{ secrets.AUTO_COMMIT_APP_KEY }}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ steps.app-token.outputs.token }}
      - name: Install Rust
        run: rustup show
      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libudev-dev
      - name: Cache cargo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin
            ~/.cargo/.crates.toml
            ~/.cargo/.crates2.json
          key: ${{ runner.os }}-cargo-clippy-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-clippy-
      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked --version ^4
      - name: Apply Clippy autofixes
        run: cargo clippy --all-targets --all-features --fix || true

      # The gate on the autofix: nothing below runs if these fail, including the
      # commit and push. This bot pushes straight to main and previously
      # committed unconditionally, re-running clippy only afterwards.
      #
      # The cross arms are checked too. `--fix` only sees the host cfg arms but
      # edits shared source the Android and wasm arms also compile, so a
      # "redundant" clone it drops can break a call site behind
      # `#[cfg(target_os = "android")]` invisibly.
      - name: Verify the autofixed tree still builds (host)
        run: cargo build --workspace --all-targets --all-features
      - name: Verify the autofixed tree still builds (wasm32)
        run: cargo check -p rustdar-web --lib --target wasm32-unknown-unknown
      - name: Verify the autofixed tree still builds (Android arm64-v8a)
        shell: bash
        run: |
          set -euo pipefail
          export ANDROID_NDK_HOME="${ANDROID_NDK_HOME:-${ANDROID_NDK_LATEST_HOME:-${ANDROID_NDK_ROOT:-}}}"
          if [ -z "$ANDROID_NDK_HOME" ] || [ ! -d "$ANDROID_NDK_HOME" ]; then
            echo "::error::No Android NDK on this runner. Refusing to auto-commit a tree whose Android arm was never compiled."
            exit 1
          fi
          cargo ndk -t arm64-v8a -P 28 check -p rustdar-android --lib

      - uses: stefanzweifel/git-auto-commit-action@4a55954c782fc1ea30b9056cd3e7a2b40ca8887d # v7.2.0
        with:
          commit_message: "chore: Apply clippy fixes"
          commit_user_name: usa-reddragon-auto-commit[bot]
          commit_user_email: 234130638+github-actions[bot]@users.noreply.github.com
          commit_author: "usa-reddragon-auto-commit[bot] <234130638+github-actions[bot]@users.noreply.github.com>"

      # `-D warnings` goes here and not on the `--fix` step, so the bot still
      # autofixes what it can and the build fails only on the rest. This is also
      # what makes `unexpected_cfgs` load-bearing: a build script that stopped
      # emitting the `mobile` cfg produced warnings nobody failed on, and
      # Android and iOS silently took desktop memory budgets.
      #
      # Gap: this is the host cfg. The Android target has no lint gate, and
      # `cargo ndk clippy` reports 3 warnings from arms only Android compiles.
      - name: Run Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

  test:
    name: Test
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Generate GitHub App Token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: app-token
        with:
          client-id: ${{ secrets.AUTO_COMMIT_APP_ID }}
          private-key: ${{ secrets.AUTO_COMMIT_APP_KEY }}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ steps.app-token.outputs.token }}
          fetch-depth: 0
      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libudev-dev
      - name: Cache cargo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin
            ~/.cargo/.crates.toml
            ~/.cargo/.crates2.json
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-
      - name: Install Rust + llvm-tools
        run: |
          rustup show
          rustup component add llvm-tools-preview
          cargo install cargo-llvm-cov
      - name: Run tests
        run: cargo llvm-cov --no-report
      - name: Generate coverage reports
        if: always()
        run: |
          cargo llvm-cov report --lcov --output-path lcov.info
          cargo llvm-cov report --html --output-dir coverage
      - name: Upload HTML coverage report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-html
          path: coverage/html
          retention-days: 14
      - name: Comment coverage on pull request
        if: always() && github.event_name == 'pull_request'
        # Coverage is informational and never gates, so failing to report it
        # must not turn the pull request red.
        continue-on-error: true
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          if [ ! -s lcov.info ]; then
            echo "No coverage report was produced, skipping comment"
            exit 0
          fi
          .github/scripts/coverage-summary.sh lcov.info > "$RUNNER_TEMP/current.tsv"
          git diff --name-only "$BASE_SHA"...HEAD > "$RUNNER_TEMP/changed.txt"
          .github/scripts/coverage-comment.sh \
            "$RUNNER_TEMP/current.tsv" \
            .github/coverage-baseline.tsv \
            "$RUNNER_TEMP/changed.txt" > "$RUNNER_TEMP/comment.md"
          gh pr comment "$PR" --body-file "$RUNNER_TEMP/comment.md" --edit-last --create-if-none

      # Retried against a moving main. This workflow does not cancel superseded
      # runs on main, so two can reach this step at once, and the ruleset
      # forbids non-fast-forward -- losing the race means redoing the work.
      #
      # Reset-and-regenerate, not rebase. Both files are whole-file rewrites and
      # a pure function of lcov.info, so two runs conflict on every line of both
      # and a rebase aborts the step; regenerating on top of whatever main now
      # holds always produces the right answer and cannot conflict.
      #
      # Untracked files survive `reset --hard`, so lcov.info persists.
      - name: Update coverage badge and baseline
        if: github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'usa-reddragon-auto-commit[bot]'
          git config user.email '234130638+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3 4 5; do
            git fetch --quiet origin main
            git reset --quiet --hard FETCH_HEAD
            .github/scripts/coverage-badge.sh lcov.info .github/badges/coverage.svg
            .github/scripts/coverage-summary.sh lcov.info > .github/coverage-baseline.tsv
            if git diff --quiet -- .github/badges/coverage.svg .github/coverage-baseline.tsv; then
              echo "Coverage unchanged, nothing to commit"
              exit 0
            fi
            git add .github/badges/coverage.svg .github/coverage-baseline.tsv
            git commit --quiet -m 'chore: update coverage badge and baseline [skip ci]'
            if git push --quiet origin HEAD:main; then
              echo "pushed on attempt ${attempt}"
              exit 0
            fi
            echo "push rejected on attempt ${attempt}; another run landed first, retrying"
          done
          echo "::error::could not land the coverage update after 5 attempts"
          exit 1

  # The one required status check. `needs` on a matrix job covers all its rows.
  # `skipped` and `cancelled` count as failures: a job that did not run has
  # verified nothing. Adding a job above means adding it here.
  build-success:
    name: Build success check
    if: always()
    runs-on: ubuntu-24.04
    needs:
      - build
      - web-bundle
      - android-jni-check
      - android
      - dep-unification
      - standalone
      - clippy
      - test
    steps:
      - name: Report job results
        shell: bash
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: echo "$NEEDS"
      - name: Fail if any job did not succeed
        if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped') }}
        shell: bash
        run: |
          echo "::error::One or more required jobs did not succeed; see the results printed above."
          exit 1

  # Deploys the artifact `web-bundle` uploaded in this same run; nothing is
  # rebuilt. `needs: build-success` is what makes that safe -- build-success is
  # `always()` and fails when any job above failed, so a failure anywhere skips
  # this.
  #
  # `push` to `main` only. A pull request must never publish: `pull_request`
  # runs for forks, and `pages: write` / `id-token: write` must not be reachable
  # from an untrusted branch.
  deploy-pages:
    name: Deploy web build to GitHub Pages
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [build-success]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    # Not the workflow-level group, which cancels in progress. Cancelling a
    # deployment mid-flight half-publishes the site; queue instead.
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      # Required, not scaffolding: no Pages site exists yet and `deploy-pages`
      # fails outright without one carrying `build_type: workflow`. Here rather
      # than in `web-bundle` because enablement needs `pages: write` and
      # `web-bundle` runs on pull requests including from forks.
      - name: Enable and configure Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0
        with:
          enablement: true
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
