name: Build

# One row per target triple, cross-compiled on one Linux runner in the
# rust-cross image: osxcross, llvm-mingw, the iPhoneOS SDK, the NDK, cargo-ndk
# and wasm-pack all ship in it, so no macOS or Windows runner is needed.
# Almost everything platform-specific is behind a `#[cfg]`, so the triple is
# the unit of coverage.

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: '${{ github.workflow }} @ ${{ github.ref }}'
  # Never cancel on main: bots push several times an hour, and a cancelled run
  # never reaches `deploy-pages`.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/usa-reddragon/rust-cross:1.97.1@sha256:433d3e61c46c6dea2e0bb0bc450fe34415d9769f6d801ab1f2e2ebbdbcf50c28
    defaults:
      run:
        shell: bash
    strategy:
      # One red row must not cancel the rest.
      fail-fast: false
      matrix:
        include:
          # `--all-features` on the desktop rows only: it enables
          # rustdar-gps/serial, which links IOKit. It also enables
          # rustdar-android/jni-typecheck, so these rows type-check the JNI layer.
          #
          # `--release` on every row whose artifact a person can run, and folded
          # into the command that already provides the compile coverage rather
          # than added as a second one. Not for wall clock -- that comes out even,
          # measured: folding it in is 6:30 cold and 3:25 warm against 6:25 and
          # 3:27 for a debug coverage pass plus a release `-p rustdar-platform`.
          # One fat-LTO link is nearly serial, while the 21 here run in parallel.
          # What folding buys is the other two axes: one profile instead of two
          # means the dependency graph is compiled once, `target/` is 1.8 GB
          # instead of 12 GB, and the uploaded file is 27.5 MB instead of 602 MB
          # on four rows every run. The cost is CPU -- about 3.4x warm, since
          # 21 test binaries nobody runs are linked under fat LTO.
          # `--all-targets --all-features` is unchanged, so the coverage is the
          # same set of crates and the same set of features as before.
          #
          # Until this said `--release`, every desktop download was workspace
          # code at `opt-level = 0` with debug assertions on.
          # `[profile.dev.package."*"]` optimizes the dependencies, so the whole
          # penalty landed on rustdar's own crates -- which is where the
          # rasterizer is. rustdar-web/src/lib.rs prices unoptimized workspace
          # code at 2349 ms per Level II frame against 160-190 ms.
          - name: linux-x86_64
            target: x86_64-unknown-linux-gnu
            cmd: cargo build --release --workspace --all-targets --all-features --target x86_64-unknown-linux-gnu
            artifact: target/x86_64-unknown-linux-gnu/release/rustdar-platform
          # The artifact is a signed .app in a zip, not the bare executable.
          # Three reasons, and none of them is polish: arm64 macOS refuses to
          # execute an unsigned Mach-O at all, so the old `macos-aarch64`
          # artifact was never runnable; `upload-artifact` drops the executable
          # bit, so an unzipped .app is a folder macOS declines to open; and
          # CoreLocation will not prompt for an executable with no bundle
          # identifier, which is every bare binary. See `macos_arch` below.
          - name: macos-aarch64
            target: aarch64-apple-darwin
            package: macos
            macos_arch: aarch64
            cmd: cargo build --release --workspace --all-targets --all-features --target aarch64-apple-darwin
            artifact: packaging/macos/build/aarch64-apple-darwin/rustdar.app.zip
          - name: macos-x86_64
            target: x86_64-apple-darwin
            package: macos
            macos_arch: x86_64
            cmd: cargo build --release --workspace --all-targets --all-features --target x86_64-apple-darwin
            artifact: packaging/macos/build/x86_64-apple-darwin/rustdar.app.zip
          # gnullvm, not MSVC: MSVC is the one family the image does not carry.
          - name: windows-x86_64
            target: x86_64-pc-windows-gnullvm
            cmd: cargo build --release --workspace --all-targets --all-features --target x86_64-pc-windows-gnullvm
            artifact: target/x86_64-pc-windows-gnullvm/release/rustdar-platform.exe

          # A real link, not a `check`. `rustdar-platform --lib` as a staticlib
          # codegens the whole graph, and the link is where the failures that
          # only iOS has actually appear: a missing `-framework`, or a
          # dependency that reaches for IOKit. `IN_CONTAINER=1` because this job
          # already runs inside the image packaging/ios/Makefile would otherwise start.
          # `zip` is not in the image and is only needed to package the .ipa.
          - name: ios-aarch64
            target: aarch64-apple-ios
            workspaces: ". -> target-ios"
            artifact: packaging/ios/build/linux/iphoneos/rustdar.ipa
            cmd: |
              apt-get update -qq
              apt-get install -y -qq --no-install-recommends zip
              make -C packaging/ios IN_CONTAINER=1
              test -f packaging/ios/build/linux/iphoneos/rustdar.ipa \
                || { echo "::error::no .ipa was packaged"; exit 1; }
          # Same link against the simulator SDK. Not redundant: it is a
          # different target triple with its own std, its own clang wrapper and
          # its own Mach-O platform, and it is the only one testable without
          # signing.
          - name: ios-aarch64-sim
            target: aarch64-apple-ios-sim
            workspaces: ". -> target-ios"
            artifact: packaging/ios/build/linux/iphonesimulator/rustdar.app
            cmd: make -C packaging/ios IN_CONTAINER=1 SIMULATOR=1

          # `./gradlew assembleRelease`, not a bare `cargo ndk`. These were the
          # only rows whose artifact nobody could act on: every other row ships
          # something that runs, and these shipped a `.so`, which is not an app
          # but an input to one. Turning it into an installable APK is
          # android/app/build.gradle.kts's job and it was already written; CI
          # simply never called it.
          #
          # This is still one compile of one triple, and the coverage the old
          # `cargo ndk` line gave is unchanged, because Gradle *is* that line:
          # `buildRustLibRelease` runs `cargo ndk -t <abi> -P <minSdk> build -p
          # rustdar-android --lib --release`. `ring`'s build script still gets
          # the cross clang/sysroot cargo-ndk exports. What changes is that the
          # two constants are read from the Gradle build instead of repeated
          # here: the old comment warned that `-P 28` "must track minSdk there",
          # and on these rows it no longer can, because Gradle reads minSdk
          # rather than being told it.
          #
          # That does not retire the literal repo-wide, and it is worth saying
          # where the other one lives instead of implying there is none.
          # clippy.yaml's "Verify the autofixed tree still builds (Android
          # arm64-v8a)" step calls `cargo ndk` directly -- it lints rather than
          # packages, so routing it through Gradle would buy it an APK it has
          # no use for -- and something still has to hand it the platform
          # level. That step now greps `minSdk` out of the same
          # build.gradle.kts, so the number has one definition and two readers
          # rather than one definition and two copies.
          #
          # `-PabiFilter` is what keeps one row to one ABI. Without it each row
          # builds both, so every .so is compiled twice per run and a break in
          # either ABI reddens both rows instead of the one that owns it.
          #
          # `abi` repeats what `-PabiFilter` already says because a matrix entry
          # cannot reference a sibling key. It is not loose duplication: the
          # assertion step reads the ABI back out of the finished APK and
          # compares it to this, so the two disagreeing is a red row.
          #
          # The artifact *name* is itself the first signing check. AGP emits
          # `app-<abi>-release-unsigned.apk` when the release build type has no
          # signingConfig and `app-<abi>-release.apk` when it has one, so with
          # `if-no-files-found: error` below, a run whose signing step quietly
          # did nothing fails on the missing path rather than uploading a file
          # Android would refuse to install. The assertion step still runs
          # apksigner over the result afterwards, because a filename is not a
          # signature.
          #
          # Two things `assembleRelease` brings with it that this change does
          # not act on, written down so the next person meets them as known
          # rather than as a surprise:
          #
          #   - It runs `lintVitalRelease`, so these rows can now go red on an
          #     Android lint finding -- scope the `cargo ndk` line never had,
          #     since it only ever compiled Rust. Nothing here configures or
          #     suppresses that. The first time it fires is the moment to
          #     choose between fixing the finding and scoping the lint,
          #     deliberately rather than by reflex.
          #
          #   - R8 writes `mapping.txt` and AGP writes
          #     `native-debug-symbols.zip`, and both die with the container.
          #     Uploading them beside the APK is what would make a crash from a
          #     CI build symbolicable; it is left out only because it is a
          #     change to the upload step rather than to the build.
          - name: android-arm64-v8a
            target: aarch64-linux-android
            package: android
            abi: arm64-v8a
            cmd: cd rustdar-android/android && ./gradlew assembleRelease -PabiFilter=arm64-v8a
            artifact: rustdar-android/android/app/build/outputs/apk/release/app-arm64-v8a-release.apk
          - name: android-x86_64
            target: x86_64-linux-android
            package: android
            abi: x86_64
            cmd: cd rustdar-android/android && ./gradlew assembleRelease -PabiFilter=x86_64
            artifact: rustdar-android/android/app/build/outputs/apk/release/app-x86_64-release.apk

          # The only wasm build, and deliberately so. The deleted `wasm32
          # libraries` row named members as roots, so rustdar-gps took its own
          # defaults and serialport -- the crate the `serial`/`gps-serial` gates
          # exist to keep off web and iOS -- got compiled for wasm32. Nothing
          # ships that combination, so it gated nothing. Do not restore the row.
          #
          # `cargo check` is not a web gate either: binding generation is a step
          # cargo never runs, and that is where the wgpu
          # `duplicate string enums: GpuFilterMode` break surfaced.
          - name: web-wasm32
            target: wasm32-unknown-unknown
            pages: true
            cmd: |
              apt-get update -qq
              apt-get install -y -qq --no-install-recommends python3
              wasm-pack build rustdar-web --target web --release --no-typescript --no-pack

              # Opt-in list. The old extension allowlist shipped `tests/*.mjs`
              # and carried `*.json` -- what a leaked service-account key wears.
              rm -rf dist && mkdir -p dist/pkg
              cp rustdar-web/index.html rustdar-web/manifest.webmanifest rustdar-web/sw.js rustdar-web/worker.js dist/
              cp -R rustdar-web/icons dist/icons
              cp rustdar-web/pkg/rustdar_web.js rustdar-web/pkg/rustdar_web_bg.wasm dist/pkg/
              # wasm-bindgen emits this only for crates using JS snippets.
              if [ -d rustdar-web/pkg/snippets ]; then cp -R rustdar-web/pkg/snippets dist/pkg/snippets; fi
              echo "Staged:"; find dist -type f | sort | sed 's/^/  /'

              # `cache.addAll` is all-or-nothing: one unstaged shell path and the
              # worker never installs, silently un-PWA-ing the site.
              # `pwa_assets.rs` checks the source tree; this checks what ships.
              n=0
              for q in $(tr '\n' ' ' <rustdar-web/sw.js | grep -oE 'SHELL_PATHS = \[[^]]*\]' | grep -oE '"[^"]*"'); do
                p=$(printf %s "$q" | tr -d '"')
                test -f "dist/${p:-index.html}" || { echo "::error::sw.js precaches '$p', which is not staged"; exit 1; }
                n=$((n + 1))
              done
              test "$n" -ge 2 || { echo "::error::SHELL_PATHS parsed as $n entries; the parse is wrong or the list was gutted"; exit 1; }
              echo "ok: all $n SHELL_PATHS entries are staged"

              # A project Pages site is served from a subpath, so a root-absolute
              # reference works locally and 404s in production.
              python3 .github/scripts/check-relative-paths.py dist

          # Not a triple: every member alone on its own default features, which
          # `--all-features` hides. rustdar-egui was broken this way for weeks --
          # it called `rustdar_gps::detect_gps_ports` while that sat behind
          # rustdar-gps's `serial` feature, which every desktop row turns on.
          - name: standalone
            cmd: |
              members=$(cargo tree --workspace --depth 0 --prefix none | awk 'NF {print $1}' | sort -u)
              test -n "$members" || { echo "::error::cargo tree listed no workspace members"; exit 1; }
              fail=0
              for m in $members; do
                echo "::group::$m"
                cargo check -p "$m" --all-targets || fail=1
                echo "::endgroup::"
              done
              exit "$fail"

          # One crate resolved to two versions -- invisible to every compiler.
          # Bumping `jni` or `rustls-platform-verifier` alone still builds, and
          # Android TLS goes silently no-op. A second `wgpu` copy once left
          # rustdar-frontend's backend selection applying to an inert one; its
          # `const _` guard is per-crate, so this is the only graph-wide check.
          # Per-target, because resolution is, and `-p`-scoped to the crate that
          # actually ships that target: an unscoped `cargo tree -i` answers for
          # the union of the workspace graph, which is not what any one artifact
          # links. On iOS that union already lies -- it reports serialport, which
          # the linked binary does not contain.
          - name: dep-unification
            cmd: |
              fail=0
              # Each spec is <shipping crate>:<target>.
              check() {
                crate=$1; shift
                for spec in "$@"; do
                  pkg=${spec%%:*}; t=${spec#*:}
                  # cargo tree exits non-zero with "specification is ambiguous"
                  # when two copies resolve -- itself the failure, so report it
                  # rather than let it surface as a misleading "found 0".
                  if ! out=$(cargo tree -i "$crate" -p "$pkg" --target "$t" -e normal --prefix none 2>&1); then
                    echo "::error::cargo tree -i $crate -p $pkg --target $t failed:"
                    printf '%s\n' "$out" | sed 's/^/    /'
                    fail=1; continue
                  fi
                  found=$(printf '%s\n' "$out" | grep -E "^$crate v" | sort -u) || true
                  n=$(printf '%s\n' "$found" | grep -c .) || true
                  if [ "$n" = 1 ]; then
                    echo "ok [$pkg $t]: $found"
                  else
                    # 0 is a failure too: scoped, it means the crate left the
                    # artifact's graph entirely.
                    echo "::error::expected exactly 1 version of $crate in the $pkg $t graph, found $n"
                    printf '%s\n' "$found" | sed 's/^/    /'
                    fail=1
                  fi
                done
              }
              check jni                      rustdar-android:aarch64-linux-android rustdar-android:x86_64-linux-android
              check rustls-platform-verifier rustdar-android:aarch64-linux-android rustdar-android:x86_64-linux-android
              check wgpu                     rustdar-platform:x86_64-unknown-linux-gnu rustdar-platform:aarch64-apple-ios rustdar-web:wasm32-unknown-unknown rustdar-android:aarch64-linux-android
              exit "$fail"

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Use the image's toolchain
        # rust-toolchain.toml says `stable`; obeying it here makes rustup fetch
        # a toolchain with none of the image's 23 preinstalled targets. Read the
        # pin from the image's own RUST_VERSION so an image bump carries itself.
        run: echo "RUSTUP_TOOLCHAIN=${RUST_VERSION:?the rust-cross image must set RUST_VERSION}" >> "$GITHUB_ENV"

      - name: Assert the image still ships ${{ matrix.target }}
        if: matrix.target
        # Nothing adds targets here, so this is really about image drift.
        run: |
          rustup show
          rustup target list --installed | grep -qx '${{ matrix.target }}' \
            || { echo "::error::the rust-cross image no longer ships ${{ matrix.target }} std."; exit 1; }

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: ${{ matrix.name }}
          # The iOS rows build into target-ios/, not target/; without this they
          # would cache and restore an empty directory on every run.
          workspaces: ${{ matrix.workspaces || '.' }}
          # CARGO_HOME is the image's /usr/local/cargo; restoring a cached bin/
          # over it would shadow the image's own wasm-pack and cargo-ndk.
          cache-bin: "false"

      # ── The two Android steps below run *before* the row's own command ──
      #
      # Unlike the macOS packaging steps further down, which take a binary the
      # row already built, these are prerequisites of the build itself: on the
      # Android rows Gradle is what compiles the Rust, so the SDK and the
      # signing key have to exist before `assembleRelease`, not after it.
      #
      # `~/.gradle` is deliberately NOT cached, and that is a measured decision
      # rather than an omission. `rust-cache` above covers Cargo only, so a
      # Gradle build does add a second cacheable tree -- it is simply not one
      # worth caching. Measured from a completely empty Gradle home: the whole
      # Gradle-side cost, wrapper distribution included, is 39 s wall clock,
      # and what it leaves behind is 708 MB (163 MB of unpacked distribution,
      # 544 MB of resolved AGP and its dependencies).
      #
      # Caching that saves some part of 39 s and costs 708 MB *per row*, in a
      # repository cache budget of 10 GB that the eleven `rust-cache` entries
      # already share. Those entries save minutes each; spending 1.4 GB of the
      # budget that keeps them alive, to save seconds, is the wrong side of
      # that trade. Revisit it if the Gradle build ever grows a step that is
      # slow rather than merely large.
      - name: Install the SDK packages this build needs
        if: matrix.package == 'android'
        # The image carries the NDK -- at exactly the version and path
        # build.gradle.kts pins, `$ANDROID_HOME/ndk/27.3.13750724` -- plus a
        # JDK 21 and the cmdline-tools. What it does not carry is either half of
        # what AGP asks for here: its Android platform is `android-37.0` and its
        # build-tools are `37.0.0`, while `compileSdk` is 36 and AGP 9.3.1's
        # DEFAULT_BUILD_TOOLS_REVISION is 36.0.0. A *newer* package satisfies
        # neither request; both are looked up by exact version.
        #
        # The conclusion that invites -- that without this step the build dies
        # in `:app:minifyReleaseWithR8` with "Failed to find target with hash
        # string 'android-36'" -- is wrong, and this was checked rather than
        # reasoned about. With this step deleted, a cold Gradle home and an
        # empty build cache, this image takes that very task to BUILD
        # SUCCESSFUL, logging "License for package Android SDK Build-Tools 36
        # accepted" and "Installing Android SDK Platform 36 in
        # /opt/android-sdk/platforms/android-36" on the way, and leaves both
        # packages on disk. AGP downloads what it is missing. That failure is
        # real only with AGP's auto-download disabled, which is not a
        # configuration this job uses.
        #
        # So the step is not a prerequisite. It stays because it makes the
        # download legible and names the versions. Roughly 70 MB comes off
        # dl.google.com either way -- fetched here, a bad minute at Google is a
        # red step called "Install the SDK packages this build needs"; fetched
        # inside `assembleRelease`, it is a Gradle task dying partway through a
        # Rust compile, which reads like the build broke. The two versions
        # below are also the only statement anywhere in this repository of what
        # AGP 9.3.1 actually asks for.
        #
        # Not pinned by sha256 the way `rcodesign` is below, and the difference
        # is real rather than an oversight. rcodesign is a tarball pulled off a
        # release page with curl, which verifies nothing at all. `sdkmanager` is
        # the SDK's own package manager: it resolves against Google's repository
        # manifest and checks every package against the checksum in it, which is
        # the same standing this file already extends to `apt-get`. What does
        # have to be pinned is the *version*, and both of them are.
        #
        # `compileSdk` is read out of build.gradle.kts instead of written again
        # here, because that number belongs to the repo and a second copy of it
        # would drift in silence -- exactly because of the auto-download above.
        # A stale literal would not fail; it would leave this step installing
        # one platform while the build quietly fetched and used another, with
        # nothing anywhere to notice the divergence.
        #
        # `build-tools;36.0.0` beside it is a literal, and that asymmetry is
        # deliberate rather than the thing the paragraph above complains about.
        # There is nothing in this repository to read it from: build.gradle.kts
        # never sets `buildToolsVersion`, so 36.0.0 is AGP 9.3.1's own
        # DEFAULT_BUILD_TOOLS_REVISION -- a property of the plugin, not of this
        # code, and reachable only by parsing AGP's jar. What makes the literal
        # tolerable where a `compileSdk` literal would not be is the same
        # auto-download: AGP fetches the revision it actually wants regardless,
        # so a stale number here costs a redundant download, not a red row.
        #
        # `--licenses` is a no-op in this image. All seven files under
        # `$ANDROID_HOME/licenses/` survive its final `rm -rf` -- checked, not
        # assumed. It is kept as insurance against a *future* image that stops
        # shipping them, where sdkmanager would refuse to install anything and
        # this step would be the only thing standing between that image and a
        # broken Android row. It costs about a second.
        #
        # It is fed by redirection from a process substitution and *not* by the
        # `yes | sdkmanager --licenses` every guide writes, because this job
        # runs under `bash -eo pipefail`. sdkmanager stops reading once it has
        # its answers, `yes` takes SIGPIPE, and pipefail hands the pipeline
        # `yes`'s 141 -- so the idiom aborts the step, having done its work,
        # whether or not there was anything left to accept. Measured at 141 in
        # both the already-licensed and the never-licensed case; a redirection
        # is not a pipeline, so there is no status for pipefail to adopt.
        #
        # `|| true` on the grep is load-bearing rather than defensive noise.
        # Without it the `test -n` under it is unreachable: `set -e` aborts on
        # an assignment whose command substitution failed, so a `compileSdk`
        # line that stopped matching would end the step on grep's bare exit 1
        # and the `::error::` would never be printed. Checked both ways -- the
        # annotation appears only with the `|| true` there.
        run: |
          sdk=$(grep -oP '^\s*compileSdk\s*=\s*\K[0-9]+' rustdar-android/android/app/build.gradle.kts || true)
          test -n "$sdk" \
            || { echo "::error::could not read compileSdk out of app/build.gradle.kts"; exit 1; }
          sdkmanager --licenses < <(yes) >/dev/null
          sdkmanager "platforms;android-$sdk" "build-tools;36.0.0"

      - name: Mint a throwaway signing key
        if: matrix.package == 'android'
        # Android will not install an unsigned APK, so a release artifact has to
        # be signed with something, and that something must not be a real key:
        # a signing key wired into CI is reachable by any change to the workflow
        # that runs it, and these artifacts are per-commit test builds, not Play
        # Store uploads.
        # Writing `keystore.properties` is the whole integration -- build.gradle.kts
        # creates its `release` signingConfig if and only if that file is there,
        # so nothing in the Gradle build changes for this.
        #
        # It also means the loud "NO SIGNING KEY" warning build.gradle.kts
        # raises at the end of an unsigned release build stops firing here
        # because the artifact is genuinely signed -- not because anything
        # suppressed it. If this step is ever removed, that warning comes back
        # and the upload fails on the `-unsigned` filename.
        #
        # ── Why the key is fresh every run, and what that costs ──
        #
        # The tempting alternative is "just use the stock Android debug key",
        # and it does not exist. `~/.android/debug.keystore` is *generated per
        # machine* by the Android tooling; what is standard about it is only the
        # `androiddebugkey` alias, the `android` password and the `CN=Android
        # Debug` subject. The keypair behind them is not standard, and Android
        # compares the signing certificate, not its subject -- so writing that
        # DN here would produce a different identity every run anyway, while
        # implying a stability it does not have.
        #
        # So this identity changes per run, and the consequence is worth naming
        # rather than hiding: installing one run's APK over another's fails with
        # INSTALL_FAILED_UPDATE_INCOMPATIBLE, and the fix is to
        # `adb uninstall dev.mcswain.rustdar` first. The assertion step below
        # puts that in the run's own log as a `::notice::`. It is emitted from
        # there and not from here so that it is only ever attached to a run
        # that produced an APK -- said at this point, a row that failed to
        # compile would still advise the reader how to install an artifact that
        # does not exist.
        #
        # A stable identity is only reachable by persisting key material, and
        # there are exactly two ways: commit it -- a private key in the repo, no
        # -- or add a repository secret and base64 it in here, the way
        # MACOS_SIGNING_P12 is handled below. That is the change to make if
        # reinstalling ever becomes the annoyance macOS's location re-prompt is;
        # it is not wired up speculatively.
        #
        # The DN is deliberately *not* `CN=Android Debug`. Whoever inspects this
        # certificate should be able to see at a glance that it is neither a
        # release key nor a locally built debug APK.
        #
        # The password is in the clear on purpose and is not a secret: it guards
        # a keypair generated three lines above it and destroyed with the
        # container. Both files land on paths rustdar-android/android/.gitignore
        # already covers (`keystore.properties`, `*.jks`), so a stray `git add`
        # cannot carry either of them.
        #
        # `$JAVA_HOME/bin/keytool`, not bare `keytool` -- but not because bare
        # `keytool` is missing. It resolves perfectly well here, through
        # /usr/bin/keytool -> /etc/alternatives/keytool. That *is* the reason:
        # what PATH offers is Debian's `alternatives` symlink, which points at
        # whichever JDK the image last selected, while Gradle and AGP run under
        # JAVA_HOME. Today both land on the same JDK 21. Naming JAVA_HOME is
        # what keeps the keystore written by the same JDK that reads it on the
        # day the image gains a second one.
        run: |
          cd rustdar-android/android
          # Idempotent by deletion. keytool refuses a second `-genkeypair` into
          # a keystore that already holds the alias ("Key pair not generated,
          # alias <ci> already exists"), which a GitHub-hosted runner never
          # reaches -- its workspace is new every time -- and which a
          # self-hosted one would hit on its second run. The keystore is
          # throwaway by construction, so throwing the old one away is the
          # entire fix.
          rm -f ci-signing.jks keystore.properties
          "$JAVA_HOME/bin/keytool" -genkeypair -v \
            -keystore ci-signing.jks -storetype PKCS12 \
            -alias ci -keyalg RSA -keysize 2048 -validity 10950 \
            -storepass rustdar-ci-throwaway -keypass rustdar-ci-throwaway \
            -dname "CN=rustdar CI, OU=throwaway signing key, O=rustdar, C=US"
          {
            echo "storeFile=ci-signing.jks"
            echo "storePassword=rustdar-ci-throwaway"
            echo "keyAlias=ci"
            echo "keyPassword=rustdar-ci-throwaway"
          } > keystore.properties

      - name: ${{ matrix.name }}
        run: ${{ matrix.cmd }}

      - name: Prove the APK is a signed, non-debuggable release
        if: matrix.package == 'android'
        # Run against the exact file that is about to be uploaded, not against
        # the build that produced it.
        #
        # `apksigner verify` on its own establishes only that the APK carries
        # *a* valid signature, which any stray keystore.properties would
        # satisfy just as well as the one the step above wrote. The DN grep is
        # what makes it *this* key: apksigner prints
        # `V2 Signer: certificate DN: CN=rustdar CI, OU=throwaway signing key,
        # O=rustdar, C=US` on stdout, so an APK signed by something unexpected
        # reddens the row instead of going out as though this workflow had
        # minted it. `OU=` rather than the whole DN, because the OU is the part
        # that says what the key is *for*.
        #
        # `application-debuggable` is the assertion that earns its keep.
        # `assembleRelease` is one word away from `assembleDebug`, both produce
        # an APK that installs and runs, and the difference is that one of them
        # is a debuggable process holding GPS fixes and cached configuration
        # that any app on the device can attach to. Nothing else in this file
        # would notice the substitution: aapt2 prints that line for a debug
        # build and prints nothing for a release one.
        #
        # The ABI line catches the other silent swap. A dropped or mistyped
        # `-PabiFilter` yields an APK carrying both libraries, which installs
        # perfectly well -- so both rows would go green while uploading the same
        # fat file under two different names. Comparing the whole line rather
        # than searching within it is what makes that fail: aapt2 lists every
        # ABI on it, so an extra one no longer matches.
        #
        # These two tools are taken from whatever build-tools is newest rather
        # than from the pinned 36.0.0 the step above installs, and that is the
        # point: AGP looks its build-tools up by exact version, while apksigner
        # and aapt2 are being used here as general-purpose readers of a finished
        # APK and any recent copy will do.
        run: |
          bt=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          apk='${{ matrix.artifact }}'

          certs=$("$bt/apksigner" verify --verbose --print-certs "$apk")
          printf '%s\n' "$certs"
          if ! printf '%s\n' "$certs" | grep -q 'OU=throwaway signing key'; then
            echo "::error::$apk carries a valid signature, but not from the throwaway key this workflow mints."
            exit 1
          fi

          badging=$("$bt/aapt2" dump badging "$apk")
          if printf '%s\n' "$badging" | grep -q '^application-debuggable'; then
            echo "::error::$apk is debuggable, so it is not the release build this row claims to ship."
            exit 1
          fi

          # `|| true` so that a missing line reaches the comparison below and is
          # reported, rather than killing the step on grep's exit status under
          # `set -e` with nothing said about why.
          got=$(printf '%s\n' "$badging" | grep '^native-code:' || true)
          want="native-code: '${{ matrix.abi }}'"
          if [ "$got" != "$want" ]; then
            echo "::error::expected exactly [$want] in $apk, got [$got]"
            exit 1
          fi
          echo "ok: signed by the throwaway key, not debuggable, $got"
          echo "::notice::${{ matrix.name }} is signed with a throwaway key that differs every run. Installing it over an earlier CI build fails with INSTALL_FAILED_UPDATE_INCOMPATIBLE; run 'adb uninstall dev.mcswain.rustdar' first."

      # Neither `curl` nor `zip` is in the image — every layer that installed
      # curl purged it in the same `RUN` — and `rcodesign` never was. The
      # signer is pinned by version *and* by digest: a tool fetched over the
      # wire and then trusted to sign our releases is not a tool, it is a
      # supply chain.
      - name: Install packaging tools
        if: matrix.package == 'macos'
        run: |
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends curl zip
          v=0.29.0
          base=apple-codesign-$v-x86_64-unknown-linux-musl
          curl -fsSL -o /tmp/rcodesign.tar.gz \
            "https://github.com/indygreg/apple-platform-rs/releases/download/apple-codesign%2F$v/$base.tar.gz"
          echo "dbe85cedd8ee4217b64e9a0e4c2aef92ab8bcaaa41f20bde99781ff02e600002  /tmp/rcodesign.tar.gz" \
            | sha256sum -c -
          tar -xzf /tmp/rcodesign.tar.gz -C /tmp
          install -m 0755 "/tmp/$base/rcodesign" /usr/local/bin/rcodesign
          rcodesign --version

      # `BIN=` rather than a second build: the row above has already compiled
      # exactly this binary for exactly this triple. `BIN=` names a path and
      # therefore also names a profile, so it is the one place in this file
      # where the shipped .app's optimization level is decided -- it must track
      # the row's own `--release`, or the bundle carries a binary the row did
      # not intend to ship.
      #
      # ── The secret this needs, which has to be created by hand ──
      #
      # `MACOS_SIGNING_P12`          base64 of a .p12 signing certificate
      # `MACOS_SIGNING_P12_PASSWORD` its password
      #
      # Generate them once, on any machine with rcodesign:
      #
      #   rcodesign generate-self-signed-certificate \
      #     --person-name rustdar --validity-days 3650 \
      #     --p12-file rustdar-signing.p12 --p12-password "$PW"
      #   base64 -w0 rustdar-signing.p12   # -> MACOS_SIGNING_P12
      #
      # **The same certificate must be reused for every run, forever.** macOS
      # remembers a location grant against the app's *designated requirement*,
      # which for a certificate-signed app pins the signing leaf. Minting a
      # fresh keypair per run — the obvious CI-friendly thing to do — produces
      # a new leaf, hence a new requirement, hence a new app as far as
      # `locationd` is concerned, and the user is asked for location again on
      # every single build. That is the exact failure this packaging exists to
      # prevent, so it must not be automated away. `--validity-days 3650`
      # rather than the 365 default for the same reason: an expiry is a forced
      # rotation, and a rotation costs every user one more prompt.
      #
      # Until the secret exists, and on every fork pull request (which never
      # gets secrets), packaging/macos/Makefile falls back to an **ad-hoc** signature.
      # That still launches on arm64 — it is a real signature — but its
      # designated requirement is the code hash, so it re-prompts on each
      # rebuild. The Makefile says so in the log; it is a labelled fallback,
      # not a silent one.
      - name: Package rustdar.app
        if: matrix.package == 'macos'
        env:
          MACOS_SIGNING_P12: ${{ secrets.MACOS_SIGNING_P12 }}
          MACOS_SIGNING_P12_PASSWORD: ${{ secrets.MACOS_SIGNING_P12_PASSWORD }}
        run: |
          make -C packaging/macos IN_CONTAINER=1 ARCHIVE=1 \
            ARCH=${{ matrix.macos_arch }} \
            BIN=target/${{ matrix.target }}/release/rustdar-platform

      - name: Upload native build
        if: matrix.artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.name }}
          path: ${{ matrix.artifact }}
          if-no-files-found: error

      # Uploaded on every run so a pull request proves the artifact assembles.
      # `deploy-pages` publishes this one; nothing is rebuilt there.
      - name: Upload Pages artifact
        if: matrix.pages
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist

  # The one required status check. `needs` on a matrix job aggregates every row,
  # and with `fail-fast: false` it is `success` only if all of them were --
  # `failure`, `cancelled` and `skipped` all fall through to the error.
  build-success:
    name: Build success check
    if: always()
    runs-on: ubuntu-24.04
    needs: [build]
    steps:
      - name: Fail unless every build row succeeded
        shell: bash
        env:
          RESULT: ${{ needs.build.result }}
        run: |
          echo "build matrix: $RESULT"
          test "$RESULT" = success || { echo "::error::the build matrix concluded '$RESULT'."; exit 1; }

  # `push` to `main` only: `pull_request` runs for forks, and `pages: write` /
  # `id-token: write` must not be reachable from an untrusted branch. A failed
  # build is the whole gate; a red test or lint does not stop shipping.
  # Its own job only for those permissions and the environment. Pages is enabled
  # by hand -- there is no `actions/configure-pages` -- so until it has been,
  # this 404s.
  deploy-pages:
    name: Deploy web build to GitHub Pages
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [build-success]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    # Not the workflow-level group, which cancels in progress. Cancelling a
    # deployment mid-flight half-publishes the site; queue instead.
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
