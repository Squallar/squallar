# The archive phase of a vector-tile build, and deliberately NOT a member of
# the squallar workspace.
#
# `[workspace]` below makes this directory its own workspace root. That is the
# entire exclusion mechanism: the root `Cargo.toml` has no `exclude` key and
# must not gain one, and this package must not be added to its `members`.
#
# The reason is a measured cost, not tidiness. Cargo resolves a *member's*
# optional and dev dependencies into the lockfile whether or not any feature
# activates them, where for a plain registry dependency it drops the ones no
# feature selects. `vendor/walkers/VENDORED.md:667` measures that on the
# walkers vendoring: **48 lockfile blocks for one compiled package**, because
# `geo`, `lyon_path`, `lyon_tessellation`, `mvt-reader`, `color`, `pmtiles`,
# `serde_json` and `approx` joined the walkers entry and dragged their own
# trees in. This is build-time tooling that never ships in the app, so it has
# no business widening the app's lockfile by that much.
#
# Consequences of standing outside, each of which this crate has to pay for
# itself:
#
#   - `cargo build/test/clippy --workspace` at the repo root does not select
#     it, and neither does root `cargo fmt --all -- --check`. Its gate is
#     `.github/workflows/tiler.yaml`, which runs all four `--manifest-path`-
#     scoped. Root CI would otherwise never compile this directory at all.
#   - Nothing here inherits. `version`, `edition` and every dependency are
#     spelled literally; `workspace = true` cannot resolve from a workspace
#     root to itself.
#   - Any third-party dependency added later is hand-pinned `=x.y.z` to the
#     exact version the root's `[workspace.dependencies]` pins, with a comment
#     saying so, so the two graphs cannot silently diverge on a shared crate.
#
# Nothing in the app may depend on this crate. The basemap migration ships on
# planetiler's output; this pipeline is swapped underneath later.
#
# The precedent's warning applies here too and is worth repeating: a tool that
# becomes a build-time step producing a shipped artifact should move to a
# harness branch or a release job. The tiler will produce a shipped artifact.
# `tools/nws-zone-pack` does as well, and the answer there was a dedicated
# workflow rather than workspace membership. Do not add this to the root
# `members` list without that decision being re-made.
[workspace]

[package]
name = "squallar-tiler"
version = "0.1.0"
edition = "2024"
publish = false

# Empty on purpose. The skeleton implements nothing, so it needs nothing, and a
# dependency listed before the code that uses it is a pin nobody is checking.
# Each one arrives with the phase that needs it -- an MVT encoder, a gzip
# backend, a PMTiles writer -- hand-pinned as the block above describes.
[dependencies]

[profile.release]
opt-level = 3
debug = false
