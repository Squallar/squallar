# NMEA parsing and the serial-port transport — one provider of
# rustdar_location::Fix. Ceiling held by tests/charter.rs.
[package]
name = "rustdar-nmea-serial"
version.workspace = true
edition.workspace = true

[features]
default = ["serial"]
serial = ["dep:serialport"]

[dependencies]
rustdar-location = { workspace = true }
chrono = { workspace = true }
log = { workspace = true }
nmea = "=0.8.0"
serde = { workspace = true }
serialport = { version = "=4.9.0", optional = true }

[dev-dependencies]
serde_json = { workspace = true }
