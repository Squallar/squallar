[package]
name = "rustdar-radar"
version.workspace = true
edition.workspace = true

[dependencies]
chrono = { workspace = true }
log = { workspace = true }
rustdar-units = { workspace = true }
serde = { workspace = true }
nexrad-data = { workspace = true }
nexrad-model = { workspace = true }
nexrad-decode = { workspace = true }
nexrad-level3 = { workspace = true }
rayon = "=1.12.0"
reqwest = { workspace = true, features = ["rustls-tls"] }
thiserror = { workspace = true }

[target.'cfg(target_os = "android")'.dependencies]
# Force vendored OpenSSL for Android builds to avoid cross-compilation issues
openssl-sys = { workspace = true }
