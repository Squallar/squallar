[package]
name = "rustdar-radar"
version = "0.1.0"
edition = "2024"

[dependencies]
chrono = "0.4.42"
log = "0.4.28"
nexrad-data = { version = "=1.0.0-rc.5", features = ["aws"] }
nexrad-model = "=1.0.0-rc.2"
nexrad-decode = "=1.0.0-rc.3"
nexrad-level3 = { path = "../nexrad-level3" }
rayon = "1.10"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
thiserror = "2"

[target.'cfg(target_os = "android")'.dependencies]
# Force vendored OpenSSL for Android builds to avoid cross-compilation issues
openssl-sys = { version = "0.9", features = ["vendored"] }
