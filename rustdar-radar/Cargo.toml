[package]
name = "rustdar-radar"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["staticlib", "cdylib", "rlib"]

[dependencies]
chrono = "0.4.42"
log = "0.4.28"
nexrad = { version = "0.0.3", features = ["download"] }

[target.'cfg(target_os = "android")'.dependencies]
# Force vendored OpenSSL for Android builds to avoid cross-compilation issues
openssl-sys = { version = "0.9", features = ["vendored"] }
