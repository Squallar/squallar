[package]
name = "rustdar-radar"
version.workspace = true
edition.workspace = true

[dependencies]
chrono = { workspace = true }
log = { workspace = true }
rustdar-units = { workspace = true }
serde = { workspace = true }
nexrad-data = { workspace = true }
nexrad-model = { workspace = true }
nexrad-decode = { workspace = true }
nexrad-level3 = { workspace = true }
reqwest = { workspace = true }
thiserror = { workspace = true }
# ListObjectsV2 response parsing in `archive`. Pure Rust (xml-rs).
xml = "=1.3.0"

# `tls` installs the process-wide *ring* provider here: this is the lowest crate
# in the graph that reaches a TLS handshake.
#
# Off on wasm32: reqwest goes through the browser's `fetch()` there, so pulling
# rustls in would add `ring` -- the workspace's one C dependency -- for nothing.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
rustls = { workspace = true }
# wasm32-unknown-unknown is single-threaded: rayon compiles there but cannot
# build a pool. `render.rs` carries a sequential fallback for the web arm.
rayon = "=1.12.0"

# Gated, not plain `[dev-dependencies]`: `rt-multi-thread` is not one of the
# features tokio accepts on wasm, and `--all-targets` builds dev-deps too, so an
# ungated entry breaks `cargo check --target wasm32-unknown-unknown`.
[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
