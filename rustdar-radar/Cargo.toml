[package]
name = "rustdar-radar"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["staticlib", "cdylib", "rlib"]

[dependencies]
chrono = "0.4.42"
log = "0.4.28"
nexrad-data = { version = "0.2.0", features = ["aws"] }
nexrad-model = "0.1.0"
nexrad-decode = "0.1.1"

[target.'cfg(target_os = "android")'.dependencies]
# Force vendored OpenSSL for Android builds to avoid cross-compilation issues
openssl-sys = { version = "0.9", features = ["vendored"] }
