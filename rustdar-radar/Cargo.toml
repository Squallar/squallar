[package]
name = "rustdar-radar"
version.workspace = true
edition.workspace = true

[dependencies]
chrono = { workspace = true }
log = { workspace = true }
rustdar-units = { workspace = true }
serde = { workspace = true }
# Open-Meteo sounding responses in `sounding`.
serde_json = { workspace = true }
nexrad-data = { workspace = true }
nexrad-model = { workspace = true }
nexrad-decode = { workspace = true }
nexrad-level3 = { workspace = true }
reqwest = { workspace = true }
thiserror = { workspace = true }
# ListObjectsV2 response parsing in `archive`. Pure Rust (xml-rs).
xml = "=1.4.0"

# `tls` installs the process-wide *ring* provider here: this is the lowest crate
# in the graph that reaches a TLS handshake.
#
# Off on wasm32: reqwest goes through the browser's `fetch()` there, so pulling
# rustls in would add `ring` -- the workspace's one C dependency -- for nothing.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
rustls = { workspace = true }
# wasm32-unknown-unknown is single-threaded: rayon compiles there but cannot
# build a pool. `par.rs` is the crate's one prelude for both arms — rayon here,
# sequential stand-ins on the web — and is why this dependency is target-gated
# rather than plain.
rayon = "=1.12.0"
# Fans `volume::File::scan()`'s per-LDM-record decompress-and-decode across the
# pool (upstream's `volume/file.rs`: `into_par_iter` with the feature, plain
# `into_iter` without). A super-res volume is 50–130 independently compressed
# records, so the granularity is nearly perfect, and the feature changes only
# *where* the records are decoded — the map is order-preserving and the results
# are recombined in record order either way, so the `Scan` is identical.
#
# Target-gated for rayon's reason, not its own: the feature's only effect is to
# pull rayon in, and rayon cannot build a pool in the browser.
#
# **This is not the application's decode path**, and the entry is worth no more
# than it says. `scan::decoded` walks the records itself in one pass, because it
# has to read each Message 31's declared Nyquist velocity before `into_radial`
# throws it away; that walk is where a downloaded volume actually goes and it is
# still serial. What this reaches is `File::scan()` — the upstream oracle
# `scan::tests` pins that one-pass walk against, and anything outside this crate
# that decodes a volume the ordinary way.
nexrad-data = { workspace = true, features = ["parallel"] }

# Gated, not plain `[dev-dependencies]`: `rt-multi-thread` is not one of the
# features tokio accepts on wasm, and `--all-targets` builds dev-deps too, so an
# ungated entry breaks `cargo check --target wasm32-unknown-unknown`.
[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
# The hail sanity harness re-runs `nexrad-level3`'s whole-file zlib strip on
# raw NHI objects to reach their Tabular Alphanumeric Block.
flate2 = { workspace = true }
