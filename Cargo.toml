[workspace]
resolver = "2"
members = [
    "rustdar-platform",
    "rustdar-android",
    "rustdar-android-theme",
    "rustdar-egui",
    "rustdar-radar",
    "rustdar-overlays",
    "rustdar-units",
    "rustdar-gps",
    "nexrad-level3",
]

[workspace.package]
version = "0.1.0"
edition = "2024"

[profile.dev]
# Only optimize dependencies (not workspace code) to preserve debuggability
strip = true

[profile.dev.package."*"]
opt-level = "s"

[profile.release]
strip = true
opt-level = 3
lto = true
