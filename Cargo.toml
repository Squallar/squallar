[workspace]
resolver = "2"
members = [
    "rustdar",
    "rustdar-app",
    "rustdar-device-profile",
    "rustdar-worker",
    "rustdar-gpu",
    "rustdar-volumetric",
    "rustdar-web",
    "rustdar-egui",
    "rustdar-radar",
    "rustdar-netcdf",
    "rustdar-overlays",
    "rustdar-source",
    "rustdar-geo",
    "rustdar-kv",
    "rustdar-units",
    "rustdar-location",
    "rustdar-nmea-serial",
    "nexrad-level3",
    # A vendored crates.io crate, and a member rather than an `exclude` on
    # purpose: its own test targets and its 15 in-source snapshot suites are
    # the WSR-88D behaviour pin that the decode patch has to leave untouched,
    # and they only run if `cargo test --workspace` selects them. See
    # vendor/nexrad-decode/VENDORED.md and `[patch.crates-io]` below.
    "vendor/nexrad-decode",
    # The second vendored crates.io crate, a member for the same reason: its
    # `malformed_records` and `error_handling` targets are the negative pin on
    # `Record::decompress`, which is the function this copy exists to change,
    # and they only run if `cargo test --workspace` selects them. See
    # vendor/nexrad-data/VENDORED.md and `[patch.crates-io]` below.
    "vendor/nexrad-data",
    # The third vendored crates.io crate, and the only one that is not patched
    # over a registry copy -- nothing else in the graph resolves the name, so
    # `vendor/nexrad-data` depends on it by path and there is no
    # `[patch.crates-io]` entry to write. A member for the same reason as the
    # other two: its `decode_reader` and `parallel_decode_reader` targets are
    # upstream's own behaviour pin on the decoder that `Record::decompress`
    # now runs, and they only run if `cargo test --workspace` selects them.
    # See vendor/bzip2-rs/VENDORED.md.
    "vendor/bzip2-rs",
]

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
nexrad-level3 = { path = "nexrad-level3" }
rustdar-app = { path = "rustdar-app" }
rustdar-device-profile = { path = "rustdar-device-profile" }
rustdar-egui = { path = "rustdar-egui" }
rustdar-geo = { path = "rustdar-geo" }
rustdar-gpu = { path = "rustdar-gpu" }
rustdar-kv = { path = "rustdar-kv" }
rustdar-netcdf = { path = "rustdar-netcdf" }
rustdar-overlays = { path = "rustdar-overlays" }
rustdar-radar = { path = "rustdar-radar" }
rustdar-source = { path = "rustdar-source" }
rustdar-units = { path = "rustdar-units" }
rustdar-volumetric = { path = "rustdar-volumetric" }
rustdar-web = { path = "rustdar-web" }
rustdar-worker = { path = "rustdar-worker" }
rustdar-location = { path = "rustdar-location", default-features = false }
rustdar-nmea-serial = { path = "rustdar-nmea-serial", default-features = false }

egui = "=0.35.0"
egui-wgpu = { version = "=0.35.0", default-features = false }
egui-winit = { version = "=0.35.0", default-features = false }
walkers = "=0.56.0"

ewebsock = { version = "=0.8.0", default-features = false, features = ["tls"] }
web-time = "=1.1.0"
wgpu = { version = "=29.0.4", default-features = false }
winit = "=0.30.13"

# IEEE 754 binary16, for the volume grid's texel encoder.
# `volume::VOLUME_TEXTURE_FORMAT` is `Rg16Float` and the host has to write its
# bytes; Rust's own `f16` is still nightly-only.
#
# Adds no package and no build time: naga already pulls this exact version in
# through wgpu-core, so every target that compiles `rustdar-app` was
# already compiling it. Pinned like the rest, and `default-features = false`
# keeps `std`'s float-formatting arm out — the encoder needs the conversions
# and nothing else.
half = { version = "=2.7.1", default-features = false }

# A **dev**-only, direct handle on the shader compiler wgpu already contains,
# pinned to the exact version wgpu-29.0.4 resolves. `rustdar-app`'s
# `tests/volume_shader.rs` translates the volume raymarch to GLSL ES 300 with
# it, so that what a WebGL2 browser will be handed is checked on every CI row
# rather than only in a browser nobody runs in CI.
#
# It cannot be reached through `wgpu::naga`: that re-export is behind wgpu's
# `naga-ir` feature, which is off. And `naga/glsl-out` arrives only via
# `wgpu-hal`'s `gles` backend, which this workspace requests on
# Windows/Linux/Android/FreeBSD but **not** on Apple targets — Metal takes
# `msl-out` alone. So depending on it indirectly would fail the four macOS and
# iOS CI rows, which build `--all-targets`. Naming it here with the features
# spelled out makes it target-independent.
#
# Adds no package: naga is already in the graph via wgpu-core. Under
# `resolver = "2"` the extra features do not reach a plain `cargo build`,
# because dev-dependencies are not resolved for one.
naga = { version = "=29.0.4", default-features = false, features = [
    "wgsl-in",
    "glsl-out",
] }

nexrad-data = { version = "=1.0.0-rc.7", default-features = false, features = [
    "nexrad-model",
] }
nexrad-decode = "=1.0.0-rc.3"
nexrad-model = "=1.0.0-rc.2"

chrono = "=0.4.45"
iana-time-zone = "=0.1.65"
flate2 = "=1.1.9"

jni = "=0.22.4"
log = "=0.4.34"

pollster = "=1.0.1"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
thiserror = "=2.0.20"
tokio = "=1.53.1"

reqwest = { version = "=0.13.4", default-features = false, features = [
    "rustls-no-provider",
    "charset",
    "http2",
    "system-proxy",
] }

rustls = { version = "=0.23.43", default-features = false, features = ["ring", "std"] }

# The published nexrad-decode cannot read a TDWR volume, so this workspace
# builds against a copy it owns.
#
# The defect is one line of framing. `decode_messages` accepts wherever the
# Message 31 body parser happened to stop instead of the end the message
# header declared. WSR-88D pads its bodies to nothing, so the two agree and
# rc.3 is accidentally correct; TDWR pads every radial to an 8-byte boundary,
# so each message leaves 4-7 bytes of slack, the next header is read out of
# that padding, and the record never resyncs -- byte-verified on
# TPIT20260810_000139_V08: 328 warnings and 782 garbage messages before,
# 48/48 records x 120/120 radials and zero warnings after. Nothing else in
# this tree can fix it: both ingest paths reach the decoder through
# nexrad-data, and there is no seam to work around it in.
#
# Vendored rather than forked because a git dependency would put this
# workspace's build on somebody's branch surviving; vendored rather than
# pinned-and-waited because 1.0.0-rc.3 is the newest published version and
# upstream `main` still has the identical logic. The fix is meant to go
# upstream -- VENDORED.md carries the diff list and the PR placeholder -- and
# this patch entry is meant to be deleted the day a release contains it.
#
# `[patch]` and not a direct path dependency, because nexrad-data (=1.0.0-rc.7)
# depends on nexrad-decode itself, with a caret requirement that 1.0.0-rc.3
# satisfies. A path dependency would leave *two* nexrad-decodes in the graph:
# ours for this workspace's own calls, the registry's for everything reached
# through nexrad-data -- which is most of the decoding, so the bug would still
# be live. Patching the source redirects both. `[workspace.dependencies]`
# above keeps its exact `=1.0.0-rc.3` pin and the vendored `package.version`
# stays exactly `1.0.0-rc.3` (no `+local` metadata), because a patch is only
# accepted for a version that satisfies the requirement it replaces.
#
# Visible in Cargo.lock as the nexrad-decode entry losing its `source` and
# `checksum` lines. `cargo tree -i nexrad-decode` must keep printing exactly
# one node, and that node must name the path.
# `Record::decompress` will decompress an LDM record to any size at all, and
# every byte reaching it was downloaded from an S3 bucket.
#
# That is the whole reason this directory exists. `read_to_end` on a
# `BzDecoder` reads until the stream ends, a bzip2 stream does not declare its
# decompressed size, and real records in the archive expand as much as 1,363:1
# -- so a small compressed record implies nothing about the memory its
# decompression will take, and a corrupt or hostile one is an out-of-memory
# abort with nothing in between. On the parallel decode path it is one per
# worker at once. The fork buys a 16 MiB ceiling and a clean `Err`, and it
# would be worth having if it bought nothing else.
#
# It does buy a little else, and the honest size of it is: pre-sizing the
# output buffer instead of growing it from nothing is -0.039% instructions,
# -86% reallocations, and -5.3% peak RSS at 32 threads. Free, real, and small.
# It does not on its own justify a fork; the ceiling does.
#
# What it deliberately does *not* buy is the big number. 91.6% of the bytes
# this function allocates are libbzip2's 3,600,000-byte `tt` array, one per
# record, and removing it needs a decompressor reused across records -- which
# bzip2 0.6.1 has no API for, at any version. VENDORED.md carries that
# evidence, the bound's derivation, the measurements and their method, and the
# PR placeholder.
#
# Vendored rather than forked because a git dependency would put this
# workspace's build on somebody's branch surviving; vendored rather than
# pinned-and-waited because 1.0.0-rc.7 is the newest published version.
#
# `[patch]` and not a direct path dependency, for the same reason as
# nexrad-decode above and one more. nexrad-data is reached from four crates
# here, and a path dependency would leave the registry copy in the graph for
# anything that still resolved it by version -- including, awkwardly, whatever
# nexrad-decode's own dev-dependencies pull. Patching the source redirects
# every path to one crate. `[workspace.dependencies]` keeps its exact
# `=1.0.0-rc.7` pin and the vendored `package.version` stays exactly
# `1.0.0-rc.7` (no `+local` metadata), because a patch is only accepted for a
# version that satisfies the requirement it replaces.
#
# The two patches interact: nexrad-data depends on nexrad-decode with a caret
# requirement, so the vendored nexrad-data resolves to the vendored
# nexrad-decode and there is still exactly one of each. `cargo tree -i
# nexrad-decode` and `cargo tree -i nexrad-data` must each keep printing one
# node, and both nodes must name a path.
[patch.crates-io]
nexrad-decode = { path = "vendor/nexrad-decode" }
nexrad-data = { path = "vendor/nexrad-data" }

# File and line in every frame, and nothing beyond it. A backtrace, a panic
# location and a `#[track_caller]` frame are all line-table lookups, so each
# one still names a source position exactly as before; what leaves is the
# variable and type description, which is only read by a debugger somebody has
# attached on purpose.
#
# Not a rounding error, and the reason this is worth a setting:
# `target/debug/` app binary (the platform crate, renamed `rustdar` at the
# fold) was 604,417,120 bytes, of which 538,194,467
# was DWARF and 25,730,465 was `.text`. Nine tenths of the file described a
# program that is one twentieth of it. With line tables the same binary is
# 234,889,824 bytes.
[profile.dev]
debug = "line-tables-only"

# Only optimize dependencies (not workspace code) to preserve debuggability.
# Stepping through this workspace's own crates has to keep working; nobody
# debugs a dev build by stepping into wgpu.
#
# Read that together with `debug` above, which is line tables for the whole
# graph, workspace crates included: stepping and breakpoints still work here,
# but inspecting a local is gone with the DWARF that described it. The
# developer this override exists for is exactly the one who will miss it, so
# the escape hatch is `RUSTFLAGS=-Cdebuginfo=2 cargo build` for the session
# that needs variables back.
#
# `2` and not `"s"`, because that sentence says debuggability and says nothing
# about size. `"s"` asks LLVM to give up speed for bytes — a trade this
# override was never making, since a dependency here is compiled to be *run*
# during development and `target/` is under no size budget. `2` is the same
# pass pipeline at the inlining and vectorization thresholds that make it fast.
# It is not a compile-time regression either: with both settings in place a
# cold dev build of the app crate (`rustdar` today) — all 449 crates —
# went 44.6 s to 38.4 s,
# because the debug info that no longer has to be emitted and linked costs more
# than the extra optimization does.
[profile.dev.package."*"]
opt-level = 2

# `"*"` above means "every package that is not a workspace member", so the
# moment nexrad-decode became a member it fell out of that override and back to
# opt-level 0. It is not workspace code in any sense that matters -- nobody
# steps through a vendored byte parser -- and it is the hottest loop in a dev
# run: every radial of every record of every volume goes through it. Naming it
# here puts it back where it was as a plain dependency.
#
# Delete this together with the `[patch.crates-io]` entry above.
[profile.dev.package.nexrad-decode]
opt-level = 2

# Same story, and if anything more so: `Record::decompress` is where a dev run
# spends most of its decode, and at opt-level 0 the bzip2 inner loop is not a
# hot loop, it is a stall. Naming it here puts it back where it was as a plain
# dependency.
#
# Delete this together with the `[patch.crates-io]` entry above.
[profile.dev.package.nexrad-data]
opt-level = 2

# And the crate that decompression is now *actually* spent in. `Record::decompress`
# is a dozen lines of framing around a Huffman decoder and an inverse
# Burrows-Wheeler transform that live here; at opt-level 0 those are the stall.
# Naming it here puts it where `libbz2-rs-sys` -- a plain non-member dependency,
# and so covered by the `"*"` override above -- already was.
#
# Delete this together with `vendor/bzip2-rs/`.
[profile.dev.package.bzip2-rs]
opt-level = 2

[profile.release]
strip = true
opt-level = 3
lto = true
