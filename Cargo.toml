[workspace]
resolver = "2"
members = [
    "rustdar-platform",
    "rustdar-android",
    "rustdar-android-theme",
    "rustdar-egui",
    "rustdar-radar",
    "rustdar-overlays",
    "rustdar-units",
    "rustdar-gps",
    "nexrad-level3",
]

[workspace.package]
version = "0.1.0"
edition = "2024"

# Single source of truth for every version pin shared by more than one member,
# plus the whole UI stack. egui, egui-wgpu, egui-winit, walkers and wgpu MUST be
# bumped together: walkers pins an exact egui minor, and egui-wgpu/egui-winit
# only ever match their own egui. Keeping them here makes that lockstep visible
# and stops a member from drifting onto a second copy of egui.
[workspace.dependencies]
# -- internal crates --
nexrad-level3 = { path = "nexrad-level3" }
rustdar-android-theme = { path = "rustdar-android-theme" }
rustdar-egui = { path = "rustdar-egui" }
rustdar-overlays = { path = "rustdar-overlays" }
rustdar-platform = { path = "rustdar-platform" }
rustdar-radar = { path = "rustdar-radar" }
rustdar-units = { path = "rustdar-units" }
# Defaults off here because Cargo silently ignores a member's
# `default-features = false` when the workspace entry leaves defaults on, and
# rustdar-egui declares exactly that. rustdar-platform and rustdar-android opt
# the serial reader back in with `features = ["serial"]` — including on Android,
# where serialport does build and is in the shipped aarch64 graph.
rustdar-gps = { path = "rustdar-gps", default-features = false }

# -- UI stack (bump as a unit) --
egui = "=0.35.0"
egui-wgpu = "=0.35.0"
# Defaults off: rustdar-platform picks its own backend/clipboard feature set.
egui-winit = { version = "=0.35.0", default-features = false }
walkers = "=0.56.0"
wgpu = "=29.0.4"
winit = "=0.30.13"

# -- NEXRAD decoding --
nexrad-data = { version = "=1.0.0-rc.7", features = ["aws"] }
nexrad-decode = "=1.0.0-rc.3"
nexrad-model = "=1.0.0-rc.2"

# -- shared third-party --
chrono = "=0.4.45"
flate2 = "=1.1.9"
jni = "=0.22.4"
# egui 0.35 requires ^0.4.33.
log = "=0.4.33"
ndk-context = "=0.1.1"
pollster = "=0.4.0"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
thiserror = "=2.0.19"
tokio = "=1.53.1"
# Members differ on the TLS backend, so defaults are off here and every member
# spells out what it wants (`default` == reqwest's own default feature set).
reqwest = { version = "=0.12.24", default-features = false }
# Android needs a vendored OpenSSL; the NDK sysroot has no usable system copy.
openssl-sys = { version = "=0.9.117", features = ["vendored"] }

[profile.dev]
# Only optimize dependencies (not workspace code) to preserve debuggability
strip = true

[profile.dev.package."*"]
opt-level = "s"

[profile.release]
strip = true
opt-level = 3
lto = true
