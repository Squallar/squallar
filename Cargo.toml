[workspace]
resolver = "2"
members = [
    "rustdar-platform",
    "rustdar-frontend",
    "rustdar-web",
    "rustdar-android",
    "rustdar-egui",
    "rustdar-radar",
    "rustdar-overlays",
    "rustdar-units",
    "rustdar-gps",
    "nexrad-level3",
]

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
nexrad-level3 = { path = "nexrad-level3" }
rustdar-egui = { path = "rustdar-egui" }
rustdar-frontend = { path = "rustdar-frontend" }
rustdar-overlays = { path = "rustdar-overlays" }
rustdar-platform = { path = "rustdar-platform" }
rustdar-radar = { path = "rustdar-radar" }
rustdar-units = { path = "rustdar-units" }
rustdar-web = { path = "rustdar-web" }
rustdar-gps = { path = "rustdar-gps", default-features = false }

egui = "=0.35.0"
egui-wgpu = { version = "=0.35.0", default-features = false }
egui-winit = { version = "=0.35.0", default-features = false }
walkers = "=0.56.0"

ewebsock = { version = "=0.8.0", default-features = false, features = ["tls"] }
web-time = "=1.1.0"
wgpu = { version = "=29.0.4", default-features = false }
winit = "=0.30.13"

# IEEE 754 binary16, for the volume grid's texel encoder.
# `volume::VOLUME_TEXTURE_FORMAT` is `Rg16Float` and the host has to write its
# bytes; Rust's own `f16` is still nightly-only.
#
# Adds no package and no build time: naga already pulls this exact version in
# through wgpu-core, so every target that compiles `rustdar-frontend` was
# already compiling it. Pinned like the rest, and `default-features = false`
# keeps `std`'s float-formatting arm out — the encoder needs the conversions
# and nothing else.
half = { version = "=2.7.1", default-features = false }

# A **dev**-only, direct handle on the shader compiler wgpu already contains,
# pinned to the exact version wgpu-29.0.4 resolves. `rustdar-frontend`'s
# `tests/volume_shader.rs` translates the volume raymarch to GLSL ES 300 with
# it, so that what a WebGL2 browser will be handed is checked on every CI row
# rather than only in a browser nobody runs in CI.
#
# It cannot be reached through `wgpu::naga`: that re-export is behind wgpu's
# `naga-ir` feature, which is off. And `naga/glsl-out` arrives only via
# `wgpu-hal`'s `gles` backend, which this workspace requests on
# Windows/Linux/Android/FreeBSD but **not** on Apple targets — Metal takes
# `msl-out` alone. So depending on it indirectly would fail the four macOS and
# iOS CI rows, which build `--all-targets`. Naming it here with the features
# spelled out makes it target-independent.
#
# Adds no package: naga is already in the graph via wgpu-core. Under
# `resolver = "2"` the extra features do not reach a plain `cargo build`,
# because dev-dependencies are not resolved for one.
naga = { version = "=29.0.4", default-features = false, features = [
    "wgsl-in",
    "glsl-out",
] }

nexrad-data = { version = "=1.0.0-rc.7", default-features = false, features = [
    "nexrad-model",
] }
nexrad-decode = "=1.0.0-rc.3"
nexrad-model = "=1.0.0-rc.2"

chrono = "=0.4.45"
iana-time-zone = "=0.1.65"
flate2 = "=1.1.9"

jni = "=0.22.4"
log = "=0.4.33"

pollster = "=1.0.1"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
thiserror = "=2.0.20"
tokio = "=1.53.1"

reqwest = { version = "=0.13.4", default-features = false, features = [
    "rustls-no-provider",
    "charset",
    "http2",
    "system-proxy",
] }

rustls = { version = "=0.23.43", default-features = false, features = ["ring", "std"] }

# File and line in every frame, and nothing beyond it. A backtrace, a panic
# location and a `#[track_caller]` frame are all line-table lookups, so each
# one still names a source position exactly as before; what leaves is the
# variable and type description, which is only read by a debugger somebody has
# attached on purpose.
#
# Not a rounding error, and the reason this is worth a setting:
# `target/debug/rustdar-platform` was 604,417,120 bytes, of which 538,194,467
# was DWARF and 25,730,465 was `.text`. Nine tenths of the file described a
# program that is one twentieth of it. With line tables the same binary is
# 234,889,824 bytes.
[profile.dev]
debug = "line-tables-only"

# Only optimize dependencies (not workspace code) to preserve debuggability.
# Stepping through this workspace's own crates has to keep working; nobody
# debugs a dev build by stepping into wgpu.
#
# Read that together with `debug` above, which is line tables for the whole
# graph, workspace crates included: stepping and breakpoints still work here,
# but inspecting a local is gone with the DWARF that described it. The
# developer this override exists for is exactly the one who will miss it, so
# the escape hatch is `RUSTFLAGS=-Cdebuginfo=2 cargo build` for the session
# that needs variables back.
#
# `2` and not `"s"`, because that sentence says debuggability and says nothing
# about size. `"s"` asks LLVM to give up speed for bytes — a trade this
# override was never making, since a dependency here is compiled to be *run*
# during development and `target/` is under no size budget. `2` is the same
# pass pipeline at the inlining and vectorization thresholds that make it fast.
# It is not a compile-time regression either: with both settings in place a
# cold dev build of `rustdar-platform` — all 449 crates — went 44.6 s to 38.4 s,
# because the debug info that no longer has to be emitted and linked costs more
# than the extra optimization does.
[profile.dev.package."*"]
opt-level = 2

[profile.release]
strip = true
opt-level = 3
lto = true
