# Building footprints out of MVT bytes, triangulated and extruded into prisms.
#
# Its own crate for the reason `squallar-elevation` is one: all of it runs
# inside the offload worker, which links neither egui, wgpu nor winit, and
# `tests/charter.rs` holds that as a ceiling on the declared set AND as a walk
# of the resolved graph.
#
# The second reason is the one that decided WHICH crate: the triangulator and
# the tile parser had to be declared somewhere, and `squallar-elevation`'s
# charter is a Terrain-RGB decoder's charter. Landing lyon and mvt-reader there
# would have made every `cargo test -p squallar-elevation` link a tessellator
# for nothing, and would have made that crate's own one-sentence reason to
# exist false.
[package]
name = "squallar-buildings"
version.workspace = true
edition.workspace = true

[dependencies]
# The MVT decoder, taken DIRECTLY and never through `vendor/walkers`.
#
# walkers reaches this exact package behind its `mvt` feature, but walkers is
# an egui widget: depending on it would put egui in this crate's resolved
# graph, which is the one property `tests/charter.rs` exists to forbid. It
# would also not have helped -- `ParsedTile::layers` is private and
# `ParsedLayer`/`ParsedFeature` are private structs, so walkers' public surface
# has no accessor for a feature's geometry or its property bag. See
# `src/footprint.rs` for the full ruling.
#
# Adds NO package to the resolved graph: this is the version walkers' `2.1.0`
# requirement already resolves to, and `squallar-egui` enables `mvt`
# unconditionally.
mvt-reader = "=2.4.0"

# `mvt_reader::feature::Feature::geometry` is a `geo_types::Geometry<T>`, so
# reading a footprint means naming the type it arrives in. Same version
# walkers and mvt-reader already agree on; no new package.
geo-types = "=0.7.19"

# The tessellator. `lyon_path` is NOT declared beside it: `lyon_tessellation`
# re-exports the whole of it as `lyon_tessellation::path`, so one line buys
# both and the charter carries one entry instead of two.
lyon_tessellation = "=1.0.20"

# The projection pair. `mercator_y_to_lat_rad` and `site_bearing_range_km` are
# the exact inverses of the two functions `squallar-elevation` builds the
# height field's posts with, so a building and the ground under it cannot
# disagree about where they are.
squallar-geo = { workspace = true }

# The job vocabulary, for `src/jobs.rs` only, and the same arrival
# `squallar-elevation` recorded: `JobCodec` is a `struct` and not a trait, so a
# registry row cannot be built without declaring the crate that defines it.
squallar-source = { workspace = true }

# So a refused parse and "there are no buildings here" are not the same
# observable. Free in graph terms -- `log` is already reachable through
# squallar-source -> reqwest -- so the whole cost is the line in
# `tests/charter.rs` beside this one.
log = { workspace = true }

[dev-dependencies]
# `tests/charter.rs` parses `cargo metadata` output to pin this crate's
# dependency ceiling and the resolved graph it is allowed to reach.
serde_json = { workspace = true }
