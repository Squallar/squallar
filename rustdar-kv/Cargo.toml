# The persistence floor: a three-method blob contract (load / store /
# store_now) over std -- string keys, string blobs, never load-bearing.
# `tests/charter.rs` holds the ceiling; a dependency lands here only after the
# charter in that test and the plan change first, in writing.
[package]
name = "rustdar-kv"
version.workspace = true
edition.workspace = true

# Empty on purpose, and pinned that way: the trait and its in-memory backend
# are std-only by charter.
[dependencies]

[dev-dependencies]
# `tests/charter.rs` parses `cargo metadata` output to pin this crate's
# (empty) dependency ceiling.
serde_json = { workspace = true }
