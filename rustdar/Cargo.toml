[package]
name = "rustdar"
version.workspace = true
edition.workspace = true

# The Android APK is built by Gradle, from `packaging/android/` -- package name,
# SDK levels, theme, permissions, configChanges, signing all live in its
# `app/build.gradle.kts` and `app/src/main/AndroidManifest.xml`.
# Build with:  cd packaging/android && ./gradlew assembleRelease

[[bin]]
name = "rustdar"
path = "src/main.rs"

[lib]
# `rustdar_native`, not `rustdar`: the bin above already owns that name, and a
# lib sharing it collides on Windows (https://github.com/rust-lang/cargo/issues/8519).
# The pre-rename lib name's `_lib` suffix guarded the same collision; with
# the rename the two names differ structurally, so no suffix convention is
# needed.
name = "rustdar_native"
# `cdylib` beside `rlib` because the cdylib IS the Android app: cargo-ndk ships
# it as `librustdar_native.so`, the library `android.app.lib_name` in
# packaging/android's manifest names and NativeActivity dlsym()s `android_main`
# out of. ACCEPTED COST (fold-in ruling, WO-RP-2): desktop
# `--workspace --all-targets` rows now also emit a dead .so/.dll/.dylib,
# ~1.8 MB per ABI -- exactly what the pre-fold comment here predicted when it
# kept the list rlib-only.
#
# iOS is unaffected: it needs a `staticlib`, and `packaging/ios/Makefile` asks
# for that per-build with `cargo rustc --crate-type staticlib`, which REPLACES
# this list rather than appending to it. Adding `staticlib` here instead would
# archive the whole graph on every desktop build and every `--all-targets`
# clippy run.
crate-type = ["rlib", "cdylib"]
path = "src/lib.rs"

[dependencies]
rustdar-frontend = { workspace = true }
rustdar-egui = { workspace = true }
rustdar-kv = { workspace = true }
# The domain vocabulary (Fix, LocationPermission). `serial` is requested per target below.
rustdar-location = { workspace = true }
# `GeoPoint`, which the android module's fix literal spells
# (`src/android/location.rs`). Unconditional rather than android-gated: the
# crate is already in every one of this package's graphs via rustdar-frontend,
# so gating it would buy nothing but a second copy of the `jni-typecheck`
# feature plumbing. (Import-forced; the fold order's dep list predates
# WO-RL-1's `point: rustdar_geo::GeoPoint` re-type.)
rustdar-geo = { workspace = true }
iana-time-zone = { workspace = true }
log = { workspace = true }
pollster = { workspace = true }
winit = { workspace = true }
env_logger = "=0.11.11"

[dev-dependencies]
# Both only for src/network_security_config.rs, which is `#[cfg(test)]`.
rustdar-radar = { workspace = true }
walkers = { workspace = true }

[target.'cfg(target_os = "android")'.dependencies]
android_logger = "=0.15.1"
# The JNI layer in `src/android/`. NB: no `ndk-context`. That module tree
# deliberately does not use it -- android-activity 0.6 registers
# `Activity.getApplication()` as the ndk_context "context" (0.5 registered the
# Activity), and `getWindow`, `moveTaskToBack` and `requestPermissions` are all
# Activity-only: reached through the Application they silently do nothing.
# `android_main` has the real Activity and stashes a global ref to it; see the
# `JAVA` static in src/android/mod.rs.
jni = { workspace = true }
# MUST stay on the major that reqwest resolves. reqwest 0.13.4 accepts
# `rustls-platform-verifier >=0.6.0, <0.8.0`, so 0.7.0 is the single copy today.
# Pinning this away from what reqwest resolves does not replace the verifier --
# it adds a second copy. `android::init_with_env` would then initialize one
# instance while every reqwest client keeps reading the other, uninitialized one,
# and Android TLS setup silently becomes a no-op. Nothing fails at build time;
# the first symptom is an HTTPS request failing on-device, which is exactly the
# api.weather.gov path the Network Security Config in `packaging/android/`
# exists to keep working. `cargo tree -i rustls-platform-verifier` must show
# exactly one root.
#
# The jni pin travels with it (0.7.x wants jni ^0.22) and is equally not to be
# taken alone -- see the `jni` entry in the workspace Cargo.toml. Both halves
# landed together in c213e46 + 634bfad; the `dep-unification` row in
# `.github/workflows/build.yaml` now guards the split.
#
# Its Kotlin half ships as an AAR inside the `rustls-platform-verifier-android`
# crate's registry checkout; `packaging/android/app/build.gradle.kts` locates
# that via `cargo metadata` and adds it as a Maven repo.
rustls-platform-verifier = "=0.7.0"
# A target-gated FEATURE addition on the normal `winit` dep above.
# native-activity, deliberately, not game-activity. GameActivity exists to provide
# mobile text input, which rustdar has none of, and it forces an AppCompat theme --
# which changes what getRootWindowInsets() reports, shifting the map's
# excluded_rects and breaking click hit-testing against overlays. It would also add
# a C++ build. Both backends hand `android_main` the same `AndroidApp`, so the
# Activity the JNI bridges reach through works either way; there is simply
# nothing to gain.
winit = { workspace = true, features = ["android-native-activity"] }

# Host-only, opt-in copy of the one dependency the JNI helpers need that is not
# already unconditional here. See the `jni-typecheck` feature below.
[target.'cfg(not(target_os = "android"))'.dependencies]
jni = { workspace = true, optional = true }

[features]
# Type-check the JNI layer on the *host*, with no NDK and no C toolchain.
#
# Everything in `src/android/` is behind `cfg(target_os = "android")` at the
# module mount in lib.rs, so a host `cargo check` compiles none of it -- which
# is how the jni 0.21->0.22 break once shipped green through Build, Clippy and
# Test. This feature widens that cfg so every android module *except*
# `android::entry` (which names winit's AndroidApp) compiles for the host,
# inside the full app graph, where rustc checks each `env.call_method`,
# `jni_sig!` and pointer wrap against the real jni API in seconds:
#
#     cargo check -p rustdar --features jni-typecheck
#
# One dep to add and nothing else: `jni` 0.22 is `default = []` and pure Rust,
# and everything else the android modules read -- log, rustdar-location,
# rustdar-geo, rustdar-frontend -- is already an unconditional dependency of
# this crate since the fold. It does not replace the cargo-ndk job:
# `android_main`, the winit Android backend and the linked `.so` are still only
# exercised there.
jni-typecheck = ["dep:jni"]

[target.'cfg(target_os = "windows")'.dependencies]
# The OS location provider in `src/os_location/windows.rs`.
#
# All four features are load-bearing: `Devices_Geolocation` alone fails to
# compile with `could not find 'Security' in 'windows'` and `unresolved import
# 'windows::System'`. `Foundation` is implied by each of the other three, and is
# named anyway as documentation of what `TypedEventHandler` and `Uri` come from.
# Do NOT add `default-features = false` — it drops the `std` plumbing the
# generated bindings need.
#
# Zero new *packages*: `wgpu-hal -> gpu-allocator` and `walkers -> cacache`
# already put `windows 0.62` in the graph, so this only widens which namespaces
# are generated. Verified to compile *and link* for `x86_64-pc-windows-gnullvm`;
# `windows-link` declares every extern `kind = "raw-dylib"` and the 0.62 graph
# has no `windows-targets` import-lib crates, so gnullvm has no `.lib` to miss.
windows = { version = "=0.62.2", features = [
    "Devices_Geolocation",
    "Security_Authorization_AppCapabilityAccess",
    "System",
    "Foundation",
] }

# CoreLocation, for `os_location/apple.rs`. One target block for both Apple
# platforms because it is one provider.
#
# `default-features = false` is not tidiness: the defaults pull 26 `CL*`
# modules plus `block2`, `dispatch2` and `objc2-contacts`, and the last two are
# in neither Apple graph today. With the lists below, `objc2-core-location` is
# the only new *compiled* package in either graph — `objc2` and
# `objc2-foundation` are already there via `arboard`, `wgpu-hal` and
# `objc2-ui-kit`.
#
# Version-pinned with `=` like every other dependency here. Note for anyone
# reaching for the `dep-unification` check: `objc2` resolves to two versions
# workspace-wide (0.5.2 under the older stack, 0.6.4 here), so a bare
# `cargo tree -i objc2` answers "specification is ambiguous". Spell the version
# — `objc2@0.6.4` — or check `objc2-core-location@0.3.2`, which is unique.
[target.'cfg(any(target_os = "macos", target_os = "ios"))'.dependencies]
objc2 = { version = "=0.6.4", default-features = false, features = ["std"] }
objc2-foundation = { version = "=0.3.2", default-features = false, features = [
    "alloc",
    "NSArray",
    "NSDate",
    "NSError",
    "NSString",
    "NSBundle",
    # `NSArray::iter()` is `#[cfg(feature = "NSEnumerator")]`, so without this
    # the `didUpdateLocations:` delegate method cannot walk its own argument.
    # The feature is `NSEnumerator = []`: no dependencies, no new package.
    "NSEnumerator",
] }
objc2-core-location = { version = "=0.3.2", default-features = false, features = [
    "std",
    "CLLocation",
    "CLLocationManager",
    "CLLocationManagerDelegate",
    # `CLError` is the enum; `kCLErrorDomain` — which is what says an error
    # code may be read as one — is a separate feature.
    "CLError",
    "CLErrorDomain",
] }

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
# Android's theme is a JNI call injected by the android module
# (`src/android/theme.rs`). iOS is excluded
# because `dark-light` 2.0's iOS arm returns `Mode::Light` unconditionally *and*
# returns `Mode`, not `Result<Mode>`, so it does not even typecheck here.
dark-light = "=2.0.0"
# `serialport` links IOKit, which iOS does not have -- that fails the link, not
# the compile, so only the .app build would have caught it. Features are
# additive across the graph, so this also keeps the port picker off mobile.
rustdar-egui = { workspace = true, features = ["gps-serial"] }
rustdar-nmea-serial = { workspace = true, features = ["serial"] }

[target.'cfg(target_os = "linux")'.dependencies]
# `org.freedesktop.portal.Location`, for `os_location/linux.rs`. **Zero new
# packages**: `dark-light` already puts ashpd 0.10.3 in this graph, and this
# crate's `zbus` is reached through ashpd's own re-export rather than named
# again here.
#
# The features are not tidiness, they are the whole reason this line is
# spelled out. `dark-light` asks for exactly `default-features = false,
# features = ["async-std"]`, and matching it is load-bearing: ashpd's default
# feature is `tokio`, which selects `zbus/tokio` *and* pulls `dep:tokio`.
# Features are additive across the graph, so taking the default here would
# union `zbus/tokio` into every Linux row -- recompiling `zbus` and
# `zbus_macros` with a larger surface on the linux, `standalone`, clippy-host
# and test rows, and adding a tokio runtime to a crate that starts no runtime.
# `async-std` selects `zbus/async-io`, which is what is already compiled.
#
# Measured, with `cargo tree -p rustdar --target
# x86_64-unknown-linux-gnu -e normal -f "{p} {f}"`: the graph is 437 packages
# before and after with an identical set, and zbus's own features **shrink**
# from `…,blocking,blocking-api,default,url` to `…,blocking,url`. Naming zbus
# directly is what used to turn `blocking-api` on; this provider is async and
# does not need it, so dropping the direct dependency hands that back.
#
# That also retires the `zbus = "=…"` pin this block used to carry, and the
# Renovate PRs that bumped it: nothing here constrains zbus any more, so it
# resolves to whatever `ashpd` asks for.
#
# NB the feature is named for async-std and does not pull it: it is
# `zbus/async-io` plus `async-fs`, `async-net` and `futures-util/io`. The
# provider drives its own futures with `futures_lite::future::block_on`; the
# `async-io` reactor those calls need starts itself on first use.
ashpd = { version = "=0.10.3", default-features = false, features = [
    "async-std",
] }
# `block_on` and `StreamExt::next` for the session thread, and `oneshot` for
# the cancellation the thread parks on. Both are already in this graph --
# futures-lite via `ashpd -> zbus/async-io -> async-io`, futures-channel as a
# direct dependency of `ashpd` -- and each resolves to exactly one version, so
# naming them adds **zero packages** and no second version constraint.
#
# Neither is an executor. `block_on` parks the calling thread on one future;
# nothing here spawns.
futures-lite = "=2.6.1"
futures-channel = "=0.3.34"
# For `Fix::timestamp`, which is a `chrono::NaiveDateTime` and arrives from
# the portal as epoch seconds. Already in the graph via `rustdar-location`;
# named here because this crate now converts one.
chrono = { workspace = true }
