# Apple deployment floors.
#
# `-[CLLocationManager authorizationStatus]` (the *instance* property) and
# `-locationManagerDidChangeAuthorization:` are both
# `API_AVAILABLE(ios(14.0), macos(11.0))`, and `os_location/apple.rs` calls
# both. Rust performs **no availability checking whatsoever**, so a build below
# the floor is not a warning and not an error — it links cleanly and then
# `doesNotRecognizeSelector:` at runtime, on the user's machine, with nothing
# having said a word at any earlier stage.
#
# `rustc --print deployment-target` in the CI image, measured:
#
#   aarch64-apple-darwin    11.0   ok
#   x86_64-apple-darwin     10.12  BELOW  <- the one this file exists for
#   aarch64-apple-ios       10.0   BELOW
#   aarch64-apple-ios-sim   14.0   ok
#
# Setting it here rather than in a CI `env:` block for two reasons. Bare
# `cargo check` and `cargo clippy` rows pick this up, and a developer's local
# `cargo build` does too — an `env:` in one workflow covers neither. And it
# cannot desync from `packaging/ios/Makefile`: `[env]` does not override a variable that
# is already set in the environment unless `force = true`, so the Makefile's
# own `export IPHONEOS_DEPLOYMENT_TARGET=$(IOS_MIN)` still wins during a real
# `.ipa` build, and `IOS_MIN` stays the single source of that number.
#
# `packaging/macos/Info.plist`'s `LSMinimumSystemVersion` and `packaging/ios/Info.plist`'s
# `MinimumOSVersion` must agree with these.
[env]
MACOSX_DEPLOYMENT_TARGET = "11.0"
IPHONEOS_DEPLOYMENT_TARGET = "14.0"

# Windows links its unwinder statically, or it does not start.
#
# `x86_64-pc-windows-gnullvm` links LLVM's unwinder as a SHARED library, so the
# exe carries an import for `libunwind.dll` — a file that exists only inside
# the llvm-mingw toolchain and on no Windows install anywhere. Measured on a
# clean Windows 10.0.26200 box: the shipped `windows-x86_64` artifact dies at
# the loader with `STATUS_DLL_NOT_FOUND` (0xC0000135), before one instruction,
# with zero bytes on stdout and stderr. It was the only non-system import of
# the 31 it had; `ucrtbase`, `opengl32` and `vcruntime140` were all present.
#
# That failure is invisible to every gate we own. CI builds this target and
# never runs it, so a `cargo build` that links cleanly is the whole signal, and
# a launch failure this total produces no log to notice. It shipped that way.
#
# `+crt-static` moves `-lunwind` inside the `-Wl,-Bstatic` region, so lld takes
# `libunwind.a` instead of `libunwind.dll.a`. Measured after the change: 32
# imports, every one a genuine Windows system DLL, and the exe boots and holds
# on real hardware from a directory containing nothing but itself. Two other
# spellings were tried and rejected — `-C link-self-contained=yes` fails to
# build, and `-static-libgcc` / `--unwindlib=libunwind` build but change
# nothing.
#
# A statically linked unwinder that cannot unwind would be worse than shipping
# the DLL, because it would fail only once something had already gone wrong.
# Verified on the same box that it does unwind: `catch_unwind` returns `Err`
# with its payload, a panic in a spawned thread makes `join()` return `Err`,
# and a four-frame unwind runs exactly four destructors — an abort runs none.
#
# The second flag removes a warning the first one causes. `+crt-static` makes
# rustc pass `-no-pie` to a clang that has no use for it, and the resulting
# `argument unused during compilation` reaches rustc's `linker_messages` lint.
# It is ONE diagnostic echoed per linked target, not a hundred problems:
# measured across `--all-targets`, a cold build emits 98 `warning:` lines from
# that single message, and 0 once this flag is set. `cargo build` tolerates it
# today and would stop the day anything puts `-D warnings` on this target.
# Suppressing the CAUSE is deliberate: `-A linker_messages` would also swallow
# genuine future linker messages, which is the one thing that lint is for.
#
# The zero is measured on a build that actually LINKS. A warm no-op finishes in
# 0.54 s and reports zero warnings whatever the flags say, because nothing was
# linked to warn about — so the confirming run was one that recompiled and
# relinked the binary, driven by this file with no `RUSTFLAGS` and no
# `CARGO_TARGET_*_RUSTFLAGS` anywhere in the environment.
#
# Here rather than in `build.yaml` for the reason the Apple block above gives:
# a CI `env:` covers neither a bare `cargo check` nor a developer's local
# build. Note that a `RUSTFLAGS` in the environment replaces this wholesale —
# cargo does not merge them — so a caller who sets it must carry both flags.
[target.x86_64-pc-windows-gnullvm]
rustflags = [
    # `+sse4.1` is the x86-64 desktop floor documented below, spelled into this
    # same value rather than as a second `-C target-feature` so that nothing
    # here depends on how rustc merges repeated occurrences of the flag.
    "-C", "target-feature=+crt-static,+sse4.1",
    "-C", "link-arg=-Wno-unused-command-line-argument",
]

# x86-64 desktops build with SSE4.1.
#
# `f32::round()` does not lower to an instruction at base x86-64. There is no
# SSE2 round-half-away-from-zero, so rustc emits a call to `roundf`, and with
# no system libm in the picture that call lands in compiler-builtins' software
# implementation — a `t roundf` local symbol linked into every binary here,
# doing the rounding with integer bit operations on the exponent. `floorf`,
# `truncf` and `ceilf` are the same story. SSE4.1 has `roundss`/`roundsd`, and
# all four collapse to a single instruction; the same flag also lets LLVM
# vectorize the shape and layout arithmetic an egui frame is made of.
#
# Measured on this workspace, x86-64 Linux: `squallar-egui`'s `InputHarness`
# driving 200 real UI frames on an ADVANCING clock — release codegen with LTO
# off so the symbols survive, counted with callgrind, the two builds differing
# in nothing but this flag.
#
#   Gui::ui_phased inclusive     946,428 -> 876,481 Ir/frame  -69,947 (-7.39%)
#   whole harness frame        1,252,646 -> 1,173,927 Ir/frame -78,718 (-6.28%)
#
# The unchanged-tree spread over a repeat of each arm is 95 and 76 Ir/frame, so
# the delta clears the noise by three orders of magnitude. The four software
# implementations are 51,376 Ir/frame of it and are gone outright: `nm` finds
# no `roundf`, `floorf`, `truncf` or `ceilf` symbol in the binary at all, and
# `objdump` finds `roundss` and `roundsd` where they were. The rest is
# vectorization, and 8,771 Ir/frame of the win lands outside `ui_phased` —
# which is why the two rows do not move by the same amount.
#
# The clock is the part to keep. On a harness whose `time` never advances,
# every `egui::Area` sits part-way through `fade_in` forever, painting at a
# fractional opacity that sends every shape through a deep-clone recolour path
# that no real frame runs. An earlier reading of this same flag was taken that
# way: it reported a bigger absolute saving, because a large share of the
# rounding it removed belonged to fade-in work a shipped frame never does.
#
# **This sets a minimum CPU.** SSE4.1 arrived with Intel Penryn (January 2008)
# and is on every Nehalem and later; on AMD it arrived with Bulldozer (October
# 2011). AMD K10 — Phenom, Phenom II, Athlon II — has SSE4**a**, a different
# and disjoint instruction set, and **will not run these binaries**: the
# failure is SIGILL at the first `roundss`, with no diagnostic and no log. That
# floor costs nothing real, because it sits far below the floor this app
# already had — a machine that cannot do SSE4.1 has no GPU that can run a
# wgpu/Vulkan application either. It is stated for users in `README.md`;
# changing it here without changing it there is a support incident.
#
# Per-target blocks, and deliberately not `build.rustflags` or a `RUSTFLAGS` in
# CI:
#
# * `wasm32-unknown-unknown` gains nothing. `f32.nearest` is ties-to-even, so
#   `round()` stays a call there however this is spelled, and an x86 feature
#   name on a wasm target is a warning to nobody's benefit.
# * `aarch64` gains nothing either. `frinta` is in the base ISA, so Apple
#   Silicon, Android and iOS already round inline.
# * A `RUSTFLAGS` in the environment **replaces** every block in this file
#   wholesale — cargo does not merge them — so a global spelling would take
#   `+crt-static` off the Windows row above and stop that binary booting.
# * `.github/scripts/wasm-threads.sh` builds by exporting its own `RUSTFLAGS`.
#   These being per-target config blocks and not an env var is what makes it
#   impossible for this flag to append itself to that line.
#
# Not applied to `x86_64-linux-android`, on purpose: that is an emulator and
# Chromebook target rather than a desktop, and it is not what was measured.

[target.x86_64-unknown-linux-gnu]
rustflags = ["-C", "target-feature=+sse4.1"]

[target.x86_64-apple-darwin]
rustflags = ["-C", "target-feature=+sse4.1"]
