[package]
name = "rustdar-overlays"
version = "0.1.0"
edition = "2024"

[dependencies]
chrono = "=0.4.44"
earcutr = "=0.5.0"
flate2 = "=1.1.9"
grib = { version = "=0.15.1", default-features = true }
rustdar-units = { path = "../rustdar-units" }
futures = "=0.3.32"
log = "=0.4.29"
netcdf = { version = "=0.12.0", features = ["static"] }
reqwest = { version = "=0.12.24", features = ["json"] }
roxmltree = "=0.20.0"
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.149"
tiny-skia = "=0.12.0"

[target.'cfg(target_os = "android")'.dependencies]
# Force vendored OpenSSL for Android builds to avoid cross-compilation issues
openssl-sys = { version = "=0.9.110", features = ["vendored"] }
# proj-sys (via grib → proj) needs SQLite3 at build time, but the NDK sysroot
# doesn't include SQLite3 development headers. Bundle it from source.
libsqlite3-sys = { version = "=0.35.0", features = ["bundled"] }
