[package]
name = "rustdar-overlays"
version = "0.1.0"
edition = "2024"

[dependencies]
chrono = "0.4.42"
earcutr = "0.4"
futures = "0.3"
log = "0.4.28"
reqwest = { version = "0.12", features = ["json"] }
roxmltree = "0.20"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tiny-skia = "0.12.0"

[target.'cfg(target_os = "android")'.dependencies]
# Force vendored OpenSSL for Android builds to avoid cross-compilation issues
openssl-sys = { version = "0.9", features = ["vendored"] }
