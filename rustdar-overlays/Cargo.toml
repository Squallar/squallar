[package]
name = "rustdar-overlays"
version.workspace = true
edition.workspace = true

[dependencies]
web-time = { workspace = true }
chrono = { workspace = true }
earcutr = "=0.5.0"
flate2 = { workspace = true }
# Keep this pin local: Cargo ignores a member's `default-features = false` when
# the workspace entry leaves defaults on.
# grib defaults pull `openjpeg-sys`, `libaec-sys`, `proj` (-> `proj-sys` ->
# `libsqlite3-sys`, `link-cplusplus`); none cross-compile to wasm32 or iOS.
# Dropped features are unused by HRRR except `gridpoints-proj`: HRRR is grid
# template 3.30 (Lambert conformal), reimplemented in `hrrr::lambert`.
# HRRR section 5 is DRT 5.3 (pure Rust in grib), not 5.40/5.42.
# `time-calculation` backs `temporal_raw_info()`.
grib = { version = "=0.16.0", default-features = false, features = [
    "png-unpack-with-png-crate",
    "time-calculation",
] }
rustdar-units = { workspace = true }
futures = "=0.3.33"
# GOES GLM granules. GLM L2 LCFA files are NetCDF4, i.e. plain HDF5 (every
# netCDF variable is an HDF5 dataset in the root group), so `glm::h5` reads them
# without a netCDF layer. Pure Rust; no `-sys` crate, unlike `netcdf`.
# Defaults are deliberately ON here (`std`, `checksum`, `deflate`) and must not
# be hoisted into `[workspace.dependencies]`: Cargo silently ignores a member's
# `default-features = false` when the workspace entry leaves defaults on. GLM L2
# LCFA granules are deflate-compressed, so dropping `deflate` takes the lightning
# overlay dark. Do NOT enable `fast-deflate` either: it selects `flate2/zlib-ng`,
# which is C and breaks wasm32/iOS cross-compilation.
hdf5-pure = "=0.25.0"
log = { workspace = true }
# `json` only, NOT `default`: reqwest's `default-tls` aliases `rustls` with
# aws-lc-rs, pulling `aws-lc-sys` in. TLS backend comes from the workspace pin.
reqwest = { workspace = true, features = ["json"] }
roxmltree = "=0.21.1"
# For `sources::DataSources` and `tls` (incl. the no-User-Agent client METAR/SPC
# need -- see `metar::fetch`). No cycle: `rustdar-radar` does not depend on this.
rustdar-radar = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tiny-skia = "=0.12.0"

# Must stay target-gated: tokio rejects `fs` on wasm ("Only features
# sync,macros,io-util,rt,time are supported on wasm") -- a hard build failure.
# Backs the native-only zone disk cache in `nws::zones`.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tokio = { workspace = true, features = ["fs"] }

[dev-dependencies]
# Drives the `#[ignore]`d live-network checks (IEM and the S3 buckets).
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }

[target.'cfg(target_os = "android")'.dependencies]
# Deliberately empty. `libsqlite3-sys` was pinned here with `features =
# ["bundled"]` because proj-sys (grib -> proj) needs SQLite3 headers the NDK
# sysroot does not ship; re-enabling grib's `gridpoints-proj` brings that back
# and breaks the Android build. `openssl-sys` was pinned with `features =
# ["vendored"]`; nothing links OpenSSL any more.
