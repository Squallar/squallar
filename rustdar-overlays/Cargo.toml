[package]
name = "rustdar-overlays"
version = "0.1.0"
edition = "2024"

[dependencies]
chrono = "=0.4.42"
earcutr = "=0.4.3"
flate2 = "=1.1.4"
rustdar-units = { path = "../rustdar-units" }
futures = "=0.3.31"
log = "=0.4.28"
reqwest = { version = "=0.12.24", features = ["json"] }
roxmltree = "=0.20.0"
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.145"
tiny-skia = "=0.12.0"

[target.'cfg(target_os = "android")'.dependencies]
# Force vendored OpenSSL for Android builds to avoid cross-compilation issues
openssl-sys = { version = "=0.9.110", features = ["vendored"] }
