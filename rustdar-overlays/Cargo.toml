[package]
name = "rustdar-overlays"
version = "0.1.0"
edition = "2024"

[dependencies]
chrono = "0.4.42"
log = "0.4.28"
reqwest = { version = "0.12", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(target_os = "android")'.dependencies]
# Force vendored OpenSSL for Android builds to avoid cross-compilation issues
openssl-sys = { version = "0.9", features = ["vendored"] }
