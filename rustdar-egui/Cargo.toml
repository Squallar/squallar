[package]
name = "rustdar-egui"
version.workspace = true
edition.workspace = true

[features]
# Serial-port GPS controls in the settings pane.
#
# The port dropdown calls rustdar_gps::detect_gps_ports, which is itself behind
# rustdar-gps's `serial` feature. Until this existed, the call site was gated on
# `not(target_os = "android")` while the callee was gated on a *feature* — and an
# OS cfg cannot satisfy a feature cfg, so every non-Android target compiled the
# block and then demanded `serial` from whoever was building. That is why this
# crate never built on its own; only a consumer that happened to enable `serial`
# could build it at all.
#
# Off by default: a target without serial ports (web) simply leaves it off, and
# the two gates now agree because they are the same kind of gate.
gps-serial = ["rustdar-gps/serial"]

[dependencies]
rustdar-radar = { workspace = true }
rustdar-overlays = { workspace = true }
rustdar-units = { workspace = true }
rustdar-gps = { workspace = true }
chrono = { workspace = true }
egui = { workspace = true }
log = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
walkers = { workspace = true }
