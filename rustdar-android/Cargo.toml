[package]
name = "rustdar-android"
version.workspace = true
edition.workspace = true

# Android APK configuration for cargo-apk
[package.metadata.android]
package = "dev.mcswain.rustdar"
apk_name = "Rustdar"
build_targets = ["aarch64-linux-android"]
min_sdk_version = 28
target_sdk_version = 34
theme = "@android:style/Theme.DeviceDefault.NoActionBar.Fullscreen"

# Handle configuration changes (orientation, screen size, fold/unfold, etc.) in-app
# instead of letting Android destroy and recreate the activity. Without this,
# unfolding a Z Fold triggers a full activity relaunch that deadlocks the native
# event loop and causes an ANR.
[package.metadata.android.application]
label = "Rustdar"

[package.metadata.android.signing.release]
path = "../rustdar.jks"
keystore_password = "rustdar"

[package.metadata.android.application.activity]
config_changes = "orientation|keyboardHidden|screenSize|screenLayout|smallestScreenSize|density|uiMode"

[[package.metadata.android.uses_permission]]
name = "android.permission.INTERNET"
[[package.metadata.android.uses_permission]]
name = "android.permission.ACCESS_NETWORK_STATE"
[[package.metadata.android.uses_permission]]
name = "android.permission.WRITE_EXTERNAL_STORAGE"
[[package.metadata.android.uses_permission]]
name = "android.permission.READ_EXTERNAL_STORAGE"
[[package.metadata.android.uses_permission]]
name = "android.permission.ACCESS_FINE_LOCATION"
[[package.metadata.android.uses_permission]]
name = "android.permission.ACCESS_COARSE_LOCATION"

[lib]
name = "rustdar_android"
crate-type = ["cdylib"]
path = "src/lib.rs"

[target.'cfg(target_os = "android")'.dependencies]
rustdar-platform = { workspace = true }
android_logger = "=0.15.1"
winit = { workspace = true, features = ["android-native-activity"] }
pollster = { workspace = true }
log = { workspace = true }
jni = { workspace = true }
ndk-context = { workspace = true }
rustls-platform-verifier = "=0.7.0"
rustdar-gps = { workspace = true, features = ["serial"] }
# Force vendored OpenSSL for Android builds to avoid cross-compilation issues
openssl-sys = { workspace = true }
