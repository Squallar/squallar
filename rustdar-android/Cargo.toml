[package]
name = "rustdar-android"
version.workspace = true
edition.workspace = true

# The APK is built by Gradle, from `android/`. Everything that used to live here
# as `[package.metadata.android]` -- package name, SDK levels, theme, permissions,
# configChanges, signing -- is now in `android/app/build.gradle.kts` and
# `android/app/src/main/AndroidManifest.xml`, which is what made it possible to
# set `android:networkSecurityConfig` at all. See
# `android/app/src/main/res/xml/network_security_config.xml` for why that matters.
#
# Build with:  cd android && ./gradlew assembleRelease   (or bundleRelease for .aab)

[lib]
# NativeActivity resolves `android_main` out of librustdar_android.so; the name
# here is what `android.app.lib_name` in the manifest must match.
name = "rustdar_android"
crate-type = ["cdylib"]
path = "src/lib.rs"

[target.'cfg(target_os = "android")'.dependencies]
rustdar-platform = { workspace = true }
# App itself lives in the portable crate; rustdar-platform supplies only the
# Android PlatformBridge this entry point hands it.
rustdar-frontend = { workspace = true }
android_logger = "=0.15.1"
# native-activity, deliberately, not game-activity. GameActivity exists to provide
# mobile text input, which rustdar has none of, and it forces an AppCompat theme --
# which changes what getRootWindowInsets() reports, shifting the map's
# excluded_rects and breaking click hit-testing against overlays. It would also add
# a C++ build. ndk_context is initialized under both backends, so all the JNI
# bridges in this crate work either way; there is simply nothing to gain.
winit = { workspace = true, features = ["android-native-activity"] }
pollster = { workspace = true }
log = { workspace = true }
jni = { workspace = true }
ndk-context = { workspace = true }
# Pinned to the version reqwest 0.13.2 resolves, so `android::init_with_env`
# below talks to the same verifier instance reqwest's clients read from. 0.6.2
# wants jni ^0.21, which is the workspace pin -- 0.7.x would require jni ^0.22.
#
# Its Kotlin half ships as an AAR inside the `rustls-platform-verifier-android`
# crate's registry checkout; `android/app/build.gradle.kts` locates that via
# `cargo metadata` and adds it as a Maven repo.
rustls-platform-verifier = "=0.6.2"
rustdar-gps = { workspace = true, features = ["serial"] }
