[package]
name = "rustdar-android"
version.workspace = true
edition.workspace = true

# The APK is built by Gradle, from `android/`. Everything that used to live here
# as `[package.metadata.android]` -- package name, SDK levels, theme, permissions,
# configChanges, signing -- is now in `android/app/build.gradle.kts` and
# `android/app/src/main/AndroidManifest.xml`, which is what made it possible to
# set `android:networkSecurityConfig` at all. See
# `android/app/src/main/res/xml/network_security_config.xml` for why that matters.
#
# Build with:  cd android && ./gradlew assembleRelease   (or bundleRelease for .aab)

[lib]
# NativeActivity resolves `android_main` out of librustdar_android.so; the name
# here is what `android.app.lib_name` in the manifest must match.
name = "rustdar_android"
crate-type = ["cdylib"]
path = "src/lib.rs"

[target.'cfg(target_os = "android")'.dependencies]
rustdar-platform = { workspace = true }
# App itself lives in the portable crate; rustdar-platform supplies only the
# Android PlatformBridge this entry point hands it.
rustdar-frontend = { workspace = true }
android_logger = "=0.15.1"
# native-activity, deliberately, not game-activity. GameActivity exists to provide
# mobile text input, which rustdar has none of, and it forces an AppCompat theme --
# which changes what getRootWindowInsets() reports, shifting the map's
# excluded_rects and breaking click hit-testing against overlays. It would also add
# a C++ build. Both backends hand `android_main` the same `AndroidApp`, so the
# Activity the JNI bridges below reach through works either way; there is simply
# nothing to gain.
winit = { workspace = true, features = ["android-native-activity"] }
pollster = { workspace = true }
log = { workspace = true }
jni = { workspace = true }
# NB: no `ndk-context`. This crate deliberately does not use it. android-activity
# 0.6 registers `Activity.getApplication()` as the ndk_context "context" (0.5
# registered the Activity), and `getWindow`, `moveTaskToBack` and
# `requestPermissions` are all Activity-only -- reached through the Application
# they silently do nothing. `android_main` has the real Activity and stashes a
# global ref to it; see the `JAVA` static in src/lib.rs.
# MUST stay on the major that reqwest resolves. reqwest 0.13.4 accepts
# `rustls-platform-verifier >=0.6.0, <0.8.0`, so 0.7.0 is the single copy today.
# Pinning this away from what reqwest resolves does not replace the verifier --
# it adds a second copy. `android::init_with_env` would then initialize one
# instance while every reqwest client keeps reading the other, uninitialized one,
# and Android TLS setup silently becomes a no-op. Nothing fails at build time;
# the first symptom is an HTTPS request failing on-device, which is exactly the
# api.weather.gov path the Network Security Config in `android/` exists to keep
# working. `cargo tree -i rustls-platform-verifier` must show exactly one root.
#
# The jni pin travels with it (0.7.x wants jni ^0.22) and is equally not to be
# taken alone -- see the `jni` entry in the workspace Cargo.toml. Both halves
# landed together in c213e46 + 634bfad; the `dep-unification` row in
# `.github/workflows/build.yaml` now guards the split.
#
# Its Kotlin half ships as an AAR inside the `rustls-platform-verifier-android`
# crate's registry checkout; `android/app/build.gradle.kts` locates that via
# `cargo metadata` and adds it as a Maven repo.
rustls-platform-verifier = "=0.7.0"
# The domain crate only: this crate consumes Fix/FixQuality/LocationPermission,
# none of which sit behind any feature — the serial transport lives in
# rustdar-nmea-serial, which this crate never names. Features are additive
# across the whole graph, so naming the transport here would re-enable the
# serialport stack for everything Android links -- exactly the mobile exclusion
# rustdar-platform's cfg-gated dependencies exist to keep (see the comment
# there). `rustdar-geo` is named for `GeoPoint`, which `Fix` carries.
rustdar-geo = { workspace = true }
rustdar-location = { workspace = true }

# Host-only, opt-in copies of the four dependencies the JNI helpers actually
# need. See the `jni-typecheck` feature below for why they exist.
#
# `ndk-context` used to be a fourth. It is gone from both lists deliberately --
# see the note next to `jni` above.
[target.'cfg(not(target_os = "android"))'.dependencies]
jni = { workspace = true, optional = true }
log = { workspace = true, optional = true }
rustdar-geo = { workspace = true, optional = true }
rustdar-location = { workspace = true, optional = true }

[features]
# Type-check the JNI layer on the *host*, with no NDK and no C toolchain.
#
# Everything in `src/lib.rs` is normally behind `cfg(target_os = "android")`, so
# a host `cargo check` compiles none of it -- which is how the jni 0.21->0.22
# break shipped green through Build, Clippy and Test. The Android job in CI
# closes that, but it needs cargo-ndk and an NDK because `rustdar-android`'s real
# dependency graph reaches reqwest -> rustls -> ring, whose build script compiles
# C.
#
# The JNI helpers themselves need none of that. `jni` 0.22 is `default = []` and
# pure Rust; `log`, `rustdar-geo` and `rustdar-location` build anywhere. So this
# feature widens the crate-level cfg to let
# every helper *except* `android_main` compile for the host, where rustc checks
# each `env.call_method`, `jni_sig!` and `JObject::from_raw` against the real jni
# API in a couple of seconds:
#
#     cargo check -p rustdar-android --features jni-typecheck
#
# That is a strict superset of what the retired `android-theme-check` job
# covered, and it needs nothing but a stable toolchain -- no rustup target, even.
# It does not replace the cargo-ndk job: `android_main`, the winit Android
# backend and the linked `.so` are still only exercised there.
jni-typecheck = ["dep:jni", "dep:log", "dep:rustdar-geo", "dep:rustdar-location"]
