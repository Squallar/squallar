# LOCAL CHANGE (squallar, see VENDORED.md). Upstream's tables -- some two
# hundred clippy lints at `warn`, plus four `[lints.rust]` groups -- are
# replaced by these two. What they are for: this workspace's clippy CI job runs
# `cargo clippy --all-targets --all-features --fix` across every workspace
# member, **pushes the rewritten tree** to main, then gates on `-D warnings`.
# Without them a vendored crate is a standing invitation for a bot to rewrite
# upstream source, which would destroy the one property that makes this
# directory reviewable: that every line here is either upstream's or listed in
# VENDORED.md. Silencing the lints leaves the bot nothing to fix, and leaves the
# gate nothing to fail on. Same tables and same reasoning as the other seven
# vendored directories; the mechanism note lives in vendor/nexrad-decode's
# manifest.
#
# Representative case this was verified against: upstream asks for
# `clippy::empty_enum`, which rustc has renamed to `empty_enums`, so the
# unmodified copy emits a `renamed_and_removed_lints` warning on every build --
# a warning that `-D warnings` turns into a failed CI row, on a line nobody in
# this workspace wrote.
[lints.rust]
future_incompatible = { level = "allow", priority = -1 }
nonstandard_style = { level = "allow", priority = -1 }
rust_2018_idioms = { level = "allow", priority = -1 }
unused = { level = "allow", priority = -1 }
deprecated = "allow"
unexpected_cfgs = "allow"
unknown_lints = "allow"
renamed_and_removed_lints = "allow"
# Upstream's source carries `#[expect(clippy::unwrap_used)]` twice, and
# `unwrap_used` is a restriction lint that the table above no longer turns on,
# so both expectations are now unfulfilled -- which is itself a lint, and one
# `-D warnings` fails on. Allowed rather than answered by editing upstream's
# attributes away, because every line in `src/` that is not in VENDORED.md is
# upstream's and stays that way.
unfulfilled_lint_expectations = "allow"

[lints.clippy]
all = { level = "allow", priority = -1 }
