[package]
edition = "2024"
rust-version = "1.92"
name = "walkers"
version = "0.56.0"
build = false
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "slippy map widget for egui"
readme = "README.md"
keywords = [
    "geography",
    "gis",
    "gui",
]
categories = [
    "gui",
    "science::geo",
]
license = "MIT"
repository = "https://github.com/podusowski/walkers"
resolver = "2"

[features]
default = []
mvt = [
    "dep:color",
    "dep:geo",
    "dep:lyon_path",
    "dep:lyon_tessellation",
    "dep:mvt-reader",
    "dep:serde",
    "dep:serde_json",
]
pmtiles = ["dep:pmtiles"]
serde = [
    "dep:serde",
    "egui/serde",
    "geo-types/serde",
]

[lib]
name = "walkers"
path = "src/lib.rs"

[dependencies.bytes]
version = "1"

[dependencies.color]
version = "0.3.2"
features = ["serde"]
optional = true

[dependencies.egui]
version = "0.35.0"

[dependencies.egui_extras]
version = "0.35.0"
features = ["svg"]

[dependencies.futures]
version = "0.3.32"

[dependencies.geo]
version = "0.33.1"
optional = true
default-features = false

[dependencies.geo-types]
version = "0.7"

[dependencies.image]
version = "0.25"
features = [
    "jpeg",
    "png",
]
default-features = false

[dependencies.log]
version = "0.4"

[dependencies.lru]
version = "0.18"

[dependencies.lyon_path]
version = "1"
optional = true

[dependencies.lyon_tessellation]
version = "1"
optional = true

[dependencies.mvt-reader]
version = "2.1.0"
optional = true

[dependencies.pmtiles]
version = "0.23.0"
features = ["mmap-async-tokio"]
optional = true
default-features = false

[dependencies.reqwest]
version = "0.12"
features = ["rustls-tls"]
default-features = false

[dependencies.reqwest-middleware]
version = "0.4.2"

[dependencies.serde]
version = "1"
features = ["derive"]
optional = true

[dependencies.serde_json]
version = "1.0.148"
optional = true

[dependencies.thiserror]
version = "2"

# Dev-dependencies: `approx` alone, and the other two are removed rather than
# forgotten. See VENDORED.md, *Removed -- dev-dependencies*.
#
# `eframe` is upstream's, for a `demo/` that the published tarball does not
# contain; `autoexamples` is `false` and there is no `examples/` directory, so
# nothing here could use it. As a non-member dependency walkers' dev-deps were
# never resolved at all; as a member they are, so keeping it would have
# materialised eframe and its winit/glow tree in `Cargo.lock` to serve nothing.
#
# `env_logger` was used only by `src/http_tiles.rs`'s test module, which is
# gone -- see below.
[dev-dependencies.approx]
version = "0.5"

[target.'cfg(not(target_family = "wasm"))'.dependencies.http-cache-reqwest]
version = "0.16.0"

[target.'cfg(not(target_family = "wasm"))'.dependencies.tokio]
version = "1"

[target.'cfg(target_family = "wasm")'.dependencies.getrandom]
version = "0.2"
features = ["js"]

[target.'cfg(target_family = "wasm")'.dependencies.wasm-bindgen-futures]
version = "0.4"

# ---------------------------------------------------------------------------
# Lint tables: this is not our code, and CI must stop treating it as ours.
#
# `.github/workflows/clippy.yaml` runs `cargo clippy --all-targets
# --all-features --fix` over every workspace member and **auto-commits the
# rewritten tree** to main, then gates on `-D warnings`. Without these tables a
# vendored crate is a standing invitation for a bot to rewrite upstream source
# on a Tuesday, which would destroy the one property that makes this directory
# reviewable: that every line here is either upstream's or listed in
# VENDORED.md.
#
# The mechanism, restated from `vendor/nexrad-decode/Cargo.toml` because it is
# not obvious: Cargo turns these entries into `-A` flags and CI appends
# `-D warnings` after them, which does not undo them -- `-D warnings` only
# escalates lints that are *at* warn level, and an explicitly allowed lint is
# at allow. The one form that would not have survived is
# `[lints.rust] warnings = "allow"`, same lint id as the CI flag and last one
# wins, which is why the rustc side below names groups instead.
#
# What these tables cannot reach: `src/lib.rs`'s own
# `#![deny(clippy::unwrap_used, rustdoc::broken_intra_doc_links)]`. A lint
# attribute in source outranks any command-line level. It is upstream's, it is
# clean on upstream's own tree, and it is deliberately left alone -- unlike
# `vendor/nexrad-decode`, nothing here needed a source edit to satisfy it.
[lints.rust]
future_incompatible = { level = "allow", priority = -1 }
nonstandard_style = { level = "allow", priority = -1 }
rust_2018_idioms = { level = "allow", priority = -1 }
unused = { level = "allow", priority = -1 }
deprecated = "allow"
unexpected_cfgs = "allow"
unknown_lints = "allow"
renamed_and_removed_lints = "allow"

# `clippy::all` is every clippy lint that warns by default -- correctness,
# suspicious, style, complexity, perf. pedantic/nursery/cargo are allow by
# default and this workspace never turns them on, so naming them would be
# decoration.
[lints.clippy]
all = { level = "allow", priority = -1 }
