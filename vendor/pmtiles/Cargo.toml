[package]
edition = "2024"
rust-version = "1.88"
name = "pmtiles"
version = "0.23.0"
authors = [
    "Luke Seelenbinder <luke.seelenbinder@stadiamaps.com>",
    "Yuri Astrakhan <YuriAstrakhan@gmail.com>",
]
build = false
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "Implementation of the PMTiles v3 spec with multiple sync and async backends."
readme = "README.md"
keywords = [
    "pmtiles",
    "gis",
    "geo",
]
categories = ["science::geo"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/stadiamaps/pmtiles-rs"

[features]
# `__async` is the crate's own name for the async core every backend feature
# turns on -- double-underscored as "not a backend you pick", not as unstable.
__async = [
    "dep:tokio",
    "async-compression/tokio",
]
# Upstream's `default` was `__all_non_conflicting`, a list of twelve. This one
# is what a workspace member has to be able to build on its own: the async
# core, the writer `squallar-egui` uses for downloaded segments, and the entry
# iterator its own test suite needs. `squallar-egui` still asks with
# `default-features = false` and names what it wants.
default = [
    "__async",
    "iter-async",
    "write",
]
http-async = [
    "__async",
    "dep:reqwest",
]
iter-async = [
    "__async",
    "dep:async-stream",
    "dep:futures-util",
]
write = [
    "dep:countio",
    "dep:flate2",
    "dep:twox-hash",
]

[lib]
name = "pmtiles"
path = "src/lib.rs"

[dependencies.async-compression]
version = "0.4"
features = ["gzip"]

[dependencies.async-stream]
version = "0.3"
optional = true

[dependencies.bytes]
version = "1"

[dependencies.countio]
version = "0.3.0"
optional = true

[dependencies.fast_hilbert]
version = "2.0.1"

[dependencies.flate2]
version = "1"
optional = true

[dependencies.futures-util]
version = "0.3"
optional = true

[dependencies.reqwest]
version = "0.13.1"
optional = true
default-features = false

[dependencies.thiserror]
version = "2"

[dependencies.tokio]
version = "1"
features = ["io-util"]
optional = true
default-features = false

[dependencies.twox-hash]
version = "2"
features = [
    "std",
    "xxhash3_64",
]
optional = true
default-features = false

[dependencies.varint-rs]
version = "2"

# Dev-dependencies are target-gated, and that is not house style. The wasm gate
# this workspace runs is
# `cargo check --workspace --all-targets --target wasm32-unknown-unknown`, and
# `--all-targets` builds test targets -- so a member's dev-dependencies have to
# compile on wasm32 or the gate is red. `tempfile` wants a filesystem and there
# is none. The test modules themselves carry a matching
# `#[cfg(not(target_arch = "wasm32"))]`; they open fixture files off disk, so
# there was never anything for them to do on that target.
[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies.flate2]
version = "1"

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies.rstest]
version = "0.26.1"

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies.tempfile]
version = "3.13.0"

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies.tokio]
version = "1"
features = [
    "test-util",
    "macros",
    "rt",
]

# Upstream's lint tables are replaced wholesale, and for the same reason
# `vendor/walkers/Cargo.toml` replaces its own: `.github/workflows/clippy.yaml`
# runs `cargo clippy --all-targets --all-features --fix` across every member
# and **auto-commits the rewritten tree to `main`**, then gates on
# `-D warnings`. Without these tables a bot would eventually rewrite upstream
# source in this directory on its own schedule and VENDORED.md would stop being
# true. With them the bot has nothing to fix and the gate nothing to fail on.
#
# Upstream's own tables were `pedantic = warn` plus `unwrap_used`/`panic` warns.
# They are upstream's standard, not this workspace's, and this workspace does
# not get to hold a copy of somebody else's code to somebody else's bar.
#
# The rustc side names groups rather than `warnings` because `-D warnings` on
# the command line is the same lint id and last-one-wins; naming the groups is
# what actually outranks it. `unexpected_cfgs` is load-bearing here in a way it
# is not for walkers: the manifest note above leaves `#[cfg(feature = "moka")]`
# and three others in source with no such feature declared.
[lints.rust]
future_incompatible = { level = "allow", priority = -1 }
nonstandard_style = { level = "allow", priority = -1 }
rust_2018_idioms = { level = "allow", priority = -1 }
unused = { level = "allow", priority = -1 }
deprecated = "allow"
unexpected_cfgs = "allow"
unknown_lints = "allow"
renamed_and_removed_lints = "allow"

[lints.clippy]
all = { level = "allow", priority = -1 }
