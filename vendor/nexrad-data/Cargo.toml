[package]
edition = "2021"
rust-version = "1.75.0"
name = "nexrad-data"
version = "1.0.0-rc.7"
authors = ["Daniel Way <contact@danieldway.com>"]
build = false
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "Data access for NEXRAD weather radar files and AWS integration."
readme = "README.md"
keywords = [
    "nexrad",
    "radar",
    "weather",
    "meteorology",
    "noaa",
]
categories = [
    "science",
    "parsing",
    "data-structures",
]
license = "MIT"
repository = "https://github.com/danielway/nexrad"

[features]
aws = [
    "reqwest",
    "xml",
    "once_cell",
]
aws-polling = [
    "aws",
    "tokio",
    "futures",
]
# Upstream's `default` is `["aws", "nexrad-model"]`. The `aws` half is dropped
# here, and only here -- `src/aws/` is untouched and the feature still exists
# for anyone who asks for it by name, including `--all-features`.
#
# Vendoring turns nexrad-data into a workspace *member*, and cargo enables a
# selected member's own default features regardless of how its dependents
# declare it. This workspace's dependents all declare
# `default-features = false` (root `Cargo.toml`), so `aws` has always been off
# here. Measured both ways with `cargo tree -e features -i nexrad-data`:
#
#   upstream default:  aws, default, nexrad-model, once_cell, parallel,
#                      rayon, reqwest, xml
#   this line:         default, nexrad-model, parallel, rayon
#
# So membership alone would switch on four features that were off before, and
# put reqwest, xml and once_cell into `cargo test --workspace` and into every
# `cargo check --workspace --target wasm32-unknown-unknown` row.
#
# Not because that fails -- it was checked, and `-p nexrad-data --features aws
# --target wasm32-unknown-unknown` compiles clean in 21 s; reqwest 0.13 has a
# wasm backend and elides its rustls features there. It is dropped because
# vendoring is supposed to change nothing, and this is the one line that keeps
# the resolved feature set identical to what it was as a plain dependency. The
# `aws` surface is also the one part of this crate rustdar does not use:
# `rustdar-radar/src/archive.rs` and `src/chunks.rs` reimplement it, and say so.
#
# A manifest edit precisely so that it need not be a source edit.
default = ["nexrad-model"]
parallel = ["rayon"]

[lib]
name = "nexrad_data"
path = "src/lib.rs"

# Kept: the four test targets that compile here without a fixture or a network,
# two of which pin the code this directory exists to change. See VENDORED.md
# for the seven that were dropped and why.
[[test]]
name = "error_handling"
path = "tests/error_handling.rs"

[[test]]
name = "aws_archive"
path = "tests/aws_archive.rs"

[[test]]
name = "malformed_records"
path = "tests/malformed_records.rs"

[[test]]
name = "aws_realtime_types"
path = "tests/aws_realtime_types.rs"

[dependencies.bzip2]
version = "0.6.0"

[dependencies.chrono]
version = "0.4.42"

[dependencies.flate2]
version = "1.1.1"

[dependencies.futures]
version = "0.3.31"
optional = true

[dependencies.log]
version = "0.4.28"

[dependencies.nexrad-decode]
version = "1.0.0-rc.3"

[dependencies.nexrad-model]
version = "1.0.0-rc.2"
optional = true

[dependencies.once_cell]
version = "1.21.0"
optional = true

[dependencies.rayon]
version = "1.11.0"
optional = true

# Upstream asks for reqwest's `rustls` feature. Here it is
# `rustls-no-provider`, and this is a **local** change that would be wrong to
# offer upstream -- see VENDORED.md.
#
# reqwest's `rustls` feature is `__rustls-aws-lc-rs`, which turns on
# `rustls/aws-lc-rs`, which is `aws-lc-rs` -> `aws-lc-sys`: a CMake + C +
# assembly build. As a plain registry dependency with `aws` off that never
# resolved. As a workspace *member* it is reachable the moment anything says
# `--all-features`, which seven CI invocations do -- including
# `clippy.yaml`'s `--all-features --fix`, which auto-commits, and the Linux,
# aarch64-apple-darwin, x86_64-apple-darwin and x86_64-pc-windows-gnullvm
# release rows in `build.yaml`. Verified by building: it produced a 46 MB
# `target/debug/build/aws-lc-sys-*/`.
#
# `rustls-no-provider` is the same TLS stack with the provider left to the
# caller, and it is exactly what this workspace's own reqwest pin in the root
# `Cargo.toml` already asks for, so unification gives one reqwest with `ring`
# behind it. `cargo tree --workspace --all-features -i aws-lc-sys` returns
# "did not match any packages" with this line, and names aws-lc-sys without it.
#
# Wrong for upstream because a bare `nexrad-data` with `aws` on and no
# provider selected has no crypto backend. That is a choice only the top-level
# binary can make, and this workspace has made it; a published crate has to
# keep offering a default. The upstream conversation is "let dependents pick
# the provider", not this line.
[dependencies.reqwest]
version = "0.13.1"
features = ["rustls-no-provider"]
optional = true
default-features = false

[dependencies.thiserror]
version = "2.0.16"

[dependencies.xml]
version = "1.0.0"
optional = true

[dependencies.zerocopy]
version = "0.8.30"
features = ["derive"]

[target.'cfg(not(target_arch = "wasm32"))'.dependencies.tokio]
version = "1.47.1"
features = ["full"]
optional = true

# `.github/workflows/clippy.yaml` runs `cargo clippy --all-targets
# --all-features --fix` over every workspace member and auto-commits the
# rewritten tree to `main`, then gates on `-D warnings`. Without these tables a
# bot would eventually rewrite upstream source in this directory on its own
# schedule, and VENDORED.md's *Local changes* list would silently stop being
# true. Silencing the lints leaves the bot nothing to fix, and leaves the gate
# nothing to fail on.
#
# The mechanism is worth stating because it is not obvious. Cargo turns these
# entries into `-A` flags; CI appends `-D warnings` after them. That does not
# undo them: `-D warnings` only escalates lints that are *at* warn level, and
# an explicitly allowed lint is at allow. The one thing that would not have
# survived is `[lints.rust] warnings = "allow"` -- same lint id as the CI flag,
# last one wins -- which is why the rustc side below names groups instead.
#
# Groups only, and no attempt to also silence what these tables cannot reach:
# `src/lib.rs`'s own `#![deny(...)]` attributes outrank any command-line level,
# so the one lint conflict that needed a source edit got one. It is recorded in
# VENDORED.md.
#
# The same precedence leaves one deliberate hole: upstream's own
# `#![warn(clippy::correctness)]` still wins over `all = "allow"` below, so a
# correctness lint that a future clippy learns to fire here would reach the
# `-D warnings` gate. That is the one class worth being interrupted by in a
# decoder, so it stays.
[lints.rust]
future_incompatible = { level = "allow", priority = -1 }
nonstandard_style = { level = "allow", priority = -1 }
rust_2018_idioms = { level = "allow", priority = -1 }
unused = { level = "allow", priority = -1 }
deprecated = "allow"
unexpected_cfgs = "allow"
unknown_lints = "allow"
renamed_and_removed_lints = "allow"

# `clippy::all` is every clippy lint that warns by default -- correctness,
# suspicious, style, complexity, perf. pedantic/nursery/cargo are allow by
# default and this workspace never turns them on, so naming them would be
# decoration.
[lints.clippy]
all = { level = "allow", priority = -1 }
