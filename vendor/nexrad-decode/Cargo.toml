[package]
edition = "2021"
rust-version = "1.75.0"
name = "nexrad-decode"
version = "1.0.0-rc.3"
authors = ["Daniel Way <contact@danieldway.com>"]
build = false
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "Binary protocol decoding for NEXRAD weather radar data."
readme = "README.md"
keywords = [
    "nexrad",
    "radar",
    "weather",
    "meteorology",
    "noaa",
]
categories = [
    "science",
    "parsing",
    "data-structures",
]
license = "MIT"
repository = "https://github.com/danielway/nexrad"

[features]
default = [
    "uom",
    "nexrad-model",
]

[lib]
name = "nexrad_decode"
path = "src/lib.rs"

# `autotests = false` above, so a test target exists only if it is named here.
# The three that are gone -- extract_fixtures, version_compat, volume_decode --
# all `include_bytes!("../../downloads/...")`, a directory that exists only in
# upstream's own checkout after a download step; they cannot compile here at
# all. Their `.rs` files are gone with them.
#
# What is left is the pair that compiles from what the tarball actually ships:
# malformed_input (the negative-input pin the framing fix must not regress --
# its `test_all_ones` builds exactly the sentinel-size header that fix has to
# survive) and generate_synthetic_fixtures (std-only, `#[ignore]`d, writes
# fixtures on demand).
[[test]]
name = "generate_synthetic_fixtures"
path = "tests/generate_synthetic_fixtures.rs"

[[test]]
name = "malformed_input"
path = "tests/malformed_input.rs"

# Deleted with their directories: `[[example]] elevation_angles` (wanted clap)
# and `[[bench]] decode_messages` (wanted criterion, and carried 400 KB of KDMX
# fixtures this workspace never reads). `autoexamples`/`autobenches` are false,
# so the blocks and the directories had to go together -- a block naming a
# missing path is a hard error, and a directory with no block is dead weight.

[dependencies.chrono]
version = "0.4.42"

[dependencies.hex]
version = "0.4.3"

[dependencies.log]
version = "0.4.28"

[dependencies.nexrad-model]
version = "1.0.0-rc.2"
optional = true

[dependencies.sha2]
version = "0.10.9"

[dependencies.thiserror]
version = "2.0.16"

[dependencies.uom]
version = "0.38.0"
optional = true

[dependencies.zerocopy]
version = "0.8.30"
features = ["derive"]

# The one dev-dependency that survives, because the 15 in-source
# `snapshot_test.rs` modules and their 16 `.snap` files are the WSR-88D
# behaviour pin this vendoring exists to protect: if the decode patch that
# follows changes what a real Archive II message decodes to, a snapshot says
# so. Verified to compile for `wasm32-unknown-unknown` under `--all-targets`,
# which is the check that decides whether these can stay ungated.
[dev-dependencies.insta]
version = "1.43.2"
features = [
    "yaml",
    "redactions",
]

# Gone with the targets that wanted them: clap and criterion (the example and
# the bench), env_logger and tokio (only ever used by the three deleted
# `downloads/`-reading tests).
#
# nexrad-data is the one worth naming. Upstream dev-depends on
# **1.0.0-rc.4**, while this workspace runs nexrad-data **=1.0.0-rc.7**; a
# dev-dependency is not unified across major-incompatible pre-release
# versions, so keeping it would have materialised a *second* nexrad-data in
# Cargo.lock -- built, linted and shipped into `--all-targets` -- purely to
# serve tests that were deleted anyway.

