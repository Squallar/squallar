[package]
name = "rustdar-platform"
version.workspace = true
edition.workspace = true

[[bin]]
name = "rustdar-platform"
path = "src/main.rs"

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "rustdar_platform_lib"
crate-type = ["staticlib", "cdylib", "rlib"]
path = "src/lib.rs"

[dependencies]
# The portable application. Everything else here is entry-point scaffolding or
# a platform capability the frontend asks for through a trait.
rustdar-frontend = { workspace = true }
# For the ConfigStore trait the filesystem store implements.
rustdar-egui = { workspace = true }
rustdar-gps = { workspace = true, features = ["serial"] }
log = { workspace = true }
pollster = { workspace = true }
winit = { workspace = true }
env_logger = "=0.11.10"

[target.'cfg(target_os = "android")'.dependencies]
# Force vendored OpenSSL for Android builds to avoid cross-compilation issues
openssl-sys = { workspace = true }
# Android theme detection
rustdar-android-theme = { workspace = true }

[target.'cfg(not(target_os = "android"))'.dependencies]
# Cross-platform theme detection for desktop platforms
dark-light = "=2.0.0"
# Turn on the settings pane's serial-GPS controls for desktop only. Android
# builds the serial reader (see rustdar-gps/serial above) but has never shown
# the port picker, and enabling the feature unconditionally here would leak it
# there through rustdar-android — cargo features are additive across the graph.
rustdar-egui = { workspace = true, features = ["gps-serial"] }
