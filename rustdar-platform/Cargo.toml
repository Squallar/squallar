[package]
name = "rustdar-platform"
version.workspace = true
edition.workspace = true

[[bin]]
name = "rustdar-platform"
path = "src/main.rs"

[lib]
# The `_lib` suffix keeps the lib name from colliding with the bin name, which
# only breaks on Windows: https://github.com/rust-lang/cargo/issues/8519
name = "rustdar_platform_lib"
# rlib only. Adding `cdylib` makes cargo-ndk emit and copy
# librustdar_platform_lib.so into jniLibs -- a dead 1.8 MB per ABI.
crate-type = ["rlib"]
path = "src/lib.rs"

[dependencies]
rustdar-frontend = { workspace = true }
rustdar-egui = { workspace = true }
rustdar-gps = { workspace = true, features = ["serial"] }
log = { workspace = true }
pollster = { workspace = true }
winit = { workspace = true }
env_logger = "=0.11.11"

[dev-dependencies]
# Both only for src/network_security_config.rs, which is `#[cfg(test)]`.
rustdar-radar = { workspace = true }
walkers = { workspace = true }

[target.'cfg(not(target_os = "android"))'.dependencies]
# No Android entry: reading the Android theme is a JNI call and this crate is
# `#![forbid(unsafe_code)]`, so `rustdar-android` injects it instead.
dark-light = "=2.0.0"
# Desktop-only, because cargo features are additive across the graph: enabling
# `gps-serial` unconditionally would leak the port picker into the Android UI.
rustdar-egui = { workspace = true, features = ["gps-serial"] }
