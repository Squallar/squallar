[package]
name = "rustdar-platform"
version.workspace = true
edition.workspace = true

[[bin]]
name = "rustdar-platform"
path = "src/main.rs"

[lib]
# The `_lib` suffix keeps the lib name from colliding with the bin name, which
# only breaks on Windows: https://github.com/rust-lang/cargo/issues/8519
name = "rustdar_platform_lib"
# rlib only. Adding `cdylib` makes cargo-ndk emit and copy
# librustdar_platform_lib.so into jniLibs -- a dead 1.8 MB per ABI.
#
# iOS needs a `staticlib` to link the .app against, but adding it here would
# archive the whole graph on every desktop build and every `--all-targets`
# clippy run too. `ios/Makefile` asks for it per-build with
# `cargo rustc --crate-type staticlib` instead.
crate-type = ["rlib"]
path = "src/lib.rs"

[dependencies]
rustdar-frontend = { workspace = true }
rustdar-egui = { workspace = true }
# Types only here (GpsFix, GpsConfig). `serial` is requested per target below.
rustdar-gps = { workspace = true }
iana-time-zone = { workspace = true }
log = { workspace = true }
pollster = { workspace = true }
winit = { workspace = true }
env_logger = "=0.11.11"

[dev-dependencies]
# Both only for src/network_security_config.rs, which is `#[cfg(test)]`.
rustdar-radar = { workspace = true }
walkers = { workspace = true }

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
# Android's theme is a JNI call injected by `rustdar-android`. iOS is excluded
# because `dark-light` 2.0's iOS arm returns `Mode::Light` unconditionally *and*
# returns `Mode`, not `Result<Mode>`, so it does not even typecheck here.
dark-light = "=2.0.0"
# `serialport` links IOKit, which iOS does not have -- that fails the link, not
# the compile, so only the .app build would have caught it. Features are
# additive across the graph, so this also keeps the port picker off mobile.
rustdar-egui = { workspace = true, features = ["gps-serial"] }
rustdar-gps = { workspace = true, features = ["serial"] }

[target.'cfg(target_os = "linux")'.dependencies]
# GeoClue2 lives on the session bus and nowhere else, so `os_location/linux.rs`
# needs a D-Bus client. Already in the graph via `dark-light -> ashpd`, which
# resolves the same 5.18.0 -- so this adds **zero packages**.
#
# It is not free, though, and the plan's earlier "harmless" was an
# overstatement. `ashpd` selects `zbus/async-io` *without* `blocking-api`;
# taking the default features here turns that on, which recompiles `zbus` and
# `zbus_macros` with a larger surface on the linux, `standalone`, clippy-host
# and test rows. That is the trade being made deliberately: the whole provider
# is written against `zbus::blocking` with no async and no executor, on a
# thread whose entire job is to sit in a blocking `next()`.
zbus = "=5.18.0"
# For `GpsFix::timestamp`, which is a `chrono::NaiveDateTime` and arrives from
# GeoClue as a `(tt)` pair of epoch seconds and microseconds. Already in the
# graph via `rustdar-gps`; named here because this crate now converts one.
chrono = { workspace = true }
