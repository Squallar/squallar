[package]
name = "rustdar-platform"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "rustdar-platform"
path = "src/main.rs"

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "rustdar_platform_lib"
crate-type = ["staticlib", "cdylib", "rlib"]
path = "src/lib.rs"

[dependencies]
rustdar-egui = { path = "../rustdar-egui" }
rustdar-radar = { path = "../rustdar-radar" }
bytemuck = { version = "1.23.2", features = ["derive"] }
chrono = "0.4.42"
clap = { version = "4.5.48", features = ["derive"] }
egui = "0.33.0"
egui-wgpu = { version = "0.33.0", features = ["winit"] }
log = "0.4.28"
nexrad = { version = "0.0.3", features = ["download"] }
pollster = "0.3"
serde_json = "1.0.145"
tokio = { version = "1.42.0", features = ["rt", "rt-multi-thread"] }
walkers = "0.18"
winit = "0.30.12"
web-time = "1.1.0"
egui-winit = { version = "0.33.0", default-features = false, features = ["clipboard", "links", "wayland", "x11"] }
env_logger = "0.11"
wgpu = "26.0.0"

[target.'cfg(target_os = "android")'.dependencies]
# Force vendored OpenSSL for Android builds to avoid cross-compilation issues
openssl-sys = { version = "0.9", features = ["vendored"] }
