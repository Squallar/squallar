[package]
name = "rustdar-platform"
version.workspace = true
edition.workspace = true

[[bin]]
name = "rustdar-platform"
path = "src/main.rs"

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "rustdar_platform_lib"
crate-type = ["staticlib", "cdylib", "rlib"]
path = "src/lib.rs"

[dependencies]
rustdar-egui = { workspace = true }
rustdar-radar = { workspace = true }
rustdar-overlays = { workspace = true }
reqwest = { workspace = true, features = ["default", "json"] }
rustdar-gps = { workspace = true, features = ["serial"] }
bytemuck = { version = "=1.25.2", features = ["derive"] }
chrono = { workspace = true }
egui = { workspace = true }
egui-wgpu = { workspace = true, features = ["winit"] }
log = { workspace = true }
nexrad-data = { workspace = true }
nexrad-model = { workspace = true }
nexrad-decode = { workspace = true }
nexrad-level3 = { workspace = true }
pollster = { workspace = true }
tokio = { workspace = true, features = ["rt", "rt-multi-thread"] }
winit = { workspace = true }
egui-winit = { workspace = true, features = ["clipboard", "links", "wayland", "x11"] }
env_logger = "=0.11.10"
wgpu = { workspace = true }

[target.'cfg(target_os = "android")'.dependencies]
# Force vendored OpenSSL for Android builds to avoid cross-compilation issues
openssl-sys = { workspace = true }
# Android theme detection
rustdar-android-theme = { workspace = true }

[target.'cfg(not(target_os = "android"))'.dependencies]
# Cross-platform theme detection for desktop platforms
dark-light = "=2.0.0"
