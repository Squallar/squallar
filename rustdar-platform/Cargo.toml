[package]
name = "rustdar-platform"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "rustdar-platform"
path = "src/main.rs"

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "rustdar_platform_lib"
crate-type = ["staticlib", "cdylib", "rlib"]
path = "src/lib.rs"

[dependencies]
rustdar-egui = { path = "../rustdar-egui" }
rustdar-radar = { path = "../rustdar-radar" }
rustdar-overlays = { path = "../rustdar-overlays" }
reqwest = { version = "=0.12.24", features = ["json"] }
bytemuck = { version = "=1.25.0", features = ["derive"] }
chrono = "=0.4.44"
egui = "=0.33.0"
egui-wgpu = { version = "=0.33.0", features = ["winit"] }
log = "=0.4.28"
nexrad-data = { version = "=1.0.0-rc.5", features = ["aws"] }
nexrad-model = "=1.0.0-rc.2"
nexrad-decode = "=1.0.0-rc.3"
nexrad-level3 = { path = "../nexrad-level3" }
pollster = "=0.4.0"
tokio = { version = "=1.51.1", features = ["rt", "rt-multi-thread"] }
winit = "=0.30.13"
egui-winit = { version = "=0.33.0", default-features = false, features = ["clipboard", "links", "wayland", "x11"] }
env_logger = "=0.11.8"
wgpu = "=28.0.0"

[target.'cfg(target_os = "android")'.dependencies]
# Force vendored OpenSSL for Android builds to avoid cross-compilation issues
openssl-sys = { version = "=0.9.110", features = ["vendored"] }
# Android theme detection
rustdar-android-theme = { path = "../rustdar-android-theme" }

[target.'cfg(not(target_os = "android"))'.dependencies]
# Cross-platform theme detection for desktop platforms
dark-light = "=2.0.0"
