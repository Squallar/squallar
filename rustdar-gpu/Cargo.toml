# The wgpu boundary: the one egui/wgpu renderer every target draws through —
# frame prepare/submit, texture upload, the pane mirror, the staging ring, and
# the device-request policy.
[package]
name = "rustdar-gpu"
version.workspace = true
edition.workspace = true

# NOTE (WO-RG interim): rustdar-frontend still carries its own copies of the
# wgpu feature-chooser and per-target backend blocks below — app.rs still owns
# the instance creation and the single-wgpu guard until WO-RV land 3 moves
# them here. The redundancy is deliberate and temporary; at land 3 this
# manifest becomes the one feature-chooser for the whole graph.

[dependencies]
egui = { workspace = true }
# Defaults are off at the workspace level, because egui-wgpu's `default` set
# contains `wgpu/default` -- and that contains `webgpu`, which this build must
# never enable (see the workspace `wgpu` pin). Its other two default entries are
# genuinely wanted, but both are dead outside one target, so they are requested
# from the target sections below rather than everywhere:
# `macos-window-resize-jitter-fix` is read only under
# `cfg(all(target_os = "macos", feature = ...))`, and
# `fragile-send-sync-non-atomic-wasm` only under `cfg(target_arch = "wasm32")`.
egui-wgpu = { workspace = true, features = ["winit"] }
winit = { workspace = true }
# Forced by real imports, not doc refs: `begin_frame` rewrites egui's raw input
# through rustdar_egui::normalize_touch_devices / normalize_wheel_units, and
# the mirror's tests read the tile-cache arithmetic.
rustdar-egui = { workspace = true }
# The device-class policy floor: MIRROR_MAX_SIDE and the mirror byte cascade
# live there; `device_class_of` returns its DeviceClass.
rustdar-device-profile = { workspace = true }
# Every `wgpu::` value in this crate comes through `egui_wgpu::wgpu`, the
# re-export. This entry is not there to be imported from; it exists to *choose
# wgpu's features*, which egui-wgpu cannot express (it offers only the blanket
# `wgpu/default`, and that drags in `webgpu`).
#
# `std` and `wgsl` are the target-independent half and are what egui-wgpu itself
# asks for. The backends are per target, below. There is no `webgpu` on any
# target: `rustdar_frontend::app` pins `Backends::GL` on wasm32 and Firefox has
# no stable WebGPU, so compiling that backend would only add an untested second
# rendering path -- and, until the workspace pin was fixed, a duplicate set of
# WebGPU bindings that broke `wasm-bindgen` outright.
wgpu = { workspace = true, features = ["std", "wgsl"] }

# `parking_lot` swaps wgpu's internal locks for parking_lot's. It only buys
# anything where there are threads to contend, so the browser does not take it.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
wgpu = { workspace = true, features = ["parking_lot"] }

# `clipboard` pulls `arboard`, which has no wasm backend at all -- it fails to
# compile rather than degrading. `wayland`/`x11` are likewise meaningless in a
# browser. The web build keeps only `links`; the clipboard there is the
# browser's own, reached through egui-winit's web path.
# Android is deliberately grouped with native here, preserving exactly the
# feature set it had before this split.
#
# iOS is NOT: arboard has no iOS arm, and its cfg is
# `unix, not(macos|android|emscripten)`, so iOS silently selects the X11/Wayland
# backend. That compiles and even links (x11rb is pure Rust), then fails to
# connect to a display at startup. UIPasteboard would be the real thing;
# nothing in rustdar copies text, so the feature is simply dropped there.
[target.'cfg(not(any(target_arch = "wasm32", target_os = "ios")))'.dependencies]
egui-winit = { workspace = true, features = ["clipboard", "links", "wayland", "x11"] }

[target.'cfg(target_os = "ios")'.dependencies]
egui-winit = { workspace = true, features = ["links"] }

# The native backend set, split the way wgpu's own build.rs splits it.
#
# Each of these features is a no-op on targets the corresponding backend does not
# support -- wgpu-hal gates the actual implementations by target -- so listing
# them per platform is documentation as much as it is resolution. It does keep
# wgpu-core from enabling backends that could never run, which is what the old
# blanket `wgpu/default` did.
#
# `vulkan` and `gles` are the pair wgpu itself calls the "native Vulkan"/"native
# OpenGL" platforms. Note `gles` deliberately does NOT cover the browser: WebGL
# is a separate `webgl` feature, requested in the wasm32 section below.
[target.'cfg(any(target_os = "windows", target_os = "linux", target_os = "android", target_os = "freebsd"))'.dependencies]
wgpu = { workspace = true, features = ["vulkan", "gles"] }

[target.'cfg(target_os = "windows")'.dependencies]
wgpu = { workspace = true, features = ["dx12"] }

# Metal is the only backend wgpu will use on Apple targets without an explicit
# MoltenVK/ANGLE opt-in (`vulkan-portability` / `angle`), neither of which this
# project wants. `macos-window-resize-jitter-fix` is scoped here for the same
# reason -- egui-wgpu reads it only under `cfg(target_os = "macos")`.
[target.'cfg(target_vendor = "apple")'.dependencies]
egui-wgpu = { workspace = true, features = ["macos-window-resize-jitter-fix"] }
wgpu = { workspace = true, features = ["metal"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
egui-winit = { workspace = true, features = ["links"] }
# The whole browser backend set: WebGL2 and nothing else.
#
# `webgl` is what `Backends::GL` resolves to on wasm32; the native `gles` feature
# explicitly excludes the browser, so this is not a duplicate of the section
# above. `webgpu` is absent on purpose and must stay absent.
#
# `fragile-send-sync-non-atomic-wasm` makes egui-wgpu's `CallbackResources` the
# concurrent `TypeMap` and wgpu's handles `Send + Sync` on a target that has no
# threads to be unsound about. Without it the browser build stops compiling.
wgpu = { workspace = true, features = ["webgl"] }
egui-wgpu = { workspace = true, features = ["fragile-send-sync-non-atomic-wasm"] }

[dev-dependencies]
# The charter test parses `cargo metadata`.
serde_json = { workspace = true }
# `a_paint_callbacks_own_command_buffer_reaches_the_queue` blocks on a real
# adapter request; the test is `#[ignore]`d by default and CI's gpu job opts in.
pollster = { workspace = true }
