[package]
name = "rustdar-hdf5"
version.workspace = true
edition.workspace = true

# Deliberately dependency-free apart from `thiserror` (a build-time proc macro).
# The whole point of this crate is to read the HDF5 subset that GOES GLM L2
# files use without linking libhdf5 / libnetcdf, so that rustdar can target
# wasm32 and iOS. Adding a dependency with a `build.rs` that compiles C would
# defeat it.
[dependencies]
thiserror.workspace = true

# No dev-dependencies. The oracle used to be `netcdf`, but it linked the very
# C stack this crate exists to avoid, so it has been removed from the
# workspace. Its verdict lives on as the frozen constants in `src/tests.rs`.
