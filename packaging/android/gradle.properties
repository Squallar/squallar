org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configureondemand=true

# Configuration cache is deliberately OFF.
#
# `:app` computes the rustls-platform-verifier Maven repository URL at
# configuration time by shelling out to `cargo metadata` (see app/build.gradle.kts).
# That path changes whenever Cargo resolves a different version of the
# `rustls-platform-verifier-android` crate, and a cached configuration would keep
# pointing at the old registry checkout -- which `cargo clean`/a toolchain update
# can delete outright, producing a confusing "AAR not found" much later.
org.gradle.configuration-cache=false

android.useAndroidX=true
android.nonTransitiveRClass=true
