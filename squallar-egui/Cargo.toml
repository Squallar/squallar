[package]
name = "squallar-egui"
version.workspace = true
edition.workspace = true

[features]
# Serial-port GPS controls in the settings pane.
#
# The port dropdown calls squallar_nmea_serial::detect_gps_ports, which is itself
# behind squallar-nmea-serial's `serial` feature. Until this existed, the call site was gated on
# `not(target_os = "android")` while the callee was gated on a *feature* — and an
# OS cfg cannot satisfy a feature cfg, so every non-Android target compiled the
# block and then demanded `serial` from whoever was building. That is why this
# crate never built on its own; only a consumer that happened to enable `serial`
# could build it at all.
#
# Off by default: a target without serial ports (web) simply leaves it off, and
# the two gates now agree because they are the same kind of gate.
gps-serial = ["squallar-nmea-serial/serial"]

# There is no `basemap-vector` feature any more. The PMTiles archive IS the
# basemap — the raster path it replaced (CartoDB) was deleted with the feature
# on 2026-08-29 — so `pmtiles` is an unconditional dependency below, on both
# targets. The tessellation half is `walkers/mvt`, likewise unconditional.

[dependencies]
web-time = { workspace = true }
# The basemap row: the committed style (moved here so the ~222 KB of JSON is
# compiled in ONCE) and the styled-tile wire the frame pump offloads through.
squallar-basemap = { workspace = true }
squallar-geo = { workspace = true }
squallar-kv = { workspace = true }
# The pane caps (MAX_PANES_DESKTOP/MOBILE) live in the device-class policy
# floor since WO-RD -- the UI narrows at runtime by width class and reads the
# caps from below rather than defining them.
squallar-device-profile = { workspace = true }
squallar-radar = { workspace = true }
squallar-overlays = { workspace = true }
squallar-source = { workspace = true }
squallar-units = { workspace = true }
# Vocabulary only (default-features = false, re-declared deliberately): the
# facade's provider arms (`os-providers`, `serial`) and their OS dependencies
# must never enter the UI crate's graph — the shell turns them on per target.
squallar-location = { workspace = true, default-features = false }
squallar-nmea-serial = { workspace = true }
chrono = { workspace = true }
egui = { workspace = true }
log = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
# `mvt` is enabled UNCONDITIONALLY, and that is a rule rather than a default.
# The feature changes the shape of `walkers::Tile`: without it the enum has one
# variant, with it `Tile::Vector` also exists. Gating it would mean a
# `#[cfg(feature = ...)]` match arm over that enum, which is behaviour forked
# inside a function body -- what ARCHITECTURE.md forbids of a `cfg` ("may select
# a value, a dependency or a type alias; may never fork behaviour inside a
# function body"). On unconditionally, the enum always has both variants and
# every match over it is plain code.
walkers = { workspace = true, features = ["mvt"] }
# Channels and the concurrency-bounded tile fetch loop in `tile_source`. Same
# pin as squallar-overlays; walkers uses this version too, so it is already in the
# graph either way.
futures = "=0.3.34"
# Bounded tile cache with LRU eviction. Pinned to the version walkers already
# resolves, so this adds no new node to the dependency graph.
lru = "=0.18.4"
# Basemap tiles go through the workspace TLS pin like every other squallar
# request. No extra features: `tile_source` needs neither `json` nor `default`,
# and `default` would re-enable `default-tls` (= platform verifier + aws-lc-rs)
# and drag `aws-lc-sys` back in.
#
# This dependency is the entire point of `tile_source`: `walkers::HttpTiles`
# builds its own reqwest 0.12 client with `rustls-tls`, i.e. bundled
# `webpki-roots`, and offers no way to replace it.
reqwest = { workspace = true }

# The PMTiles v3 archive reader — the basemap's substrate, unconditional since
# the CartoDB raster path was deleted. Portable half only: the workspace pin is
# `default-features = false, features = ["__async"]`, so what arrives here is
# the reader, its async core and nothing that touches a filesystem or a socket.
# The `http-async` backend is added for non-wasm targets in the table below --
# the same dependency named twice, re-unified to one node.
#
# One consequence worth naming because it cuts against the `tokio` comment
# below: `__async` is `dep:tokio`, unconditionally, so **tokio is in the wasm32
# graph** -- measured while this was still a feature, `cargo tree -p
# squallar-egui --target wasm32-unknown-unknown -e normal`, 281 nodes without
# it and 289 with, `tokio v1.53.1` among the eight. That is survivable and not
# a contradiction of the rule below, which is about tokio's *feature set*:
# pmtiles asks for `default-features = false, features = ["io-util"]`, and
# `io-util` is one of the five tokio permits on wasm. Shipped cost on the web
# artifact, measured 2026-08-28: +392,442 B of `.wasm`, +2.96% -- the price of
# a basemap that is not watermarked at source.
# `write` is `PmTilesStreamWriter` for `basemap_download`'s segment writer. It
# is in the crate's default set, which the workspace pin deliberately turns
# off, so it is asked for by name here (confirmed against pmtiles-0.23.0's
# manifest: `write = ["dep:countio", "dep:flate2", "dep:twox-hash"]` — all
# pure Rust, so it costs the wasm32 target nothing it cannot compile).
# Unconditional because BOTH targets write segments: the artifact is built in
# a `Cursor<Vec<u8>>` and only the finished bytes reach a target's store.
pmtiles = { workspace = true, features = ["write"] }

# `pmt_index`'s one decode: PMTiles v3 directories are gzip-deflated when
# `internal_compression = 2`, which is what planetiler emits. The workspace pin
# is the pure-Rust miniz_oxide backend (see squallar-netcdf's warning against
# `zlib-ng`), so it compiles on wasm32 unchanged. Already in the graph twice
# (squallar-radar, squallar-overlays); no new node.
flate2 = { workspace = true }

# The terrain hillshade archive's tiles are WebP (`tile_type = 4`), decoded and
# remapped in `terrain::remap_hillshade` before upload. `webp` is image 0.25's
# pure-Rust decoder (`image-webp`), so it compiles on wasm32 unchanged. `png`
# stays because the dev-only loopback tile fixtures are PNGs and a
# `[dev-dependencies]` re-declaration of the same crate would just re-unify to
# this set anyway. No new graph node: `walkers` already depends on this exact
# version with `jpeg` + `png`; this line adds one decoder module to it.
image = { version = "=0.25.10", default-features = false, features = [
    "png",
    "webp",
] }

# The tile IO runtime. Native only, and *not* in the shared `[dependencies]`
# table: tokio rejects most of its feature set on wasm outright
# (`compile_error!("Only features sync,macros,io-util,rt,time are supported on
# wasm.")`), so a target-gated entry is the only way to depend on it without
# making this crate the reason wasm32 stops building. wasm gets `spawn_local`
# below instead.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tokio = { workspace = true, features = ["rt", "sync", "net", "time"] }
# `http-async` is pmtiles' range-request backend over `reqwest`. It enables
# `dep:reqwest` at `0.13.1`, which resolves to the `=0.13.4` this crate already
# depends on unconditionally, so it adds no node to the graph.
#
# The target gate is REQUIRED, not house style. `AsyncBackend::read` returns
# `impl Future<Output = ...> + Send` (`pmtiles-0.23.0/src/async_reader.rs:424`)
# and on wasm32 `reqwest::Response` is not `Send`, so `HttpBackend` fails to
# satisfy its own trait. Measured in the CI image, `cargo check -p squallar-egui
# --target wasm32-unknown-unknown --features pmtiles/http-async`:
# two E0277s, "future returned by `read` is not `Send`", at
# `src/backends/http.rs:67`.
#
# The consequence reaches past this manifest, so it is written here rather than
# discovered later: **none of pmtiles' four shipped backends works on wasm32**
# -- `mmap` is memmap2, `http` is the above, and `s3`/`object_store` are heavier
# forms of the same native shape. The web target needs its own `AsyncBackend`
# impl, and that impl has to yield a `Send` future on a target where `JsValue`
# is not `Send`, i.e. the JS work goes in `spawn_local` and the bytes come back
# over a channel. `basemap_archive.rs` DOES that -- `RangeSource` /
# `HttpRangeSource` / `ArchiveRangeSource`, with the wasm arm running the fetch
# in `spawn_local` and returning bytes over a oneshot, and `RANGE_ATTEMPTS`
# retrying a `200` (measured: 2 of 11 range requests against a real host came
# back 200 with the full body). Web draws vector tiles.
#
# This line's job is therefore narrower than the paragraph above implies: it
# keeps pmtiles' own non-portable backend off the target that cannot compile
# it. The reader reaches the archive through OUR range source on both targets.
#
# The sentence this replaces read "Nothing here does that yet" long after it
# stopped being true, and cost an agent a full pass rebuilding what existed.
pmtiles = { workspace = true, features = ["http-async"] }

# The wasm half of the same split: no threads, no tokio: the fetch loop runs on
# the browser's event loop and `reqwest` becomes `fetch()`, which also means the
# browser's trust store rather than anything shipped in the artifact.
[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen-futures = "=0.4.78"

[dev-dependencies]
# `image` moved to `[dependencies]` when the terrain hillshade landed: the
# WebP decode is now a shipped code path, not only the test fixtures' PNG
# encoder. The tests keep using it from there.

# Same split as `[dependencies]` above, for the same reason: `rt-multi-thread` is
# rejected on wasm, and `--all-targets` compiles dev-deps, so leaving this ungated
# breaks `cargo check --target wasm32-unknown-unknown`.
[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
# Drives the async tile tests. Not linked into any shipped binary.
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }

# **Dev only, and gated with `tokio` above for the same reason.**
# `tiles/real_terrain_tests.rs` - the only consumer - drives the height reader
# end to end: archive bytes off a loopback server, through the reader, into the
# resample that turns them into a `HeightField`. Proving the two halves join
# needs the crate that owns the second one. That test is native-only (it binds a
# loopback port), so the dependency is too: `--all-targets` compiles dev-deps,
# and an ungated entry would build this crate and its `image` decoder into every
# wasm check for nothing.
#
# It is NOT a normal dependency: nothing shipped here decodes elevation, the
# resample runs inside the offload worker (which is what `squallar-elevation`
# exists for), and the renderer takes a plain `volume_view::GroundHeightField`
# carrier rather than the elevation crate's own type for exactly that reason.
squallar-elevation = { workspace = true }
