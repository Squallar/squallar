[package]
name = "squallar-overlays"
version.workspace = true
edition.workspace = true

[dependencies]
web-time = { workspace = true }
chrono = { workspace = true }
flate2 = { workspace = true }
# Keep this pin local: Cargo ignores a member's `default-features = false` when
# the workspace entry leaves defaults on.
# grib defaults pull `openjpeg-sys`, `libaec-sys`, `proj` (-> `proj-sys` ->
# `libsqlite3-sys`, `link-cplusplus`); none cross-compile to wasm32 or iOS.
# Dropped features are unused by HRRR except `gridpoints-proj`: HRRR is grid
# template 3.30 (Lambert conformal), reimplemented in `hrrr::lambert`.
# HRRR section 5 is DRT 5.3 (pure Rust in grib), not 5.40/5.42.
# `time-calculation` backs `temporal_raw_info()`.
grib = { version = "=0.18.2", default-features = false, features = [
    "png-unpack-with-png-crate",
    "time-calculation",
] }
# **The same `png` grib's own 5.41 arm uses**, named directly so `mrms::decode`
# can stream section 7 a row at a time instead of taking grib's whole-image
# buffer. Equal to the version grib resolves, so the lock gains no package;
# `decode::tests` pins that the two paths agree value for value.
png = { version = "=0.18.1", default-features = false }
# **`HitCellMap`'s hasher, and nothing else in this crate.** The rasterizer's
# hit cells are keyed by a quarter-resolution cell index it computes itself, so
# the key is internal, bounded by the texture's own grid, and not something a
# feed can choose -- which is the entire property `RandomState` exists to
# defend, and it is not needed here. `record` runs once per drawn point;
# SipHash-1-3 over a `u32` was 1.31% of a 60 s native profile.
#
# **No new package.** This is the version `egui-wgpu` already resolves through
# `type-map` on every target this workspace builds for, so naming it directly
# adds a `[dependencies]` line and nothing to the lockfile -- the same argument
# `png` above makes for grib's. Zero transitive dependencies of its own, and
# `no_std`-capable, so nothing follows it onto wasm32 either.
rustc-hash = "=2.1.3"
squallar-units = { workspace = true }
futures = "=0.3.34"
# NetCDF4 reading and CF unpacking for the GLM and GMGSI granules, both of
# which are NetCDF4. A Band 0 leaf with no first-party dependencies of its own.
squallar-netcdf = { workspace = true }
log = { workspace = true }
# `json` only, NOT `default`: reqwest's `default-tls` aliases `rustls` with
# aws-lc-rs, pulling `aws-lc-sys` in. TLS backend comes from the workspace pin.
reqwest = { workspace = true, features = ["json"] }
roxmltree = "=0.21.1"
# For `origins::DataSources`, `tls` (incl. the no-User-Agent client METAR/SPC
# need -- see `metar::fetch`), and the feature vocabulary this crate
# re-exports from `types`. The substrate under this crate AND `squallar-radar`;
# `tests/charter.rs` there pins that this crate depends on no radar code.
squallar-source = { workspace = true }
# The geo vocabulary (GeoBounds, GeoPolygon, GeoPolygonRing) and the Mercator
# helpers, named directly since WO-G4 killed the `types` re-export shim.
squallar-geo = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tiny-skia = "=0.12.0"

[dev-dependencies]
# Test fixtures only: `glm::tests` and `gmgsi::decode::tests` write HDF5 files
# with `FileBuilder` to feed the decoders. Shipped code in this crate reaches
# HDF5 exclusively through `squallar-netcdf`, which owns the pin and the
# feature rationale -- keep the two versions equal.
hdf5-pure = "=0.42.0"

# Must stay target-gated: tokio rejects `fs` on wasm ("Only features
# sync,macros,io-util,rt,time are supported on wasm") -- a hard build failure.
# Backs the native-only zone disk cache in `nws::zones`.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tokio = { workspace = true, features = ["fs"] }

# Target-gated for the same reason as the entry above: `rt-multi-thread` is not
# one of the features tokio accepts on wasm, and an ungated dev-dependency still
# breaks `cargo check --all-targets --target wasm32-unknown-unknown`.
[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
# Drives the `#[ignore]`d live-network checks (IEM and the S3 buckets), and
# `net`/`io-util`/`sync` serve the frame-gate tests' loopback bucket ON THE
# TEST'S OWN RUNTIME. Named rather than inherited from reqwest's transitive
# enablement: a poll-counted loop whose exit condition lives on another OS
# thread is not bounded by its own count, which is what made both
# `two_frame_fetches_share_one_gate…` tests flaky under load.
tokio = { workspace = true, features = [
    "macros",
    "rt-multi-thread",
    "net",
    "io-util",
    "sync",
] }

[target.'cfg(target_os = "android")'.dependencies]
# Deliberately empty. `libsqlite3-sys` was pinned here with `features =
# ["bundled"]` because proj-sys (grib -> proj) needs SQLite3 headers the NDK
# sysroot does not ship; re-enabling grib's `gridpoints-proj` brings that back
# and breaks the Android build. `openssl-sys` was pinned with `features =
# ["vendored"]`; nothing links OpenSSL any more.
