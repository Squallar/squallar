[package]
name = "rustdar-web"
version.workspace = true
edition.workspace = true

[lib]
# `cdylib` is what wasm-bindgen links; `rlib` keeps the crate usable as a normal
# dependency so `cargo test --workspace` and rust-analyzer see it on a host.
crate-type = ["cdylib", "rlib"]

# binaryen assumes the wasm MVP unless told otherwise, so every target feature
# rustc enables by default for wasm32-unknown-unknown (six of them; check with
# `rustc --print cfg --target wasm32-unknown-unknown`) has to be re-declared or
# wasm-opt rejects the module -- bulk-memory first, as
# `[wasm-validator error] memory.copy operations require bulk memory operations`.
# These enable *validation* of instructions already present; they introduce
# nothing.
#
# A toolchain bump that turns on a seventh feature fails the same way. Add the
# matching `--enable-` flag rather than dropping wasm-opt: skipping it measurably
# slows Chromium down.
[package.metadata.wasm-pack.profile.release]
wasm-opt = [
    "-O",
    "--enable-bulk-memory",
    "--enable-multivalue",
    "--enable-mutable-globals",
    "--enable-nontrapping-float-to-int",
    "--enable-reference-types",
    "--enable-sign-ext",
]

# Not wasm32-gated on purpose. The pure-logic parts (config key mapping,
# geolocation reading -> Fix) compile and are tested on the host; there is no
# wasm test runner here, so gating the crate would make those tests never run.
[dependencies]
rustdar-egui = { workspace = true }
rustdar-kv = { workspace = true }
# Types only (Fix). The browser's Geolocation replaces the serial reader, so
# the `serial` feature stays off, as in rustdar-app.
# The vocabulary plus this target's own arm and nothing else
# (default-features = false, re-declared deliberately): `web-provider` is the
# browser arm (`rustdar_location::web`, moved out of this crate at WO-RL-4);
# the OS/serial/android fences must never enter the web graph.
rustdar-location = { workspace = true, default-features = false, features = [
    "web-provider",
] }
log = { workspace = true }

# Browser-only, and gated so a native `cargo build` does not pull web-sys and
# wasm-bindgen into the graph at all.
[target.'cfg(target_arch = "wasm32")'.dependencies]
rustdar-app = { workspace = true }
# The job engine: `worker` runs `execute_encoded`, `worker_port` feeds the
# funnel, and `worker_protocol` folds `wire_identity`'s digest into the build
# token (extracted from rustdar-app at WO-RW).
rustdar-worker = { workspace = true }
winit = { workspace = true }
# Pinned to what the egui/wgpu stack already resolves. wasm-bindgen and web-sys
# have to agree with the copy egui-winit and wgpu link against or the generated
# bindings do not line up; these move when that stack moves.
wasm-bindgen = "=0.2.126"
wasm-bindgen-futures = "=0.4.76"
js-sys = "=0.3.103"
console_error_panic_hook = "=0.1.7"
console_log = "=1.1.0"

[target.'cfg(target_arch = "wasm32")'.dependencies.web-sys]
version = "=0.3.103"
# web-sys gates every interface behind its own feature. Listing them explicitly
# rather than taking a blanket set keeps the generated glue to what is used.
features = [
    "Window",
    "Document",
    "Element",
    "HtmlCanvasElement",
    "Storage",
    "Navigator",
    # Theme detection. Enabled transitively by winit today, but web-sys features
    # are additive across the graph and relying on that would mean this crate
    # breaks when an unrelated dependency drops the feature.
    "MediaQueryList",
    # The geolocation/permission features moved to rustdar-location's wasm32
    # block with the browser arm (WO-RL-4).
    # The rasterization worker (`src/worker.rs`, `src/worker_port.rs`).
    # `WorkerType` is what makes it a *module* worker, which it has to be: it
    # `import`s the ES module `wasm-pack --target web` emits.
    "Worker",
    "WorkerOptions",
    "WorkerType",
    "DedicatedWorkerGlobalScope",
    "MessageEvent",
]

# For `tests/pwa_assets.rs`. Target-gated because a plain `[dev-dependencies]`
# entry is built for every target under `--all-targets`, and this test is
# `#![cfg(not(target_arch = "wasm32"))]` -- so an ungated entry would add a
# dependency tree to `cargo clippy --target wasm32-unknown-unknown -p rustdar-web
# --all-targets` that nothing in that build uses.
#
# Not because rustdar-radar has no wasm32 build: it does, and the shipped module
# links it through rustdar-app. `rustls` and `rayon` are the only pieces
# target-gated off wasm (see rustdar-radar/Cargo.toml); reqwest compiles there
# and routes through the browser's `fetch()`.
[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
# The single declaration of every network origin rustdar reads from; the test
# derives the service worker's never-cache hostnames from it. Named at the
# substrate rather than through `rustdar_radar::sources`, which is a re-export
# of exactly this module.
rustdar-source = { workspace = true }
serde_json = { workspace = true }

# For `tests/tier1_wasm.rs` -- the Tier-1 browser gate, run in a real browser
# by `wasm-pack test --headless --firefox|--chrome`. The mirror image of the
# section above: gated to wasm32 so a host `cargo test` and `cargo clippy
# --all-targets` never build it.
#
# wasm-bindgen-test releases in lockstep with wasm-bindgen; the resolver picks
# the train that satisfies the `=0.2.126` pin above, and the workflow's
# `cargo tree -i wasm-bindgen` gate is what keeps that single-versioned.
[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test = "=0.3.76"
# For the first-egui-frame test; same pinned copy the app links.
egui = { workspace = true }
# For the JobRequest transfer test: the described envelope is constructed the
# way production constructs it — a typed input (DecodeJob, rustdar-radar) under
# a JobGeometry (rustdar-source) over GeoBounds (rustdar-geo). All three are
# already in this target's graph through rustdar-app, so these lines add
# zero compiled packages; they only let the test spell the types.
rustdar-radar = { workspace = true }
rustdar-source = { workspace = true }
rustdar-geo = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dev-dependencies.web-sys]
version = "=0.3.103"
# Additive on top of the [dependencies] list (web-sys features unify across
# the graph): only what the Tier-1 tests need beyond the app itself -- a real
# `MessageChannel` transfer.
features = ["MessageChannel", "MessagePort"]
